<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Auth Screen */
    .auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      color: #333;
    }

    .auth-card h1 {
      margin-bottom: 30px;
      text-align: center;
      color: #667eea;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .auth-card input:focus {
      outline: none;
      border-color: #667eea;
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .auth-card button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* Main App */
    .app-screen {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    .section {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }

    .section h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .match-card {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.3s;
    }

    .match-card:hover {
      transform: translateY(-5px);
    }

    .match-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
    }

    .knockout-select {
      margin: 15px 0;
    }

    .knockout-select select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #38a169;
    }

    .deadline {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: rgba(255,255,255,0.7);
    }

    .leaderboard-list {
      list-style: none;
    }

    .leaderboard-item {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
    }

    .leaderboard-rank {
      font-weight: bold;
      color: #fbbf24;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }

    .error {
      background: rgba(255,0,0,0.2);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }

    .success {
      background: rgba(72,187,120,0.2);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }

    .admin-section {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }

    .admin-section h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .admin-section select, .admin-section input {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }

    .admin-btn {
      background: #ed8936;
      padding: 8px 15px;
    }

    .admin-btn:hover {
      background: #dd6b20;
    }
  </style>
</head>

<body>
<div class="container">
  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1>? World Cup Predictor</h1>
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button onclick="handleSignUp()">Create Account</button>
      <button onclick="handleSignIn()" style="background: #48bb78;">Login</button>
      <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #666;">
        Demo: test@example.com / test123456
      </p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="appScreen" class="app-screen">
    <div class="header">
      <h1>? World Cup Predictor</h1>
      <div>
        <span id="userEmail" style="margin-right: 15px;"></span>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <div class="section">
      <h2>?? Upcoming & Active Matches</h2>
      <div id="matchesContainer" class="matches-grid"></div>
    </div>

    <div class="section">
      <h2>?? Leaderboard</h2>
      <div id="leaderboardContainer"></div>
    </div>

    <!-- Admin Section (only shown for admin email) -->
    <div id="adminSection" class="section admin-section" style="display: none;">
      <h3>?? Admin Panel - Set Match Results</h3>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <select id="adminMatchSelect" style="flex: 1; min-width: 200px;">
          <option value="">Select a match</option>
        </select>
        <input type="number" id="adminScoreA" placeholder="Score A" style="width: 80px;">
        <span>vs</span>
        <input type="number" id="adminScoreB" placeholder="Score B" style="width: 80px;">
        <input type="text" id="adminAdvancingTeam" placeholder="Advancing team (knockout)">
        <button class="admin-btn" onclick="adminSetResult()">Set Result & Calculate Points</button>
      </div>
      <p style="font-size: 12px; margin-top: 10px; color: #ccc;">
        Note: Setting a result will automatically calculate points for all predictions
      </p>
    </div>
  </div>
</div>

<script>
// Supabase configuration
const supabaseUrl = "https://igatvhqatxrhgnshmdld.supabase.co";
const supabaseAnonKey = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

let currentUser = null;

// ============================================
// AUTHENTICATION FUNCTIONS
// ============================================

async function handleSignUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    alert('Please enter email and password');
    return;
  }
  
  try {
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          username: email.split('@')[0]
        }
      }
    });
    
    if (error) throw error;
    
    alert('Account created! Please login with your credentials.');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  } catch (error) {
    alert('Sign up error: ' + error.message);
  }
}

async function handleSignIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    alert('Please enter email and password');
    return;
  }
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });
    
    if (error) throw error;
    
    currentUser = data.user;
    showApp();
  } catch (error) {
    alert('Login failed: ' + error.message);
  }
}

async function handleLogout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
}

// ============================================
// CHECK AUTH STATE ON LOAD
// ============================================

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  
  if (session) {
    currentUser = session.user;
    showApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
}

// ============================================
// MAIN APP FUNCTIONS
// ============================================

async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmail').textContent = currentUser.email;
  
  // Show admin panel for specific admin email
  if (currentUser.email === 'admin@example.com') {
    document.getElementById('adminSection').style.display = 'block';
    await loadAdminMatches();
  }
  
  await loadMatches();
  await loadLeaderboard();
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = '<div class="loading">Loading matches...</div>';
  
  try {
    const { data: matches, error } = await supabase
      .from('matches')
      .select('*')
      .order('kickoff_time', { ascending: true });
    
    if (error) throw error;
    
    if (!matches || matches.length === 0) {
      container.innerHTML = '<div class="loading">No matches available</div>';
      return;
    }
    
    // Get user's existing predictions
    const { data: predictions } = await supabase
      .from('predictions')
      .select('*')
      .eq('user_id', currentUser.id);
    
    const predictionMap = {};
    if (predictions) {
      predictions.forEach(p => {
        predictionMap[p.match_id] = p;
      });
    }
    
    container.innerHTML = '';
    
    for (const match of matches) {
      const isDeadlinePassed = new Date(match.kickoff_time) < new Date();
      const userPrediction = predictionMap[match.id];
      const isFinished = match.finished;
      
      const matchCard = document.createElement('div');
      matchCard.className = 'match-card';
      
      let knockoutHtml = '';
      if (match.is_knockout && !isDeadlinePassed && !isFinished) {
        knockoutHtml = `
          <div class="knockout-select">
            <select id="advancing-${match.id}">
              <option value="">Select advancing team (if draw)</option>
              <option value="${match.team_a}" ${userPrediction && userPrediction.pred_advancing_team === match.team_a ? 'selected' : ''}>${match.team_a}</option>
              <option value="${match.team_b}" ${userPrediction && userPrediction.pred_advancing_team === match.team_b ? 'selected' : ''}>${match.team_b}</option>
            </select>
          </div>
        `;
      }
      
      let predictionDisplay = '';
      if (userPrediction && userPrediction.points !== null) {
        predictionDisplay = `
          <div style="margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 12px;">
            Your prediction: ${userPrediction.pred_score_a} - ${userPrediction.pred_score_b}
            ${userPrediction.pred_advancing_team ? ` | Advances: ${userPrediction.pred_advancing_team}` : ''}
            ${userPrediction.points > 0 ? ` | Points earned: ${userPrediction.points}` : userPrediction.points === 0 && isFinished ? ' | Points: 0' : ''}
          </div>
        `;
      }
      
      matchCard.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          ${match.is_knockout ? ' ?? Knockout' : ' ?? Group Stage'}
        </div>
        ${isFinished ? `<div style="text-align: center; color: #fbbf24; margin-bottom: 10px; font-size: 18px;">Final: ${match.score_a} - ${match.score_b}${match.advancing_team ? ' | Advances: ' + match.advancing_team : ''}</div>` : ''}
        ${!isDeadlinePassed && !isFinished ? `
          <div class="prediction-inputs">
            <input type="number" id="score-a-${match.id}" placeholder="${match.team_a}" value="${userPrediction ? userPrediction.pred_score_a : ''}">
            <span style="font-size: 20px;">vs</span>
            <input type="number" id="score-b-${match.id}" placeholder="${match.team_b}" value="${userPrediction ? userPrediction.pred_score_b : ''}">
          </div>
          ${knockoutHtml}
          <button class="submit-btn" onclick="submitPrediction('${match.id}', ${match.is_knockout})">
            ${userPrediction ? 'Update Prediction' : 'Submit Prediction'}
          </button>
        ` : isFinished ? `
          <div style="text-align: center; color: #aaa;">Match Finished</div>
          ${predictionDisplay}
        ` : `
          <div style="text-align: center; color: #fbbf24;">? Deadline Passed</div>
          ${predictionDisplay}
        `}
        <div class="deadline">
          ?? Kickoff: ${new Date(match.kickoff_time).toLocaleString()}
        </div>
      `;
      
      container.appendChild(matchCard);
    }
  } catch (error) {
    console.error('Error loading matches:', error);
    container.innerHTML = '<div class="error">Error loading matches. Please refresh the page.</div>';
  }
}

async function submitPrediction(matchId, isKnockout) {
  const scoreA = document.getElementById(`score-a-${matchId}`).value;
  const scoreB = document.getElementById(`score-b-${matchId}`).value;
  
  if (!scoreA || !scoreB) {
    alert('Please enter both scores');
    return;
  }
  
  let advancingTeam = null;
  if (isKnockout) {
    const select = document.getElementById(`advancing-${matchId}`);
    if (select) {
      advancingTeam = select.value;
      if (!advancingTeam) {
        alert('Please select which team advances for knockout matches');
        return;
      }
    }
  }
  
  try {
    // First check if prediction exists
    const { data: existingPrediction } = await supabase
      .from('predictions')
      .select('id')
      .eq('user_id', currentUser.id)
      .eq('match_id', matchId)
      .single();
    
    let error;
    
    if (existingPrediction) {
      // Update existing prediction
      const { error: updateError } = await supabase
        .from('predictions')
        .update({
          pred_score_a: parseInt(scoreA),
          pred_score_b: parseInt(scoreB),
          pred_advancing_team: advancingTeam || null,
          updated_at: new Date()
        })
        .eq('id', existingPrediction.id);
      error = updateError;
    } else {
      // Insert new prediction
      const { error: insertError } = await supabase
        .from('predictions')
        .insert({
          user_id: currentUser.id,
          match_id: matchId,
          pred_score_a: parseInt(scoreA),
          pred_score_b: parseInt(scoreB),
          pred_advancing_team: advancingTeam || null
        });
      error = insertError;
    }
    
    if (error) throw error;
    
    alert('Prediction saved successfully!');
    await loadMatches(); // Reload to show updated prediction
  } catch (error) {
    if (error.message.includes('deadline passed')) {
      alert('Deadline passed! Cannot submit prediction after match starts.');
    } else {
      alert('Error saving prediction: ' + error.message);
    }
  }
}

async function loadLeaderboard() {
  const container = document.getElementById('leaderboardContainer');
  container.innerHTML = '<div class="loading">Loading leaderboard...</div>';
  
  try {
    const { data: leaderboard, error } = await supabase
      .from('leaderboard')
      .select('*')
      .limit(20);
    
    if (error) throw error;
    
    if (!leaderboard || leaderboard.length === 0) {
      container.innerHTML = '<div class="loading">No users yet</div>';
      return;
    }
    
    container.innerHTML = '<div class="leaderboard-list"></div>';
    const list = container.querySelector('.leaderboard-list');
    
    leaderboard.forEach((user, index) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      item.innerHTML = `
        <span>
          <span class="leaderboard-rank">${index + 1}.</span> 
          ${user.username || 'User'}
        </span>
        <span style="font-weight: bold; color: #fbbf24;">${user.total_points || 0} pts</span>
      `;
      list.appendChild(item);
    });
  } catch (error) {
    console.error('Error loading leaderboard:', error);
    container.innerHTML = '<div class="error">Error loading leaderboard</div>';
  }
}

// ============================================
// ADMIN FUNCTIONS
// ============================================

async function loadAdminMatches() {
  const { data: matches } = await supabase
    .from('matches')
    .select('id, team_a, team_b, finished')
    .eq('finished', false)
    .order('kickoff_time');
  
  const select = document.getElementById('adminMatchSelect');
  select.innerHTML = '<option value="">Select a match</option>';
  
  if (matches) {
    matches.forEach(match => {
      const option = document.createElement('option');
      option.value = match.id;
      option.textContent = `${match.team_a} vs ${match.team_b}`;
      select.appendChild(option);
    });
  }
}

async function adminSetResult() {
  const matchId = document.getElementById('adminMatchSelect').value;
  const scoreA = parseInt(document.getElementById('adminScoreA').value);
  const scoreB = parseInt(document.getElementById('adminScoreB').value);
  const advancingTeam = document.getElementById('adminAdvancingTeam').value;
  
  if (!matchId) {
    alert('Please select a match');
    return;
  }
  
  if (isNaN(scoreA) || isNaN(scoreB)) {
    alert('Please enter valid scores');
    return;
  }
  
  try {
    // Get match details first
    const { data: match } = await supabase
      .from('matches')
      .select('is_knockout')
      .eq('id', matchId)
      .single();
    
    const updateData = {
      score_a: scoreA,
      score_b: scoreB,
      finished: true
    };
    
    if (match.is_knockout && advancingTeam) {
      updateData.advancing_team = advancingTeam;
    }
    
    const { error } = await supabase
      .from('matches')
      .update(updateData)
      .eq('id', matchId);
    
    if (error) throw error;
    
    alert('Match result set! Points have been calculated automatically.');
    
    // Reset form
    document.getElementById('adminScoreA').value = '';
    document.getElementById('adminScoreB').value = '';
    document.getElementById('adminAdvancingTeam').value = '';
    
    // Refresh everything
    await loadAdminMatches();
    await loadMatches();
    await loadLeaderboard();
  } catch (error) {
    alert('Error setting result: ' + error.message);
  }
}

// ============================================
// DEBUG FUNCTIONS (available in console)
// ============================================

window.debug = {
  listMatches: async () => {
    const { data } = await supabase.from('matches').select('*');
    console.table(data);
    return data;
  },
  listPredictions: async () => {
    const { data } = await supabase.from('predictions').select('*, profiles(username)');
    console.table(data);
    return data;
  },
  clearPredictions: async () => {
    if (confirm('Delete all predictions?')) {
      await supabase.from('predictions').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      alert('Predictions cleared');
      location.reload();
    }
  }
};

// Initialize
checkAuth();
</script>
</body>
</html>
