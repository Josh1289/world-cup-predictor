<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      max-width: 450px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .login-container h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
      color: #FF6B35;
    }

    .login-container input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }

    .login-container button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .login-container button:last-child {
      background: #666;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      display: none;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      color: #FF6B35;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .match-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .match-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid #FF6B35;
    }

    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      background: #FFF3E0;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
      color: #FF6B35;
    }

    .finished-badge {
      background: #4CAF50;
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
    }

    .result-display {
      text-align: center;
      background: #4CAF50;
      color: white;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .your-prediction {
      text-align: center;
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .deadline-passed {
      text-align: center;
      padding: 10px;
      background: #dc3545;
      color: white;
      border-radius: 10px;
    }

    .deadline {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: #666;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      color: #FF6B35;
    }
  </style>
</head>
<body>

<div id="loginSection" class="login-container">
  <h2>?? WORLD CUP 2026 ??</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<div id="mainSection" class="main-container">
  <div class="header">
    <h2>?? WORLD CUP 2026 PREDICTOR ??</h2>
    <div>
      <span id="userEmail" style="margin-right: 15px;"></span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>
  <div id="matchesContainer"></div>
</div>

<script>
// Supabase client
const SUPABASE_URL = "https://igatvhqatxrhgnshmdld.supabase.co";
const SUPABASE_KEY = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function showMessage(msg, isError) {
  const msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = msg;
  msgDiv.style.color = isError ? '#dc3545' : '#28a745';
  setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
}

// LOGIN
async function handleLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMessage('Please enter email and password', true);
    return;
  }
  
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  if (error) {
    showMessage(error.message, true);
  } else {
    currentUser = data.user;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    loadMatches();
  }
}

// SIGNUP
async function handleSignup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMessage('Please enter email and password', true);
    return;
  }
  
  if (password.length < 6) {
    showMessage('Password must be at least 6 characters', true);
    return;
  }
  
  const { error } = await supabase.auth.signUp({ email, password });
  
  if (error) {
    showMessage(error.message, true);
  } else {
    showMessage('Account created! Please login.', false);
  }
}

// LOGOUT
async function handleLogout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('mainSection').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

// LOAD MATCHES
async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = '<div style="text-align:center; padding:40px;">Loading matches...</div>';
  
  // Refresh session first
  const { data: { session } } = await supabase.auth.getSession();
  
  if (!session) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">Please login again</div>';
    return;
  }
  
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*')
    .order('kickoff_time', { ascending: true });
  
  if (error) {
    console.error('Error:', error);
    container.innerHTML = `<div style="text-align:center; padding:40px;">Error: ${error.message}</div>`;
    return;
  }
  
  if (!matches || matches.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">No matches found. Please run the SQL to add matches.</div>';
    return;
  }
  
  // Get user's predictions
  const { data: predictions } = await supabase
    .from('predictions')
    .select('*')
    .eq('user_id', currentUser.id);
  
  const predMap = {};
  if (predictions) {
    predictions.forEach(p => { predMap[p.match_id] = p; });
  }
  
  container.innerHTML = '';
  
  for (const match of matches) {
    const userPred = predMap[match.id];
    const isFinished = match.finished;
    const deadlinePassed = new Date(match.kickoff_time) < new Date();
    
    const card = document.createElement('div');
    card.className = 'match-card';
    
    let predictionHtml = '';
    
    if (isFinished) {
      predictionHtml = `<div class="result-display">? FINAL: ${match.score_a} - ${match.score_b}</div>`;
      if (userPred) {
        predictionHtml += `<div class="your-prediction">Your prediction: ${userPred.pred_score_a} - ${userPred.pred_score_b} ${userPred.points ? `| POINTS: ${userPred.points}` : ''}</div>`;
      }
    } else if (deadlinePassed) {
      predictionHtml = `<div class="deadline-passed">? DEADLINE PASSED</div>`;
      if (userPred) {
        predictionHtml += `<div class="your-prediction">Your prediction: ${userPred.pred_score_a} - ${userPred.pred_score_b}</div>`;
      }
    } else {
      predictionHtml = `
        <div class="prediction-inputs">
          <input type="number" id="scoreA_${match.id}" min="0" max="10" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
          <span style="font-size:20px;">-</span>
          <input type="number" id="scoreB_${match.id}" min="0" max="10" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
        </div>
        <button class="submit-btn" onclick="savePrediction('${match.id}')">${userPred ? 'UPDATE' : 'SUBMIT'} PREDICTION</button>
      `;
    }
    
    card.innerHTML = `
      <div class="match-title">
        ${match.team_a} vs ${match.team_b}
        <span class="match-stage">${match.is_knockout ? '?? KNOCKOUT' : '?? GROUP'}</span>
        ${isFinished ? '<span class="finished-badge">FINISHED</span>' : ''}
      </div>
      ${predictionHtml}
      <div class="deadline">?? ${new Date(match.kickoff_time).toLocaleString()}</div>
    `;
    
    container.appendChild(card);
  }
}

// SAVE PREDICTION
window.savePrediction = async function(matchId) {
  const scoreA = parseInt(document.getElementById(`scoreA_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`scoreB_${matchId}`).value);
  
  if (isNaN(scoreA) || isNaN(scoreB)) {
    alert('Please enter both scores');
    return;
  }
  
  // Check if prediction exists
  const { data: existing } = await supabase
    .from('predictions')
    .select('id')
    .eq('user_id', currentUser.id)
    .eq('match_id', matchId);
  
  let result;
  
  if (existing && existing.length > 0) {
    // Update
    result = await supabase
      .from('predictions')
      .update({ 
        pred_score_a: scoreA, 
        pred_score_b: scoreB,
        updated_at: new Date()
      })
      .eq('id', existing[0].id);
  } else {
    // Insert
    result = await supabase
      .from('predictions')
      .insert({ 
        user_id: currentUser.id, 
        match_id: matchId, 
        pred_score_a: scoreA, 
        pred_score_b: scoreB 
      });
  }
  
  if (result.error) {
    alert('Error: ' + result.error.message);
  } else {
    alert('Prediction saved!');
    loadMatches();
  }
};

// Check session on page load
async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  
  if (session) {
    currentUser = session.user;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    loadMatches();
  }
}

// Event listeners
document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('signupBtn').addEventListener('click', handleSignup);
document.getElementById('logoutBtn').addEventListener('click', handleLogout);

// Start
checkSession();
</script>
</body>
</html>
