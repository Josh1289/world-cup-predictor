<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0a5c2e 0%, #0a3d1f 50%, #062a15 100%);
      min-height: 100vh;
      color: #ffffff;
      padding: 20px;
      position: relative;
    }

    /* Football pattern overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: radial-gradient(circle at 20% 40%, rgba(255,215,0,0.05) 2%, transparent 2%);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    /* Login Box */
    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: linear-gradient(135deg, rgba(10, 35, 20, 0.95) 0%, rgba(6, 25, 12, 0.95) 100%);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 2px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    #loginBox h2 {
      color: #D4AF37;
      text-align: center;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 30px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(20, 50, 30, 0.8);
      color: #fff;
      font-size: 16px;
      transition: all 0.3s;
    }

    #loginBox input:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    #loginBox input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #loginBox button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
    }

    #loginBox button:last-of-type {
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    /* Main Page */
    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(10, 35, 20, 0.95) 0%, rgba(6, 25, 12, 0.95) 100%);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      border-bottom: 3px solid #D4AF37;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .header h2 {
      color: #D4AF37;
      font-size: 28px;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .admin-badge {
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }

    .logout-btn {
      background: rgba(212, 175, 55, 0.2);
      color: #D4AF37;
      padding: 10px 25px;
      border: 1px solid #D4AF37;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab {
      padding: 12px 30px;
      background: rgba(10, 35, 20, 0.8);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #D4AF37;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tab.active {
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
      border-color: #D4AF37;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .tab:hover:not(.active) {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-2px);
    }

    /* Match Day Groups */
    .match-day-group {
      margin-bottom: 30px;
      background: rgba(10, 35, 20, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .match-day-header {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(184, 150, 15, 0.1) 100%);
      padding: 15px 25px;
      border-left: 4px solid #D4AF37;
    }

    .match-day-date {
      color: #D4AF37;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .match-day-count {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 5px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1px;
      background: rgba(0,0,0,0.2);
    }

    .match-card {
      background: rgba(15, 45, 25, 0.8);
      padding: 20px;
      transition: all 0.3s;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }

    .match-card:hover {
      background: rgba(25, 65, 40, 0.9);
      transform: translateX(5px);
      border-left: 3px solid #D4AF37;
    }

    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
    }

    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
      color: #D4AF37;
      font-weight: bold;
    }

    .finished-badge {
      display: inline-block;
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
      font-weight: bold;
    }

    .result-display {
      text-align: center;
      color: #D4AF37;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      background: rgba(0,0,0,0.5);
      color: #D4AF37;
      border-radius: 10px;
      font-weight: bold;
    }

    .prediction-inputs input:focus {
      outline: none;
      border-color: #D4AF37;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
      color: #D4AF37;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #3d7a5f 0%, #2b5d4e 100%);
      transform: translateY(-2px);
      border-color: #D4AF37;
    }

    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Leaderboard */
    .leaderboard-container {
      background: rgba(10, 35, 20, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(184, 150, 15, 0.1) 100%);
      color: #D4AF37;
      padding: 15px 25px;
      font-weight: bold;
      font-size: 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 14px 25px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      color: #fff;
      transition: all 0.3s;
    }

    .leaderboard-item:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .leaderboard-rank {
      font-weight: bold;
      color: #D4AF37;
    }

    .leaderboard-points {
      font-weight: bold;
      color: #D4AF37;
      text-align: right;
    }

    /* Admin Panel */
    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    .admin-result-inputs input, .admin-result-inputs select {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(0,0,0,0.5);
      color: #D4AF37;
    }

    .admin-btn {
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
    }

    .reset-btn {
      background: rgba(220, 53, 69, 0.8);
      color: white;
      border: none;
    }

    .filter-group {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(10, 35, 20, 0.7);
      backdrop-filter: blur(5px);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .filter-group select, .filter-group input {
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(0,0,0,0.5);
      color: #D4AF37;
    }

    .sort-btn {
      padding: 8px 18px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      color: #D4AF37;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sort-btn.active {
      background: linear-gradient(135deg, #D4AF37 0%, #B8960F 100%);
      color: #0a2a1a;
      border-color: #D4AF37;
    }

    .sort-btn:hover {
      background: rgba(212, 175, 55, 0.2);
    }

    .stats {
      color: #D4AF37;
      margin-left: auto;
      font-weight: bold;
    }

    .msg {
      margin-top: 20px;
      text-align: center;
      color: #D4AF37;
    }
  </style>
</head>
<body>

<!-- LOGIN BOX -->
<div id="loginBox">
  <h2>?? WORLD CUP 2026 ??</h2>
  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<!-- MAIN PAGE -->
<div id="mainPage" style="display:none;">
  <div class="header">
    <h2>?? WORLD CUP 2026 PREDICTOR ??</h2>
    <div>
      <span id="userEmail"></span>
      <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="showPredictions">? MATCH PREDICTIONS</button>
    <button class="tab" id="showLeaderboard">?? LEADERBOARD</button>
    <button class="tab" id="showAdmin" style="display:none;">?? ADMIN CONTROL</button>
  </div>

  <!-- PREDICTIONS PANEL -->
  <div id="predictionsPanel">
    <div class="filter-group">
      <select id="matchFilter">
        <option value="all">All Matches</option>
        <option value="group">Group Stage</option>
        <option value="knockout">Knockout Stage</option>
      </select>
      <input type="text" id="teamSearch" placeholder="?? Search teams...">
      <div>
        <button class="sort-btn active" data-sort="date">?? Sort by Date</button>
        <button class="sort-btn" data-sort="team">?? Sort by Team</button>
      </div>
      <span class="stats" id="matchCount"></span>
    </div>
    <div id="matchesList"></div>
  </div>

  <!-- LEADERBOARD PANEL -->
  <div id="leaderboardPanel" style="display:none;">
    <div id="leaderboardList"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;">
    <div class="filter-group">
      <select id="adminFilter">
        <option value="all">All Matches</option>
        <option value="pending">Pending Results</option>
        <option value="finished">Finished</option>
      </select>
      <input type="text" id="adminSearch" placeholder="?? Search teams...">
    </div>
    <div id="adminMatchesList"></div>
  </div>
</div>

<script>
// Supabase
const _supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let user = null;
let allMatches = [];
let currentSort = 'date';

function showMsg(text, isError = false) {
  const msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#ff6b6b' : '#D4AF37';
  setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
}

// LOGIN
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMsg('Please enter email and password', true);
    return;
  }
  
  showMsg('Logging in...');
  
  const { data, error } = await _supabase.auth.signInWithPassword({
    email: email,
    password: password
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    user = data.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = user.email;
    
    if (user.email === 'admin@worldcup.com') {
      document.getElementById('adminBadge').style.display = 'inline-block';
      document.getElementById('showAdmin').style.display = 'inline-block';
    }
    
    loadMatches();
    loadLeaderboard();
  }
}

// SIGNUP
async function signup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMsg('Please enter email and password', true);
    return;
  }
  
  if (password.length < 6) {
    showMsg('Password must be at least 6 characters', true);
    return;
  }
  
  showMsg('Creating account...');
  
  const { data, error } = await _supabase.auth.signUp({
    email: email,
    password: password,
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Account created! You can now login.');
  }
}

// LOGOUT
async function logout() {
  await _supabase.auth.signOut();
  user = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

// LOAD MATCHES
async function loadMatches() {
  const { data, error } = await _supabase.from('matches').select('*').order('kickoff_time');
  if (error) {
    console.error('Error loading matches:', error);
    return;
  }
  allMatches = data;
  document.getElementById('matchCount').textContent = data.length + ' matches';
  filterAndShowMatches();
}

function filterAndShowMatches() {
  let filtered = [...allMatches];
  const stage = document.getElementById('matchFilter').value;
  const search = document.getElementById('teamSearch').value.toLowerCase();
  
  if (stage === 'group') filtered = filtered.filter(m => !m.is_knockout);
  if (stage === 'knockout') filtered = filtered.filter(m => m.is_knockout);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search)
  );
  
  if (currentSort === 'date') {
    filtered.sort((a,b) => new Date(a.kickoff_time) - new Date(b.kickoff_time));
  } else {
    filtered.sort((a,b) => a.team_a.localeCompare(b.team_a));
  }
  
  renderMatchesGroupedByDay(filtered);
}

async function renderMatchesGroupedByDay(matches) {
  const container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  const { data: predictions } = await _supabase
    .from('predictions')
    .select('*')
    .eq('user_id', user.id);
  
  const predMap = {};
  if (predictions) predictions.forEach(p => predMap[p.match_id] = p);
  
  const grouped = {};
  matches.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    
    dayGroup.innerHTML = `
      <div class="match-day-header">
        <div class="match-day-date">${date}</div>
        <div class="match-day-count">${dayMatches.length} matches</div>
      </div>
      <div class="matches-grid" id="grid-${date.replace(/[^a-z0-9]/gi, '')}"></div>
    `;
    container.appendChild(dayGroup);
    
    const grid = dayGroup.querySelector('.matches-grid');
    
    for (const match of dayMatches) {
      const deadlinePassed = new Date(match.kickoff_time) < new Date();
      const userPred = predMap[match.id];
      
      const card = document.createElement('div');
      card.className = 'match-card';
      
      card.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          <span class="match-stage">${match.is_knockout ? 'KNOCKOUT' : 'GROUP'}</span>
          ${match.finished ? '<span class="finished-badge">COMPLETED</span>' : ''}
        </div>
        ${match.finished ? `<div class="result-display">FINAL: ${match.score_a} - ${match.score_b}</div>` : ''}
        ${!deadlinePassed && !match.finished ? `
          <div class="prediction-inputs">
            <input type="number" id="scoreA_${match.id}" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
            <span>vs</span>
            <input type="number" id="scoreB_${match.id}" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
          </div>
          <button class="submit-btn" onclick="savePrediction('${match.id}')">${userPred ? 'UPDATE PREDICTION' : 'SUBMIT PREDICTION'}</button>
        ` : match.finished && userPred ? `
          <div style="text-align:center; margin-top:10px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px;">
            Your prediction: ${userPred.pred_score_a} - ${userPred.pred_score_b} ${userPred.points ? `| POINTS EARNED: ${userPred.points}` : ''}
          </div>
        ` : deadlinePassed && !match.finished ? `<div style="text-align:center; color:#D4AF37;">? DEADLINE PASSED</div>` : ''}
        <div class="deadline">? KICKOFF: ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
      grid.appendChild(card);
    }
  }
}

window.savePrediction = async function(matchId) {
  const scoreA = parseInt(document.getElementById(`scoreA_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`scoreB_${matchId}`).value);
  if (isNaN(scoreA) || isNaN(scoreB)) {
    showMsg('Please enter both scores', true);
    return;
  }
  
  const { data: existing } = await _supabase
    .from('predictions')
    .select('id')
    .eq('user_id', user.id)
    .eq('match_id', matchId)
    .maybeSingle();
  
  let error;
  if (existing) {
    const { error: updateError } = await _supabase
      .from('predictions')
      .update({ pred_score_a: scoreA, pred_score_b: scoreB })
      .eq('id', existing.id);
    error = updateError;
  } else {
    const { error: insertError } = await _supabase
      .from('predictions')
      .insert({ user_id: user.id, match_id: matchId, pred_score_a: scoreA, pred_score_b: scoreB });
    error = insertError;
  }
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Prediction saved successfully!');
    loadMatches();
    loadLeaderboard();
  }
};

// LEADERBOARD
async function loadLeaderboard() {
  const { data, error } = await _supabase.from('leaderboard').select('*').limit(50);
  if (error) return;
  
  const container = document.getElementById('leaderboardList');
  if (!data || data.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:#D4AF37;">No users yet. Make predictions to appear on the leaderboard!</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="leaderboard-container">
      <div class="leaderboard-header">
        <div>?? RANK</div>
        <div>?? PLAYER</div>
        <div>? POINTS</div>
      </div>
      <div id="leaderboardItems"></div>
    </div>
  `;
  
  const itemsDiv = container.querySelector('#leaderboardItems');
  data.forEach((u, i) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `
      <div class="leaderboard-rank">${i+1}</div>
      <div>${u.username || 'User'}</div>
      <div class="leaderboard-points">${u.total_points || 0}</div>
    `;
    itemsDiv.appendChild(item);
  });
}

// ADMIN FUNCTIONS
async function loadAdminMatches() {
  const { data, error } = await _supabase.from('matches').select('*').order('kickoff_time');
  if (error) return;
  renderAdminMatches(data);
}

function renderAdminMatches(matches) {
  const container = document.getElementById('adminMatchesList');
  const filter = document.getElementById('adminFilter').value;
  const search = document.getElementById('adminSearch').value.toLowerCase();
  
  let filtered = matches;
  if (filter === 'pending') filtered = filtered.filter(m => !m.finished);
  if (filter === 'finished') filtered = filtered.filter(m => m.finished);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search)
  );
  
  const grouped = {};
  filtered.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  container.innerHTML = '';
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = `<div class="match-day-header"><div class="match-day-date">${date}</div><div class="match-day-count">${dayMatches.length} matches</div></div><div class="matches-grid" id="adminGrid-${date.replace(/[^a-z0-9]/gi, '')}"></div>`;
    container.appendChild(dayGroup);
    
    const grid = dayGroup.querySelector('.matches-grid');
    
    for (const match of dayMatches) {
      const card = document.createElement('div');
      card.className = 'match-card';
      
      if (match.finished) {
        card.innerHTML = `
          <div class="match-title">${match.team_a} vs ${match.team_b}</div>
          <div class="result-display">RESULT: ${match.score_a} - ${match.score_b}</div>
          <button class="submit-btn reset-btn" onclick="resetMatch('${match.id}')">?? RESET RESULT</button>
          <div class="deadline">${new Date(match.kickoff_time).toLocaleString()}</div>
        `;
      } else {
        card.innerHTML = `
          <div class="match-title">${match.team_a} vs ${match.team_b}</div>
          <div class="admin-result-inputs">
            <input type="number" id="adminA_${match.id}" placeholder="${match.team_a} score">
            <span>vs</span>
            <input type="number" id="adminB_${match.id}" placeholder="${match.team_b} score">
          </div>
          ${match.is_knockout ? `<select id="advance_${match.id}" style="width:100%; margin:10px 0; padding:10px; background:rgba(0,0,0,0.5); color:#D4AF37; border:1px solid rgba(212,175,55,0.3); border-radius:8px;"><option value="">?? Who advanced after extra time?</option><option value="${match.team_a}">${match.team_a}</option><option value="${match.team_b}">${match.team_b}</option></select>` : ''}
          <button class="submit-btn admin-btn" onclick="setResult('${match.id}', ${match.is_knockout})">? SET RESULT & CALCULATE POINTS</button>
          <div class="deadline">${new Date(match.kickoff_time).toLocaleString()}</div>
        `;
      }
      grid.appendChild(card);
    }
  }
}

window.setResult = async function(matchId, isKnockout) {
  const a = parseInt(document.getElementById(`adminA_${matchId}`).value);
  const b = parseInt(document.getElementById(`adminB_${matchId}`).value);
  if (isNaN(a) || isNaN(b)) {
    showMsg('Please enter valid scores', true);
    return;
  }
  
  let advance = null;
  if (isKnockout) {
    advance = document.getElementById(`advance_${matchId}`).value;
    if (!advance) {
      showMsg('Please select which team advanced', true);
      return;
    }
  }
  
  const update = { score_a: a, score_b: b, finished: true };
  if (advance) update.advancing_team = advance;
  
  const { error } = await _supabase.from('matches').update(update).eq('id', matchId);
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Result set! Points calculated automatically!');
    loadMatches();
    loadAdminMatches();
    loadLeaderboard();
  }
};

window.resetMatch = async function(matchId) {
  const { error } = await _supabase
    .from('matches')
    .update({ score_a: null, score_b: null, finished: false, advancing_team: null })
    .eq('id', matchId);
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Result reset!');
    loadMatches();
    loadAdminMatches();
    loadLeaderboard();
  }
};
