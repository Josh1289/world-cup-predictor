<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px; background: #1a472a; color: white;">

<div id="loginBox" style="max-width: 400px; margin: 100px auto; background: black; padding: 30px; border-radius: 10px;">
  <h2 style="text-align:center;">WORLD CUP 2026</h2>
  
  <input type="email" id="email" placeholder="Email" style="width:100%; padding:10px; margin:10px 0;">
  <input type="password" id="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;">
  
  <button id="loginBtn" style="width:100%; padding:10px; background: #ffd700; color: black; font-weight: bold; border: none; cursor: pointer;">LOGIN</button>
  <button id="signupBtn" style="width:100%; padding:10px; margin-top:10px; background: #666; color: white; border: none; cursor: pointer;">CREATE ACCOUNT</button>
  
  <div id="msg" style="margin-top:20px; text-align:center;"></div>
</div>

<div id="mainPage" style="display:none; max-width: 800px; margin: 0 auto;">
  <div style="background: black; padding: 20px; border-radius: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>WORLD CUP 2026</h2>
      <button id="logoutBtn" style="background: #dc3545; color: white; padding: 10px 20px; border: none; cursor: pointer;">LOGOUT</button>
    </div>
    <div style="margin-top: 20px; padding: 20px; background: #2a2a2a; border-radius: 10px;">
      <h3>Welcome! You are logged in.</h3>
      <p id="userEmail"></p>
    </div>
  </div>
</div>

<script>
// Supabase
const _supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let user = null;

function showMsg(text, isError = false) {
  const msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#ff6b6b' : '#ffd700';
  setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
}

// LOGIN
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMsg('Enter email and password', true);
    return;
  }
  
  showMsg('Logging in...');
  
  const { data, error } = await _supabase.auth.signInWithPassword({
    email: email,
    password: password
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    user = data.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = 'Logged in as: ' + user.email;
  }
}

// SIGNUP
async function signup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showMsg('Enter email and password', true);
    return;
  }
  
  if (password.length < 6) {
    showMsg('Password must be at least 6 characters', true);
    return;
  }
  
  showMsg('Creating account...');
  
  const { data, error } = await _supabase.auth.signUp({
    email: email,
    password: password,
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Account created! You can now login.');
  }
}

// LOGOUT
async function logout() {
  await _supabase.auth.signOut();
  user = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

// CHECK IF ALREADY LOGGED IN
async function checkSession() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    user = session.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = 'Logged in as: ' + user.email;
  }
}

// BUTTONS
document.getElementById('loginBtn').onclick = login;
document.getElementById('signupBtn').onclick = signup;
document.getElementById('logoutBtn').onclick = logout;

// START
checkSession();
</script>
</body>
</html>
