<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .auth-card h1 {
      margin-bottom: 30px;
      text-align: center;
      color: #ffd700;
      font-size: 28px;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 14px;
    }

    .auth-card input:focus {
      outline: none;
      border-color: #ffd700;
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #ffd700;
      color: #1a472a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .auth-card button:hover {
      background: #ffed4a;
      transform: translateY(-2px);
    }

    .auth-link {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
    }

    .auth-link span {
      color: #ffd700;
      cursor: pointer;
      text-decoration: underline;
    }

    .app-screen {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      border-bottom: 3px solid #ffd700;
    }

    .header h1 {
      color: #ffd700;
      font-size: 28px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-badge {
      background: #ffd700;
      color: #1a472a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .tab {
      padding: 10px 25px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }

    .tab.active {
      background: #ffd700;
      color: #1a472a;
    }

    .filter-group {
      margin-bottom: 25px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 12px;
    }

    .filter-group select, .filter-group input {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    .sort-buttons {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }

    .sort-btn {
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .sort-btn.active {
      background: #ffd700;
      color: #1a472a;
    }

    .stats {
      font-size: 14px;
      color: #ffd700;
    }

    .match-day-group {
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      overflow: hidden;
    }

    .match-day-header {
      background: linear-gradient(135deg, #1a472a 0%, #0d2a1a 100%);
      padding: 15px 20px;
      border-left: 4px solid #ffd700;
    }

    .match-day-date {
      color: #ffd700;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .match-day-count {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1px;
      background: rgba(255, 255, 255, 0.05);
    }

    .match-card {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      transition: all 0.3s;
    }

    .match-card:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: translateX(5px);
    }

    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .match-stage {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 4px;
      font-size: 11px;
      margin-left: 10px;
    }

    .finished-badge {
      display: inline-block;
      background: #ffd700;
      color: #1a472a;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 10px;
    }

    .result-display {
      text-align: center;
      color: #ffd700;
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 8px;
    }

    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .admin-result-inputs input, .admin-result-inputs select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #ffd700;
      color: #1a472a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    .admin-btn {
      background: #ff8c00;
      color: white;
    }

    .reset-btn {
      background: #dc3545;
      color: white;
    }

    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.5);
    }

    .leaderboard-container {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      overflow: hidden;
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      background: #ffd700;
      color: #1a472a;
      padding: 15px 20px;
      font-weight: bold;
    }

    .leaderboard-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leaderboard-rank {
      font-weight: bold;
      color: #ffd700;
    }

    .leaderboard-points {
      font-weight: bold;
      color: #ffd700;
      text-align: right;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      border-left: 4px solid #ffd700;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>

<body>
<div class="container">
  <!-- LOGIN SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1>WORLD CUP 2026</h1>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="doLoginBtn">SIGN IN</button>
        <div class="auth-link">New user? <span id="showSignupLink">Create Account</span></div>
      </div>
      <div id="signupForm" style="display: none;">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
        <button id="doSignupBtn">CREATE ACCOUNT</button>
        <div class="auth-link">Already have an account? <span id="showLoginLink">Sign In</span></div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="app-screen">
    <div class="header">
      <h1>WORLD CUP 2026 PREDICTOR</h1>
      <div class="user-info">
        <span id="userEmail"></span>
        <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="showPredictions">PREDICTIONS</button>
      <button class="tab" id="showLeaderboard">LEADERBOARD</button>
      <button class="tab" id="showAdmin" style="display:none;">ADMIN</button>
    </div>

    <div id="predictionsPanel">
      <div class="filter-group">
        <select id="matchFilter">
          <option value="all">All Matches</option>
          <option value="group">Group Stage</option>
          <option value="knockout">Knockout Stage</option>
        </select>
        <input type="text" id="teamSearch" placeholder="Search teams...">
        <div class="sort-buttons">
          <button class="sort-btn active" data-sort="date">By Date</button>
          <button class="sort-btn" data-sort="team">By Team</button>
        </div>
        <span class="stats" id="matchCount"></span>
      </div>
      <div id="matchesList"></div>
    </div>

    <div id="leaderboardPanel" style="display:none;">
      <div id="leaderboardList"></div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div class="filter-group">
        <select id="adminFilter">
          <option value="all">All Matches</option>
          <option value="pending">Pending Results</option>
          <option value="finished">Finished</option>
        </select>
        <input type="text" id="adminSearch" placeholder="Search teams...">
      </div>
      <div id="adminMatchesList"></div>
    </div>
  </div>
</div>

<script>
// SIMPLE SUPABASE INIT - NO CONFLICTS
const SB_URL = "https://igatvhqatxrhgnshmdld.supabase.co";
const SB_KEY = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const SB = window.supabase.createClient(SB_URL, SB_KEY);

let CURRENT_USER = null;
let ALL_MATCHES = [];
let SORT_TYPE = 'date';

function showMsg(msg, isErr = false) {
  const div = document.createElement('div');
  div.className = 'notification';
  div.style.borderLeftColor = isErr ? '#dc3545' : '#ffd700';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// AUTH FUNCTIONS
async function handleSignup() {
  const email = document.getElementById('signupEmail').value;
  const pwd = document.getElementById('signupPassword').value;
  if (!email || !pwd) return showMsg('Enter email and password', true);
  if (pwd.length < 6) return showMsg('Password min 6 chars', true);
  
  const { error } = await SB.auth.signUp({ email, password: pwd });
  if (error) return showMsg(error.message, true);
  showMsg('Account created! Please sign in.');
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  const pwd = document.getElementById('loginPassword').value;
  if (!email || !pwd) return showMsg('Enter email and password', true);
  
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pwd });
  if (error) return showMsg(error.message, true);
  CURRENT_USER = data.user;
  showMsg('Welcome!');
  loadApp();
}

async function handleLogout() {
  await SB.auth.signOut();
  CURRENT_USER = null;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
}

// UI FUNCTIONS
function showSignup() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupForm').style.display = 'block';
}

function showLogin() {
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}

async function loadApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmail').textContent = CURRENT_USER.email;
  
  const isAdmin = CURRENT_USER.email === 'admin@worldcup.com';
  if (isAdmin) {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('showAdmin').style.display = 'inline-block';
  }
  
  await loadMatches();
  await loadLeaderboard();
}

async function loadMatches() {
  const { data, error } = await SB.from('matches').select('*').order('kickoff_time');
  if (error) return showMsg('Error loading matches', true);
  ALL_MATCHES = data;
  document.getElementById('matchCount').textContent = data.length + ' matches';
  filterAndShowMatches();
}

function filterAndShowMatches() {
  let filtered = [...ALL_MATCHES];
  const stage = document.getElementById('matchFilter').value;
  const search = document.getElementById('teamSearch').value.toLowerCase();
  
  if (stage === 'group') filtered = filtered.filter(m => !m.is_knockout);
  if (stage === 'knockout') filtered = filtered.filter(m => m.is_knockout);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search)
  );
  
  if (SORT_TYPE === 'date') filtered.sort((a,b) => new Date(a.kickoff_time) - new Date(b.kickoff_time));
  else filtered.sort((a,b) => a.team_a.localeCompare(b.team_a));
  
  renderMatches(filtered);
}

async function renderMatches(matches) {
  const container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  const { data: preds } = await SB.from('predictions').select('*').eq('user_id', CURRENT_USER.id);
  const predMap = {};
  if (preds) preds.forEach(p => predMap[p.match_id] = p);
  
  const grouped = {};
  matches.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'match-day-group';
    groupDiv.innerHTML = `<div class="match-day-header"><div class="match-day-date">${date}</div><div class="match-day-count">${dayMatches.length} matches</div></div>`;
    
    const grid = document.createElement('div');
    grid.className = 'matches-grid';
    
    for (const match of dayMatches) {
      const deadlinePassed = new Date(match.kickoff_time) < new Date();
      const userPred = predMap[match.id];
      const card = document.createElement('div');
      card.className = 'match-card';
      
      card.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          <span class="match-stage">${match.is_knockout ? 'KNOCKOUT' : 'GROUP'}</span>
          ${match.finished ? '<span class="finished-badge">COMPLETED</span>' : ''}
        </div>
        ${match.finished ? `<div class="result-display">FINAL: ${match.score_a} - ${match.score_b}</div>` : ''}
        ${!deadlinePassed && !match.finished ? `
          <div class="prediction-inputs">
            <input type="number" id="scoreA_${match.id}" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
            <span>-</span>
            <input type="number" id="scoreB_${match.id}" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
          </div>
          <button class="submit-btn" onclick="savePrediction('${match.id}')">${userPred ? 'UPDATE' : 'SUBMIT'}</button>
        ` : match.finished && userPred ? `
          <div style="text-align:center; margin-top:10px; padding:8px; background:rgba(0,0,0,0.5); border-radius:6px;">
            Your pick: ${userPred.pred_score_a} - ${userPred.pred_score_b} ${userPred.points ? `| POINTS: ${userPred.points}` : ''}
          </div>
        ` : deadlinePassed && !match.finished ? `<div style="text-align:center; color:#ffd700;">DEADLINE PASSED</div>` : ''}
        <div class="deadline">KICKOFF: ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
      grid.appendChild(card);
    }
    groupDiv.appendChild(grid);
    container.appendChild(groupDiv);
  }
}

window.savePrediction = async function(matchId) {
  const scoreA = parseInt(document.getElementById(`scoreA_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`scoreB_${matchId}`).value);
  if (isNaN(scoreA) || isNaN(scoreB)) return showMsg('Enter both scores', true);
  
  const { data: existing } = await SB.from('predictions').select('id').eq('user_id', CURRENT_USER.id).eq('match_id', matchId).maybeSingle();
  
  if (existing) {
    const { error } = await SB.from('predictions').update({ pred_score_a: scoreA, pred_score_b: scoreB }).eq('id', existing.id);
    if (error) return showMsg(error.message, true);
  } else {
    const { error } = await SB.from('predictions').insert({ user_id: CURRENT_USER.id, match_id: matchId, pred_score_a: scoreA, pred_score_b: scoreB });
    if (error) return showMsg(error.message, true);
  }
  showMsg('Prediction saved!');
  await loadMatches();
};

async function loadLeaderboard() {
  const { data, error } = await SB.from('leaderboard').select('*').limit(50);
  if (error) return;
  
  const container = document.getElementById('leaderboardList');
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="loading">No users yet</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="leaderboard-container">
      <div class="leaderboard-header"><div>RANK</div><div>PLAYER</div><div>POINTS</div></div>
      <div class="leaderboard-list"></div>
    </div>
  `;
  const list = container.querySelector('.leaderboard-list');
  data.forEach((u, i) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `<div class="leaderboard-rank">${i+1}</div><div>${u.username || 'User'}</div><div class="leaderboard-points">${u.total_points || 0}</div>`;
    list.appendChild(item);
  });
}

// TAB SWITCHING
document.getElementById('showPredictions').onclick = () => {
  document.getElementById('predictionsPanel').style.display = 'block';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showPredictions').classList.add('active');
};

document.getElementById('showLeaderboard').onclick = () => {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'block';
  document.getElementById('adminPanel').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showLeaderboard').classList.add('active');
  loadLeaderboard();
};

document.getElementById('showAdmin').onclick = async () => {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showAdmin').classList.add('active');
  await loadAdminMatches();
};

// FILTERS
document.getElementById('matchFilter').onchange = filterAndShowMatches;
document.getElementById('teamSearch').onkeyup = filterAndShowMatches;
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.onclick = () => {
    SORT_TYPE = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterAndShowMatches();
  };
});

// ADMIN FUNCTIONS
async function loadAdminMatches() {
  const { data, error } = await SB.from('matches').select('*').order('kickoff_time');
  if (error) return;
  renderAdminMatches(data);
}

function renderAdminMatches(matches) {
  const container = document.getElementById('adminMatchesList');
  const filter = document.getElementById('adminFilter').value;
  const search = document.getElementById('adminSearch').value.toLowerCase();
  
  let filtered = matches;
  if (filter === 'pending') filtered = filtered.filter(m => !m.finished);
  if (filter === 'finished') filtered = filtered.filter(m => m.finished);
  if (search) filtered = filtered.filter(m => m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search));
  
  const grouped = {};
  filtered.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  container.innerHTML = '';
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'match-day-group';
    groupDiv.innerHTML = `<div class="match-day-header"><div class="match-day-date">${date}</div><div class="match-day-count">${dayMatches.length} matches</div></div>`;
    
    const grid = document.createElement('div');
    grid.className = 'matches-grid';
    
    for (const match of dayMatches) {
      const card = document.createElement('div');
      card.className = 'match-card';
      if (match.finished) {
        card.innerHTML = `
          <div class="match-title">${match.team_a} vs ${match.team_b}</div>
          <div class="result-display">RESULT: ${match.score_a} - ${match.score_b}</div>
          <button class="submit-btn reset-btn" onclick="resetMatch('${match.id}')">RESET</button>
        `;
      } else {
        card.innerHTML = `
          <div class="match-title">${match.team_a} vs ${match.team_b}</div>
          <div class="admin-result-inputs">
            <input type="number" id="adminA_${match.id}" placeholder="${match.team_a}">
            <span>-</span>
            <input type="number" id="adminB_${match.id}" placeholder="${match.team_b}">
          </div>
          ${match.is_knockout ? `
            <select id="advance_${match.id}" style="width:100%; margin:10px 0; padding:8px;">
              <option value="">Who advanced?</option>
              <option value="${match.team_a}">${match.team_a}</option>
              <option value="${match.team_b}">${match.team_b}</option>
            </select>
          ` : ''}
          <button class="submit-btn admin-btn" onclick="setResult('${match.id}', ${match.is_knockout})">SET RESULT</button>
        `;
      }
      grid.appendChild(card);
    }
    groupDiv.appendChild(grid);
    container.appendChild(groupDiv);
  }
}

window.setResult = async function(matchId, isKnockout) {
  const a = parseInt(document.getElementById(`adminA_${matchId}`).value);
  const b = parseInt(document.getElementById(`adminB_${matchId}`).value);
  if (isNaN(a) || isNaN(b)) return showMsg('Enter valid scores', true);
  
  let advance = null;
  if (isKnockout) {
    advance = document.getElementById(`advance_${matchId}`).value;
    if (!advance) return showMsg('Select advancing team', true);
  }
  
  const update = { score_a: a, score_b: b, finished: true };
  if (advance) update.advancing_team = advance;
  
  const { error } = await SB.from('matches').update(update).eq('id', matchId);
  if (error) return showMsg(error.message, true);
  showMsg('Result set! Points calculated!');
  await loadMatches();
  await loadAdminMatches();
  await loadLeaderboard();
};

window.resetMatch = async function(matchId) {
  const { error } = await SB.from('matches').update({ score_a: null, score_b: null, finished: false, advancing_team: null }).eq('id', matchId);
  if (error) return showMsg(error.message, true);
  showMsg('Result reset!');
  await loadMatches();
  await loadAdminMatches();
  await loadLeaderboard();
};

document.getElementById('adminFilter').onchange = loadAdminMatches;
document.getElementById('adminSearch').onkeyup = loadAdminMatches;

// BUTTONS
document.getElementById('doLoginBtn').onclick = handleLogin;
document.getElementById('doSignupBtn').onclick = handleSignup;
document.getElementById('showSignupLink').onclick = showSignup;
document.getElementById('showLoginLink').onclick = showLogin;
document.getElementById('logoutBtn').onclick = handleLogout;

// CHECK SESSION
(async () => {
  const { data: { session } } = await SB.auth.getSession();
  if (session) {
    CURRENT_USER = session.user;
    loadApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
})();
</script>
</body>
</html>
