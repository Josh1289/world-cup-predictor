<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
      transition: all 0.3s ease;
      min-height: 100vh;
      padding: 20px;
    }

    body.theme-orange {
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFD700 100%);
    }
    body.theme-orange .header, body.theme-orange .match-day-group, 
    body.theme-orange .leaderboard-container, body.theme-orange .filter-group,
    body.theme-orange #loginBox, body.theme-orange .match-card,
    body.theme-orange .leagues-bar {
      background: white;
      color: black;
    }
    body.theme-orange .tab.active, body.theme-orange .leaderboard-header {
      background: #FF6B35;
      color: white;
    }
    body.theme-orange .submit-btn, body.theme-orange .admin-btn,
    body.theme-orange #createLeagueBtn, body.theme-orange #joinLeagueBtn {
      background: #FF6B35;
      color: white;
    }
    body.theme-orange .match-title, body.theme-orange .match-stage,
    body.theme-orange .result-display, body.theme-orange .deadline,
    body.theme-orange .stats, body.theme-orange .leaderboard-item,
    body.theme-orange .match-day-date, body.theme-orange .match-day-count {
      color: black;
    }

    body.theme-green {
      background: linear-gradient(135deg, #0a5c2e 0%, #0a3d1f 50%, #062a15 100%);
    }
    body.theme-green .header, body.theme-green .match-day-group,
    body.theme-green .leaderboard-container, body.theme-green .filter-group,
    body.theme-green #loginBox, body.theme-green .match-card,
    body.theme-green .leagues-bar {
      background: white;
      color: black;
    }
    body.theme-green .tab.active, body.theme-green .leaderboard-header {
      background: #2E7D32;
      color: white;
    }
    body.theme-green .submit-btn, body.theme-green .admin-btn,
    body.theme-green #createLeagueBtn, body.theme-green #joinLeagueBtn {
      background: #2E7D32;
      color: white;
    }
    body.theme-green .match-title, body.theme-green .match-stage,
    body.theme-green .result-display, body.theme-green .deadline,
    body.theme-green .stats, body.theme-green .leaderboard-item,
    body.theme-green .match-day-date, body.theme-green .match-day-count {
      color: black;
    }

    body.theme-night {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }
    body.theme-night .header, body.theme-night .match-day-group,
    body.theme-night .leaderboard-container, body.theme-night .filter-group,
    body.theme-night #loginBox, body.theme-night .match-card,
    body.theme-night .leagues-bar {
      background: rgba(30,30,50,0.95);
      color: white;
    }
    body.theme-night .tab.active, body.theme-night .leaderboard-header {
      background: #FFD700;
      color: #1a1a2e;
    }
    body.theme-night .submit-btn, body.theme-night .admin-btn,
    body.theme-night #createLeagueBtn, body.theme-night #joinLeagueBtn {
      background: #FFD700;
      color: #1a1a2e;
    }
    body.theme-night .match-title, body.theme-night .match-stage,
    body.theme-night .result-display, body.theme-night .deadline,
    body.theme-night .stats, body.theme-night .leaderboard-item,
    body.theme-night .match-day-date, body.theme-night .match-day-count {
      color: #FFD700;
    }

    body.theme-classic {
      background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
    }
    body.theme-classic .header, body.theme-classic .match-day-group,
    body.theme-classic .leaderboard-container, body.theme-classic .filter-group,
    body.theme-classic #loginBox, body.theme-classic .match-card,
    body.theme-classic .leagues-bar {
      background: #f5f5dc;
      color: black;
    }
    body.theme-classic .tab.active, body.theme-classic .leaderboard-header {
      background: #8B4513;
      color: white;
    }
    body.theme-classic .submit-btn, body.theme-classic .admin-btn,
    body.theme-classic #createLeagueBtn, body.theme-classic #joinLeagueBtn {
      background: #8B4513;
      color: white;
    }
    body.theme-classic .match-title, body.theme-classic .match-stage,
    body.theme-classic .result-display, body.theme-classic .deadline,
    body.theme-classic .stats, body.theme-classic .leaderboard-item,
    body.theme-classic .match-day-date, body.theme-classic .match-day-count {
      color: black;
    }

    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    #loginBox h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }

    #loginBox input:focus {
      outline: none;
    }

    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
      color: white;
      background: #FF6B35;
    }

    #loginBox button:hover {
      transform: translateY(-2px);
    }

    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    .theme-orange-btn { background: #FF6B35; }
    .theme-green-btn { background: #2E7D32; }
    .theme-night-btn { background: #302b63; }
    .theme-classic-btn { background: #8B4513; }

    .admin-badge {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
      background: #FFD700;
      color: #1a1a2e;
    }

    .logout-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      background: #dc3545;
      color: white;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab {
      padding: 12px 30px;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background: white;
      color: black;
    }

    .leagues-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .leagues-bar select {
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }
