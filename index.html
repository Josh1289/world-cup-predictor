<!DOCTYPE html>
<html>
<head>
  <title>World Cup Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px; background: #333; color: white;">
  <h1>Database Test</h1>
  <div id="result">Loading...</div>
  <div id="matchesList"></div>

<script>
// Supabase
const supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

async function testConnection() {
  const resultDiv = document.getElementById('result');
  const matchesDiv = document.getElementById('matchesList');
  
  resultDiv.innerHTML = 'Testing connection...';
  
  try {
    // Test 1: Try to get matches
    const { data: matches, error: matchesError } = await supabase
      .from('matches')
      .select('*')
      .limit(5);
    
    if (matchesError) {
      resultDiv.innerHTML = 'ERROR fetching matches: ' + matchesError.message;
      return;
    }
    
    resultDiv.innerHTML = 'SUCCESS! Found ' + (matches?.length || 0) + ' matches in database.';
    
    if (matches && matches.length > 0) {
      matchesDiv.innerHTML = '<h2>First 5 Matches:</h2>';
      matches.forEach(match => {
        matchesDiv.innerHTML += `
          <div style="background: #555; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <strong>${match.team_a} vs ${match.team_b}</strong><br>
            Date: ${new Date(match.kickoff_time).toLocaleString()}<br>
            Stage: ${match.is_knockout ? 'Knockout' : 'Group'}<br>
            Finished: ${match.finished ? 'Yes' : 'No'}
          </div>
        `;
      });
    } else {
      matchesDiv.innerHTML = '<h2>No matches found in database!</h2>';
    }
    
    // Test 2: Try to get count
    const { count, error: countError } = await supabase
      .from('matches')
      .select('*', { count: 'exact', head: true });
    
    if (!countError) {
      resultDiv.innerHTML += `<br>Total matches in database: ${count}`;
    }
    
  } catch (err) {
    resultDiv.innerHTML = 'ERROR: ' + err.message;
  }
}

testConnection();
</script>
</body>
</html>
