<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a472a;
      margin: 0;
      padding: 20px;
      color: white;
    }
    .container {
      max-width: 500px;
      margin: 100px auto;
      background: rgba(0,0,0,0.8);
      padding: 30px;
      border-radius: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #ffd700;
      color: #1a472a;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #ffed4a;
    }
    .main-page {
      display: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .logout-btn {
      width: auto;
      padding: 8px 20px;
      background: #dc3545;
      color: white;
    }
    .card {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .link {
      color: #ffd700;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
      display: inline-block;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #ffd700;
      color: #1a472a;
      border-radius: 5px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="container">
  <h2 style="text-align:center;">WORLD CUP PREDICTOR 2026</h2>
  <div id="loginForm">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signInBtn">SIGN IN</button>
    <div style="text-align:center;">
      <span class="link" id="showSignupLink">Create Account</span>
    </div>
  </div>
  <div id="signupForm" style="display:none;">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password (min 6 characters)">
    <button id="signUpBtn">CREATE ACCOUNT</button>
    <div style="text-align:center;">
      <span class="link" id="showLoginLink">Back to Sign In</span>
    </div>
  </div>
</div>

<!-- MAIN PAGE (empty for now) -->
<div id="mainPage" class="main-page">
  <div class="header">
    <h2>WORLD CUP 2026</h2>
    <div>
      <span id="userEmailDisplay"></span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>
  <div class="card">
    <h3>Welcome to World Cup Predictor 2026!</h3>
    <p>You are successfully logged in.</p>
  </div>
</div>

<script>
// Supabase config
const supabaseUrl = "https://igatvhqatxrhgnshmdld.supabase.co";
const supabaseKey = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;

function showNotification(message) {
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.textContent = message;
  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 3000);
}

// SIGN UP FUNCTION
async function signUp() {
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  
  if (!email || !password) {
    showNotification('Please enter email and password');
    return;
  }
  
  if (password.length < 6) {
    showNotification('Password must be at least 6 characters');
    return;
  }
  
  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password,
  });
  
  if (error) {
    showNotification('Error: ' + error.message);
  } else {
    showNotification('Account created! Please sign in.');
    // Switch back to login form
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    // Clear fields
    document.getElementById('signupEmail').value = '';
    document.getElementById('signupPassword').value = '';
  }
}

// SIGN IN FUNCTION
async function signIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    showNotification('Please enter email and password');
    return;
  }
  
  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });
  
  if (error) {
    showNotification('Login failed: ' + error.message);
  } else {
    currentUser = data.user;
    showNotification('Welcome ' + currentUser.email + '!');
    showMainPage();
  }
}

// LOGOUT FUNCTION
async function logout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
  showNotification('Logged out');
}

// SHOW MAIN PAGE
function showMainPage() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmailDisplay').textContent = currentUser.email;
}

// SHOW SIGNUP FORM
function showSignupForm() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupForm').style.display = 'block';
}

// SHOW LOGIN FORM
function showLoginForm() {
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}

// CHECK IF USER IS ALREADY LOGGED IN
async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    showMainPage();
  } else {
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('mainPage').style.display = 'none';
  }
}

// BUTTON EVENT LISTENERS
document.getElementById('signInBtn').addEventListener('click', signIn);
document.getElementById('signUpBtn').addEventListener('click', signUp);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('showSignupLink').addEventListener('click', showSignupForm);
document.getElementById('showLoginLink').addEventListener('click', showLoginForm);

// START THE APP
checkAuth();
</script>
</body>
</html>
