<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      color: #333;
    }

    .auth-card h1 {
      margin-bottom: 30px;
      text-align: center;
      color: #667eea;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .app-screen {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      flex-wrap: wrap;
    }

    .admin-badge {
      background: #f59e0b;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 10px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab.active {
      background: #48bb78;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      max-height: 600px;
      overflow-y: auto;
      padding: 5px;
    }

    .match-card {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.3s;
    }

    .match-card:hover {
      transform: translateY(-3px);
    }

    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
    }

    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .admin-result-inputs input {
      width: 70px;
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      border: none;
    }

    .admin-result-inputs select {
      padding: 8px;
      border-radius: 6px;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .admin-btn {
      background: #f59e0b;
    }

    .admin-btn:hover {
      background: #d97706;
    }

    .reset-btn {
      background: #ef4444;
    }

    .reset-btn:hover {
      background: #dc2626;
    }

    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      color: rgba(255,255,255,0.6);
    }

    .leaderboard-list {
      list-style: none;
      max-height: 500px;
      overflow-y: auto;
    }

    .leaderboard-item {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 10px;
      background: white;
      color: #333;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .filter-group {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group select, .filter-group input {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    .sort-buttons {
      display: flex;
      gap: 5px;
      margin-left: auto;
    }

    .sort-btn {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    .sort-btn.active {
      background: #48bb78;
    }

    .stats {
      font-size: 14px;
      color: #fbbf24;
    }

    .result-display {
      text-align: center;
      color: #fbbf24;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .finished-badge {
      display: inline-block;
      background: #48bb78;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-left: 10px;
    }
  </style>
</head>

<body>
<div class="container">
  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1>? World Cup Predictor 2026</h1>
      <div id="loginPanel">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginButton">Login</button>
        <div style="text-align:center; margin-top:20px;">
          Don't have an account? <a id="showSignupLink" style="cursor:pointer; color:#667eea;">Create Account</a>
        </div>
      </div>
      <div id="signupPanel" style="display: none;">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)">
        <button id="signupButton" style="background:#48bb78;">Create Account</button>
        <div style="text-align:center; margin-top:20px;">
          Already have an account? <a id="showLoginLink" style="cursor:pointer; color:#667eea;">Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="app-screen">
    <div class="header">
      <div>
        <h1>? World Cup Predictor 2026</h1>
        <span id="userEmailDisplay" style="font-size: 14px;"></span>
        <span id="adminBadge" class="admin-badge" style="display:none;">?? Admin</span>
      </div>
      <button id="logoutButton" style="background:rgba(255,255,255,0.2); padding:8px 20px; border-radius:8px; border:none; color:white; cursor:pointer;">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('predict')">?? Make Predictions</button>
      <button class="tab" onclick="switchTab('leaderboard')">?? Leaderboard</button>
      <button id="adminTabBtn" class="tab" style="display:none;" onclick="switchTab('admin')">?? Admin - Set Results</button>
    </div>

    <!-- Predictions Tab -->
    <div id="predictTab">
      <div class="filter-group">
        <select id="stageFilter" onchange="filterAndSortMatches()">
          <option value="all">All Stages</option>
          <option value="group">Group Stage</option>
          <option value="knockout">Knockout Stage</option>
        </select>
        <input type="text" id="teamFilter" placeholder="Search teams..." onkeyup="filterAndSortMatches()">
        <div class="sort-buttons">
          <button class="sort-btn active" onclick="setSort('date')">?? Sort by Date</button>
          <button class="sort-btn" onclick="setSort('team')">?? Sort by Team</button>
        </div>
        <span class="stats" id="matchStats"></span>
      </div>
      <div id="matchesContainer" class="matches-grid"></div>
    </div>

    <!-- Leaderboard Tab -->
    <div id="leaderboardTab" style="display:none;">
      <div id="leaderboardContainer"></div>
    </div>

    <!-- Admin Tab -->
    <div id="adminTabContent" style="display:none;">
      <h3>?? Set Match Results (Admin Only)</h3>
      <div class="filter-group">
        <select id="adminStageFilter" onchange="filterAdminMatches()">
          <option value="all">All Matches</option>
          <option value="pending">Pending Results</option>
          <option value="finished">Finished Matches</option>
        </select>
        <input type="text" id="adminTeamFilter" placeholder="Search teams..." onkeyup="filterAdminMatches()">
      </div>
      <div id="adminMatchesContainer" class="matches-grid"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://igatvhqatxrhgnshmdld.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let allMatches = [];
let adminMatches = [];
let currentSort = 'date';

function showNotification(message, isError = false) {
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.style.background = isError ? '#fee' : '#e8f5e9';
  notification.style.color = isError ? '#c62828' : '#2e7d32';
  notification.textContent = message;
  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 3000);
}

function setSort(sortType) {
  currentSort = sortType;
  document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  filterAndSortMatches();
}

function switchTab(tabName) {
  document.getElementById('predictTab').style.display = tabName === 'predict' ? 'block' : 'none';
  document.getElementById('leaderboardTab').style.display = tabName === 'leaderboard' ? 'block' : 'none';
  document.getElementById('adminTabContent').style.display = tabName === 'admin' ? 'block' : 'none';
  
  if (tabName === 'leaderboard') loadLeaderboard();
  if (tabName === 'admin') loadAdminMatches();
}

// Auth functions
async function doSignup() {
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  if (!email || !password) return showNotification('Please enter email and password', true);
  if (password.length < 6) return showNotification('Password must be at least 6 characters', true);
  
  const { error } = await supabase.auth.signUp({ email, password });
  if (error) return showNotification('Sign up error: ' + error.message, true);
  showNotification('Account created! Please login.');
  showLoginPanel();
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showNotification('Please enter email and password', true);
  
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) return showNotification('Login failed: ' + error.message, true);
  currentUser = data.user;
  showApp();
}

async function doLogout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
}

function showSignupPanel() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('signupPanel').style.display = 'block';
}

function showLoginPanel() {
  document.getElementById('signupPanel').style.display = 'none';
  document.getElementById('loginPanel').style.display = 'block';
}

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    showApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
}

async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmailDisplay').textContent = currentUser.email;
  
  // Check if admin
  const isAdmin = currentUser.email === 'admin@worldcup.com';
  if (isAdmin) {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('adminTabBtn').style.display = 'inline-block';
  }
  
  await loadMatches();
}

async function loadMatches() {
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*')
    .order('kickoff_time', { ascending: true });
  
  if (error) return showNotification('Error loading matches', true);
  
  allMatches = matches;
  filterAndSortMatches();
  document.getElementById('matchStats').textContent = `${matches.length} total matches`;
}

function filterAndSortMatches() {
  const stage = document.getElementById('stageFilter').value;
  const search = document.getElementById('teamFilter').value.toLowerCase();
  
  let filtered = [...allMatches];
  if (stage === 'group') filtered = filtered.filter(m => !m.is_knockout);
  if (stage === 'knockout') filtered = filtered.filter(m => m.is_knockout);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || 
    m.team_b.toLowerCase().includes(search)
  );
  
  // Sort matches
  if (currentSort === 'date') {
    filtered.sort((a, b) => new Date(a.kickoff_time) - new Date(b.kickoff_time));
  } else if (currentSort === 'team') {
    filtered.sort((a, b) => a.team_a.localeCompare(b.team_a));
  }
  
  renderMatches(filtered);
}

async function renderMatches(matches) {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = '';
  
  const { data: predictions } = await supabase
    .from('predictions')
    .select('*')
    .eq('user_id', currentUser.id);
  
  const predMap = {};
  if (predictions) predictions.forEach(p => predMap[p.match_id] = p);
  
  for (const match of matches) {
    const isDeadlinePassed = new Date(match.kickoff_time) < new Date();
    const userPred = predMap[match.id];
    
    const card = document.createElement('div');
    card.className = 'match-card';
    
    let resultHtml = '';
    if (match.finished) {
      resultHtml = `<div class="result-display">? FINAL: ${match.score_a} - ${match.score_b}</div>`;
    }
    
    card.innerHTML = `
      <div class="match-title">
        ${match.team_a} vs ${match.team_b}
        ${match.is_knockout ? ' ?? Knockout' : ' ?? Group'}
        ${match.finished ? '<span class="finished-badge">Finished</span>' : ''}
      </div>
      ${resultHtml}
      ${!isDeadlinePassed && !match.finished ? `
        <div class="prediction-inputs">
          <input type="number" id="score-a-${match.id}" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
          <span>vs</span>
          <input type="number" id="score-b-${match.id}" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
        </div>
        <button class="submit-btn" onclick="submitPrediction('${match.id}')">
          ${userPred ? 'Update' : 'Submit'} Prediction
        </button>
      ` : match.finished ? `
        ${userPred ? `<div style="margin-top:10px; padding:8px; background:rgba(255,255,255,0.1); border-radius:6px; font-size:12px;">
          Your prediction: ${userPred.pred_score_a} - ${userPred.pred_score_b}
          ${userPred.points ? ` | Points: ${userPred.points}` : ''}
        </div>` : ''}
      ` : `
        <div style="text-align:center; color:#fbbf24;">? Deadline Passed</div>
      `}
      <div class="deadline">?? ${new Date(match.kickoff_time).toLocaleString()}</div>
    `;
    container.appendChild(card);
  }
}

window.submitPrediction = async function(matchId) {
  const scoreA = document.getElementById(`score-a-${matchId}`).value;
  const scoreB = document.getElementById(`score-b-${matchId}`).value;
  if (!scoreA || !scoreB) return showNotification('Please enter both scores', true);
  
  const { data: existing } = await supabase
    .from('predictions')
    .select('id')
    .eq('user_id', currentUser.id)
    .eq('match_id', matchId)
    .maybeSingle();
  
  let error;
  if (existing) {
    const { error: updateError } = await supabase
      .from('predictions')
      .update({ pred_score_a: parseInt(scoreA), pred_score_b: parseInt(scoreB) })
      .eq('id', existing.id);
    error = updateError;
  } else {
    const { error: insertError } = await supabase
      .from('predictions')
      .insert({ user_id: currentUser.id, match_id: matchId, pred_score_a: parseInt(scoreA), pred_score_b: parseInt(scoreB) });
    error = insertError;
  }
  
  if (error) return showNotification('Error: ' + error.message, true);
  showNotification('Prediction saved!');
  await loadMatches();
};

async function loadLeaderboard() {
  const container = document.getElementById('leaderboardContainer');
  container.innerHTML = '<div class="loading">Loading leaderboard...</div>';
  
  const { data: leaderboard, error } = await supabase
    .from('leaderboard')
    .select('*')
    .limit(50);
  
  if (error) return container.innerHTML = '<div class="error">Error loading leaderboard</div>';
  
  if (!leaderboard || leaderboard.length === 0) {
    container.innerHTML = '<div class="loading">No users yet</div>';
    return;
  }
  
  container.innerHTML = '<div class="leaderboard-list"></div>';
  const list = container.querySelector('.leaderboard-list');
  leaderboard.forEach((user, i) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `<span>${i+1}. ${user.username || 'User'}</span><span style="font-weight:bold; color:#fbbf24;">${user.total_points || 0} pts</span>`;
    list.appendChild(item);
  });
}

async function loadAdminMatches() {
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*')
    .order('kickoff_time', { ascending: true });
  
  if (error) return;
  adminMatches = matches;
  filterAdminMatches();
}

function filterAdminMatches() {
  const filter = document.getElementById('adminStageFilter').value;
  const search = document.getElementById('adminTeamFilter').value.toLowerCase();
  
  let filtered = [...adminMatches];
  if (filter === 'pending') filtered = filtered.filter(m => !m.finished);
  if (filter === 'finished') filtered = filtered.filter(m => m.finished);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search)
  );
  
  renderAdminMatches(filtered);
}

function renderAdminMatches(matches) {
  const container = document.getElementById('adminMatchesContainer');
  container.innerHTML = '';
  
  for (const match of matches) {
    const card = document.createElement('div');
    card.className = 'match-card';
    
    if (match.finished) {
      card.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          ${match.is_knockout ? ' ?? Knockout' : ' ?? Group'}
          <span class="finished-badge">Finished</span>
        </div>
        <div class="result-display">Result: ${match.score_a} - ${match.score_b}</div>
        <button class="submit-btn reset-btn" onclick="resetMatchResult('${match.id}')">Reset Result</button>
        <div class="deadline">?? ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
    } else {
      card.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          ${match.is_knockout ? ' ?? Knockout' : ' ?? Group'}
        </div>
        <div class="admin-result-inputs">
          <input type="number" id="admin-score-a-${match.id}" placeholder="${match.team_a} score">
          <span>vs</span>
          <input type="number" id="admin-score-b-${match.id}" placeholder="${match.team_b} score">
        </div>
        ${match.is_knockout ? `
          <div class="admin-result-inputs">
            <select id="admin-advancing-${match.id}">
              <option value="">Who advanced? (if draw)</option>
              <option value="${match.team_a}">${match.team_a}</option>
              <option value="${match.team_b}">${match.team_b}</option>
            </select>
          </div>
        ` : ''}
        <button class="submit-btn admin-btn" onclick="setMatchResult('${match.id}', ${match.is_knockout})">
          ? Set Result & Calculate Points
        </button>
        <div class="deadline">?? ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
    }
    container.appendChild(card);
  }
}

window.setMatchResult = async function(matchId, isKnockout) {
  const scoreA = parseInt(document.getElementById(`admin-score-a-${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`admin-score-b-${matchId}`).value);
  
  if (isNaN(scoreA) || isNaN(scoreB)) {
    showNotification('Please enter valid scores', true);
    return;
  }
  
  let advancingTeam = null;
  if (isKnockout) {
    advancingTeam = document.getElementById(`admin-advancing-${matchId}`).value;
    if (!advancingTeam) {
      showNotification('Please select which team advanced', true);
      return;
    }
  }
  
  const updateData = {
    score_a: scoreA,
    score_b: scoreB,
    finished: true
  };
  
  if (advancingTeam) {
    updateData.advancing_team = advancingTeam;
  }
  
  const { error } = await supabase
    .from('matches')
    .update(updateData)
    .eq('id', matchId);
  
  if (error) {
    showNotification('Error: ' + error.message, true);
  } else {
    showNotification('Result set! Points calculated automatically!');
    await loadAdminMatches();
    await loadMatches();
    await loadLeaderboard();
  }
};

window.resetMatchResult = async function(matchId) {
  const { error } = await supabase
    .from('matches')
    .update({ score_a: null, score_b: null, finished: false, advancing_team: null })
    .eq('id', matchId);
  
  if (error) {
    showNotification('Error: ' + error.message, true);
  } else {
    showNotification('Result reset!');
    await loadAdminMatches();
    await loadMatches();
    await loadLeaderboard();
  }
};

// Initialize
document.getElementById('loginButton').addEventListener('click', doLogin);
document.getElementById('signupButton').addEventListener('click', doSignup);
document.getElementById('logoutButton').addEventListener('click', doLogout);
document.getElementById('showSignupLink').addEventListener('click', showSignupPanel);
document.getElementById('showLoginLink').addEventListener('click', showLoginPanel);

checkAuth();
</script>
</body>
</html>
