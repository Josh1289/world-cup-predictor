<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a472a;
      color: white;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      color: black;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: black;
    }
    .match-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      color: black;
    }
    .match-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #FF6B35;
    }
    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }
    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #FF6B35;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      text-align: center;
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }
    .deadline {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: #666;
    }
    .logout-btn {
      background: #dc3545;
    }
    .msg {
      text-align: center;
      margin-top: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>

<div id="loginSection" class="container">
  <div class="login-box">
    <h2 style="text-align:center;">WORLD CUP 2026</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginButton">LOGIN</button>
    <button id="signupButton" style="background:#666;">CREATE ACCOUNT</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="appSection" style="display:none;">
  <div class="container">
    <div class="header">
      <h2>WORLD CUP 2026 PREDICTOR</h2>
      <div>
        <span id="userEmail"></span>
        <button id="logoutButton" class="logout-btn">LOGOUT</button>
      </div>
    </div>
    <div id="matchesContainer"></div>
  </div>
</div>

<script>
// Use a unique variable name to avoid conflicts
const MY_SUPABASE = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let currentUser = null;

function showMessage(msg, isError, elementId) {
  const el = document.getElementById(elementId);
  if (el) {
    el.innerHTML = msg;
    el.style.color = isError ? '#dc3545' : '#28a745';
    setTimeout(() => { if (el) el.innerHTML = ''; }, 3000);
  }
}

async function handleLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  const { data, error } = await MY_SUPABASE.auth.signInWithPassword({ email, password });
  if (error) {
    showMessage(error.message, true, 'loginMsg');
  } else {
    currentUser = data.user;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    loadMatches();
  }
}

async function handleSignup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (password.length < 6) {
    showMessage('Password must be at least 6 characters', true, 'loginMsg');
    return;
  }
  
  const { error } = await MY_SUPABASE.auth.signUp({ email, password });
  if (error) {
    showMessage(error.message, true, 'loginMsg');
  } else {
    showMessage('Account created! You can now login.', false, 'loginMsg');
  }
}

async function handleLogout() {
  await MY_SUPABASE.auth.signOut();
  currentUser = null;
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = 'Loading matches...';
  
  const { data: matches, error } = await MY_SUPABASE
    .from('matches')
    .select('*')
    .order('kickoff_time', { ascending: true });
  
  if (error) {
    container.innerHTML = 'Error loading matches: ' + error.message;
    return;
  }
  
  if (!matches || matches.length === 0) {
    container.innerHTML = 'No matches found. Please run the SQL to add matches.';
    return;
  }
  
  const { data: predictions } = await MY_SUPABASE
    .from('predictions')
    .select('*')
    .eq('user_id', currentUser.id);
  
  const predMap = {};
  if (predictions) {
    predictions.forEach(p => { predMap[p.match_id] = p; });
  }
  
  container.innerHTML = '';
  
  for (const match of matches) {
    const userPred = predMap[match.id];
    const isFinished = match.finished;
    const deadlinePassed = new Date(match.kickoff_time) < new Date();
    
    const card = document.createElement('div');
    card.className = 'match-card';
    
    card.innerHTML = `
      <div class="match-title">
        ${match.team_a} vs ${match.team_b}
        ${match.is_knockout ? '?? KNOCKOUT' : '?? GROUP'}
        ${isFinished ? '? FINISHED' : ''}
      </div>
      ${isFinished ? `<div class="result">FINAL SCORE: ${match.score_a} - ${match.score_b}</div>` : ''}
      ${!deadlinePassed && !isFinished ? `
        <div class="prediction-inputs">
          <input type="number" id="a_${match.id}" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
          <span>vs</span>
          <input type="number" id="b_${match.id}" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
        </div>
        <button class="savePredBtn" data-match-id="${match.id}">${userPred ? 'UPDATE' : 'SUBMIT'} PREDICTION</button>
      ` : userPred && !isFinished ? `
        <div class="result">Your prediction: ${userPred.pred_score_a} - ${userPred.pred_score_b}</div>
      ` : deadlinePassed && !isFinished ? `
        <div class="result">? DEADLINE PASSED</div>
      ` : ''}
      <div class="deadline">Kickoff: ${new Date(match.kickoff_time).toLocaleString()}</div>
    `;
    
    container.appendChild(card);
  }
  
  // Add event listeners to all prediction buttons
  document.querySelectorAll('.savePredBtn').forEach(btn => {
    btn.addEventListener('click', function() {
      const matchId = this.getAttribute('data-match-id');
      savePrediction(matchId);
    });
  });
}

async function savePrediction(matchId) {
  const scoreA = parseInt(document.getElementById(`a_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`b_${matchId}`).value);
  
  if (isNaN(scoreA) || isNaN(scoreB)) {
    alert('Please enter both scores');
    return;
  }
  
  // First check if prediction exists
  const { data: existing } = await MY_SUPABASE
    .from('predictions')
    .select('id')
    .eq('user_id', currentUser.id)
    .eq('match_id', matchId);
  
  let result;
  if (existing && existing.length > 0) {
    // Update existing prediction
    result = await MY_SUPABASE
      .from('predictions')
      .update({ pred_score_a: scoreA, pred_score_b: scoreB })
      .eq('id', existing[0].id);
  } else {
    // Insert new prediction
    result = await MY_SUPABASE
      .from('predictions')
      .insert({ user_id: currentUser.id, match_id: matchId, pred_score_a: scoreA, pred_score_b: scoreB });
  }
  
  if (result.error) {
    alert('Error: ' + result.error.message);
  } else {
    alert('Prediction saved!');
    loadMatches();
  }
}

// Set up event listeners
document.getElementById('loginButton').addEventListener('click', handleLogin);
document.getElementById('signupButton').addEventListener('click', handleSignup);
document.getElementById('logoutButton').addEventListener('click', handleLogout);

// Check if user is already logged in
(async function() {
  const { data: { session } } = await MY_SUPABASE.auth.getSession();
  if (session) {
    currentUser = session.user;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    loadMatches();
  }
})();
</script>
</body>
</html>
