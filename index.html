<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #ffffff;
      padding: 20px;
    }

    /* Stadium light effect */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Login Box */
    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(10, 10, 30, 0.95) 100%);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    #loginBox h2 {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      background: rgba(30, 30, 50, 0.8);
      color: #fff;
      font-size: 16px;
    }

    #loginBox input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
    }

    #loginBox button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
    }

    /* Main Page */
    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(20, 20, 40, 0.95) 0%, rgba(10, 10, 30, 0.95) 100%);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      border-bottom: 2px solid #FFD700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .header h2 {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 28px;
    }

    .admin-badge {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }

    .logout-btn {
      background: rgba(255, 215, 0, 0.15);
      color: #FFD700;
      padding: 10px 25px;
      border: 1px solid #FFD700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255, 215, 0, 0.3);
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab {
      padding: 12px 30px;
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      color: #FFD700;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .tab.active {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
      border-color: #FFD700;
    }

    /* Match Day Groups */
    .match-day-group {
      margin-bottom: 30px;
      background: rgba(20, 20, 40, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.15);
    }

    .match-day-header {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 165, 0, 0.05) 100%);
      padding: 15px 25px;
      border-left: 4px solid #FFD700;
    }

    .match-day-date {
      color: #FFD700;
      font-size: 22px;
      font-weight: bold;
    }

    .match-day-count {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 5px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1px;
      background: rgba(0,0,0,0.2);
    }

    .match-card {
      background: rgba(25, 25, 45, 0.9);
      padding: 20px;
      transition: all 0.3s;
    }

    .match-card:hover {
      background: rgba(35, 35, 60, 0.95);
      transform: translateX(5px);
    }

    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-with-flag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .flag {
      font-size: 24px;
    }

    .vs {
      color: #FFD700;
      font-weight: bold;
      margin: 0 5px;
    }

    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(255, 215, 0, 0.15);
      border-radius: 20px;
      font-size: 11px;
      color: #FFD700;
    }

    .finished-badge {
      display: inline-block;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 10px;
    }

    .result-display {
      text-align: center;
      color: #FFD700;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      background: rgba(0,0,0,0.5);
      color: #FFD700;
      border-radius: 10px;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
    }

    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* Leaderboard */
    .leaderboard-container {
      background: rgba(20, 20, 40, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      overflow: hidden;
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 165, 0, 0.1) 100%);
      color: #FFD700;
      padding: 15px 25px;
      font-weight: bold;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 14px 25px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
    }

    .leaderboard-item:hover {
      background: rgba(255, 215, 0, 0.05);
    }

    .filter-group {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      background: rgba(20, 20, 40, 0.7);
      padding: 15px 20px;
      border-radius: 12px;
    }

    .filter-group select, .filter-group input {
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      background: rgba(30, 30, 50, 0.8);
      color: #FFD700;
    }

    .sort-btn {
      padding: 8px 18px;
      background: rgba(30, 30, 50, 0.8);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      color: #FFD700;
      cursor: pointer;
    }

    .sort-btn.active {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
    }

    .stats {
      color: #FFD700;
      margin-left: auto;
    }

    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    .admin-result-inputs input, .admin-result-inputs select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      background: rgba(30, 30, 50, 0.8);
      color: #FFD700;
    }

    .admin-btn {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #1a1a2e;
    }

    .reset-btn {
      background: rgba(220, 53, 69, 0.8);
      color: white;
    }

    .msg {
      margin-top: 20px;
      text-align: center;
      color: #FFD700;
    }
  </style>
</head>
<body>

<!-- LOGIN BOX -->
<div id="loginBox">
  <h2>?? WORLD CUP 2026 ??</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<!-- MAIN PAGE -->
<div id="mainPage" style="display:none;">
  <div class="header">
    <h2>?? WORLD CUP 2026 PREDICTOR ??</h2>
    <div>
      <span id="userEmail"></span>
      <span id="adminBadge" class="admin-badge">ADMIN</span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="showPredictions">? MATCH PREDICTIONS</button>
    <button class="tab" id="showLeaderboard">?? LEADERBOARD</button>
    <button class="tab" id="showAdmin" style="display:none;">?? ADMIN</button>
  </div>

  <div id="predictionsPanel">
    <div class="filter-group">
      <select id="matchFilter">
        <option value="all">All Matches</option>
        <option value="group">Group Stage</option>
        <option value="knockout">Knockout Stage</option>
      </select>
      <input type="text" id="teamSearch" placeholder="?? Search teams...">
      <div>
        <button class="sort-btn active" data-sort="date">?? Date</button>
        <button class="sort-btn" data-sort="team">?? Team</button>
      </div>
      <span class="stats" id="matchCount"></span>
    </div>
    <div id="matchesList"></div>
  </div>

  <div id="leaderboardPanel" style="display:none;">
    <div id="leaderboardList"></div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="filter-group">
      <select id="adminFilter">
        <option value="all">All Matches</option>
        <option value="pending">Pending Results</option>
        <option value="finished">Finished</option>
      </select>
      <input type="text" id="adminSearch" placeholder="?? Search teams...">
    </div>
    <div id="adminMatchesList"></div>
  </div>
</div>

<script>
// Country flags mapping
const flags = {
  'Mexico': '????', 'South Africa': '????', 'South Korea': '????', 'Czech Republic': '????',
  'Canada': '????', 'Bosnia and Herzegovina': '????', 'Qatar': '????', 'Switzerland': '????',
  'Brazil': '????', 'Morocco': '????', 'Haiti': '????', 'Scotland': '??????????????',
  'USA': '????', 'Paraguay': '????', 'Australia': '????', 'Turkey': '????',
  'Germany': '????', 'Curaçao': '????', 'Ivory Coast': '????', 'Ecuador': '????',
  'Netherlands': '????', 'Japan': '????', 'Sweden': '????', 'Tunisia': '????',
  'Belgium': '????', 'Egypt': '????', 'Iran': '????', 'New Zealand': '????',
  'Spain': '????', 'Cape Verde': '????', 'Saudi Arabia': '????', 'Uruguay': '????',
  'France': '????', 'Senegal': '????', 'Iraq': '????', 'Norway': '????',
  'Austria': '????', 'Jordan': '????', 'Argentina': '????', 'Algeria': '????',
  'Portugal': '????', 'DR Congo': '????', 'Uzbekistan': '????', 'Colombia': '????',
  'England': '??????????????', 'Croatia': '????', 'Ghana': '????', 'Panama': '????'
};

function getTeamWithFlag(teamName) {
  const flag = flags[teamName] || '??';
  return `<span class="team-with-flag"><span class="flag">${flag}</span> ${teamName}</span>`;
}

// Supabase
const _supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let user = null;
let allMatches = [];
let currentSort = 'date';

function showMsg(text, isError = false) {
  const msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#ff6b6b' : '#FFD700';
  setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
}

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  
  const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
  if (error) return showMsg(error.message, true);
  
  user = data.user;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmail').innerHTML = user.email;
  
  if (user.email === 'admin@worldcup.com') {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('showAdmin').style.display = 'inline-block';
  }
  
  loadMatches();
  loadLeaderboard();
}

async function signup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  if (password.length < 6) return showMsg('Password min 6 characters', true);
  
  const { error } = await _supabase.auth.signUp({ email, password });
  if (error) return showMsg(error.message, true);
  showMsg('Account created! You can now login.');
}

async function logout() {
  await _supabase.auth.signOut();
  user = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
}

async function loadMatches() {
  const { data, error } = await _supabase.from('matches').select('*').order('kickoff_time');
  if (error) return;
  allMatches = data;
  document.getElementById('matchCount').textContent = data.length + ' matches';
  filterAndShowMatches();
}

function filterAndShowMatches() {
  let filtered = [...allMatches];
  const stage = document.getElementById('matchFilter').value;
  const search = document.getElementById('teamSearch').value.toLowerCase();
  
  if (stage === 'group') filtered = filtered.filter(m => !m.is_knockout);
  if (stage === 'knockout') filtered = filtered.filter(m => m.is_knockout);
  if (search) filtered = filtered.filter(m => 
    m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search)
  );
  
  if (currentSort === 'date') {
    filtered.sort((a,b) => new Date(a.kickoff_time) - new Date(b.kickoff_time));
  } else {
    filtered.sort((a,b) => a.team_a.localeCompare(b.team_a));
  }
  
  renderMatchesGroupedByDay(filtered);
}

async function renderMatchesGroupedByDay(matches) {
  const container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  const { data: predictions } = await _supabase.from('predictions').select('*').eq('user_id', user.id);
  const predMap = {};
  if (predictions) predictions.forEach(p => predMap[p.match_id] = p);
  
  const grouped = {};
  matches.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = `<div class="match-day-header"><div class="match-day-date">${date}</div><div class="match-day-count">${dayMatches.length} matches</div></div><div class="matches-grid"></div>`;
    container.appendChild(dayGroup);
    
    const grid = dayGroup.querySelector('.matches-grid');
    
    for (const match of dayMatches) {
      const deadlinePassed = new Date(match.kickoff_time) < new Date();
      const userPred = predMap[match.id];
      const card = document.createElement('div');
      card.className = 'match-card';
      
      card.innerHTML = `
        <div class="match-title">
          ${getTeamWithFlag(match.team_a)} <span class="vs">VS</span> ${getTeamWithFlag(match.team_b)}
          <span class="match-stage">${match.is_knockout ? 'KNOCKOUT' : 'GROUP'}</span>
          ${match.finished ? '<span class="finished-badge">? FINISHED</span>' : ''}
        </div>
        ${match.finished ? `<div class="result-display">FINAL: ${match.score_a} - ${match.score_b}</div>` : ''}
        ${!deadlinePassed && !match.finished ? `
          <div class="prediction-inputs">
            <input type="number" id="scoreA_${match.id}" placeholder="${match.team_a}" value="${userPred ? userPred.pred_score_a : ''}">
            <span>vs</span>
            <input type="number" id="scoreB_${match.id}" placeholder="${match.team_b}" value="${userPred ? userPred.pred_score_b : ''}">
          </div>
          <button class="submit-btn" onclick="savePrediction('${match.id}')">${userPred ? 'UPDATE' : 'SUBMIT'} PREDICTION</button>
        ` : match.finished && userPred ? `
          <div style="text-align:center; margin-top:10px; padding:10px; background:rgba(0,0,0,0.3); border-radius:8px;">
            Your pick: ${userPred.pred_score_a} - ${userPred.pred_score_b} ${userPred.points ? `| POINTS: ${userPred.points}` : ''}
          </div>
        ` : deadlinePassed && !match.finished ? `<div style="text-align:center; color:#FFD700;">? DEADLINE PASSED</div>` : ''}
        <div class="deadline">? ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
      grid.appendChild(card);
    }
  }
}

window.savePrediction = async function(matchId) {
  const scoreA = parseInt(document.getElementById(`scoreA_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`scoreB_${matchId}`).value);
  if (isNaN(scoreA) || isNaN(scoreB)) return showMsg('Enter both scores', true);
  
  const { data: existing } = await _supabase.from('predictions').select('id').eq('user_id', user.id).eq('match_id', matchId).maybeSingle();
  
  if (existing) {
    await _supabase.from('predictions').update({ pred_score_a: scoreA, pred_score_b: scoreB }).eq('id', existing.id);
  } else {
    await _supabase.from('predictions').insert({ user_id: user.id, match_id: matchId, pred_score_a: scoreA, pred_score_b: scoreB });
  }
  
  showMsg('Prediction saved!');
  loadMatches();
  loadLeaderboard();
};

async function loadLeaderboard() {
  const { data, error } = await _supabase.from('leaderboard').select('*').limit(50);
  if (error) return;
  
  const container = document.getElementById('leaderboardList');
  if (!data || data.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">No users yet</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="leaderboard-container">
      <div class="leaderboard-header"><div>?? RANK</div><div>?? PLAYER</div><div>? POINTS</div></div>
      <div id="leaderboardItems"></div>
    </div>
  `;
  
  const itemsDiv = container.querySelector('#leaderboardItems');
  data.forEach((u, i) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `<div>${i+1}</div><div>${u.username || 'User'}</div><div style="color:#FFD700; font-weight:bold;">${u.total_points || 0}</div>`;
    itemsDiv.appendChild(item);
  });
}

async function loadAdminMatches() {
  const { data, error } = await _supabase.from('matches').select('*').order('kickoff_time');
  if (error) return;
  renderAdminMatches(data);
}

function renderAdminMatches(matches) {
  const container = document.getElementById('adminMatchesList');
  const filter = document.getElementById('adminFilter').value;
  const search = document.getElementById('adminSearch').value.toLowerCase();
  
  let filtered = matches;
  if (filter === 'pending') filtered = filtered.filter(m => !m.finished);
  if (filter === 'finished') filtered = filtered.filter(m => m.finished);
  if (search) filtered = filtered.filter(m => m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search));
  
  const grouped = {};
  filtered.forEach(m => {
    const date = new Date(m.kickoff_time).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  container.innerHTML = '';
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = `<div class="match-day-header"><div class="match-day-date">${date}</div><div class="match-day-count">${dayMatches.length} matches</div></div><div class="matches-grid"></div>`;
    container.appendChild(dayGroup);
    
    const grid = dayGroup.querySelector('.matches-grid');
    
    for (const match of dayMatches) {
      const card = document.createElement('div');
      card.className = 'match-card';
      if (match.finished) {
        card.innerHTML = `
          <div class="match-title">${getTeamWithFlag(match.team_a)} VS ${getTeamWithFlag(match.team_b)}</div>
          <div class="result-display">RESULT: ${match.score_a} - ${match.score_b}</div>
          <button class="submit-btn reset-btn" onclick="resetMatch('${match.id}')">?? RESET</button>
        `;
      } else {
        card.innerHTML = `
          <div class="match-title">${getTeamWithFlag(match.team_a)} VS ${getTeamWithFlag(match.team_b)}</div>
          <div class="admin-result-inputs">
            <input type="number" id="adminA_${match.id}" placeholder="${match.team_a}">
            <span>vs</span>
            <input type="number" id="adminB_${match.id}" placeholder="${match.team_b}">
          </div>
          ${match.is_knockout ? `<select id="advance_${match.id}" style="width:100%; margin:10px 0; padding:10px; background:rgba(30,30,50,0.8); color:#FFD700; border:1px solid rgba(255,215,0,0.3); border-radius:8px;"><option value="">?? Who advanced?</option><option value="${match.team_a}">${match.team_a}</option><option value="${match.team_b}">${match.team_b}</option></select>` : ''}
          <button class="submit-btn admin-btn" onclick="setResult('${match.id}', ${match.is_knockout})">? SET RESULT</button>
        `;
      }
      grid.appendChild(card);
    }
  }
}

window.setResult = async function(matchId, isKnockout) {
  const a = parseInt(document.getElementById(`adminA_${matchId}`).value);
  const b = parseInt(document.getElementById(`adminB_${matchId}`).value);
  if (isNaN(a) || isNaN(b)) return showMsg('Enter valid scores', true);
  
  let advance = null;
  if (isKnockout) {
    advance = document.getElementById(`advance_${matchId}`).value;
    if (!advance) return showMsg('Select advancing team', true);
  }
  
  const update = { score_a: a, score_b: b, finished: true };
  if (advance) update.advancing_team = advance;
  
  await _supabase.from('matches').update(update).eq('id', matchId);
  showMsg('Result set! Points calculated!');
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};

window.resetMatch = async function(matchId) {
  await _supabase.from('matches').update({ score_a: null, score_b: null, finished: false, advancing_team: null }).eq('id', matchId);
  showMsg('Result reset!');
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};

// Event listeners
document.getElementById('loginBtn').onclick = login;
document.getElementById('signupBtn').onclick = signup;
document.getElementById('logoutBtn').onclick = logout;
document.getElementById('showPredictions').onclick = () => {
  document.getElementById('predictionsPanel').style.display = 'block';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showPredictions').classList.add('active');
  loadMatches();
};
document.getElementById('showLeaderboard').onclick = () => {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'block';
  document.getElementById('adminPanel').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showLeaderboard').classList.add('active');
  loadLeaderboard();
};
document.getElementById('showAdmin').onclick = async () => {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('showAdmin').classList.add('active');
  await loadAdminMatches();
};

document.getElementById('matchFilter').onchange = filterAndShowMatches;
document.getElementById('teamSearch').onkeyup = filterAndShowMatches;
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.onclick = () => {
    currentSort = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterAndShowMatches();
  };
});
document.getElementById('adminFilter').onchange = loadAdminMatches;
document.getElementById('adminSearch').onkeyup = loadAdminMatches;

// Check session
(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    user = session.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = user.email;
    if (user.email === 'admin@worldcup.com') {
      document.getElementById('adminBadge').style.display = 'inline-block';
      document.getElementById('showAdmin').style.display = 'inline-block';
    }
    loadMatches();
    loadLeaderboard();
  }
})();
</script>
