<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      color: #333;
    }

    .auth-card h1 {
      margin-bottom: 30px;
      text-align: center;
      color: #667eea;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .auth-card button:hover {
      background: #5a67d8;
    }

    .signup-btn {
      background: #48bb78 !important;
    }

    .app-screen {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .section {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .match-card {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 20px;
    }

    .match-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .leaderboard-item {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 10px;
      background: white;
      color: #333;
      z-index: 1000;
    }

    .debug-panel {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 5px;
      max-width: 300px;
      z-index: 9999;
    }
  </style>
</head>

<body>
<div class="container">
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1>? World Cup Predictor</h1>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="handleSignUp()" class="signup-btn" style="background: #48bb78;">Create Account</button>
      <button onclick="handleSignIn()">Login</button>
    </div>
  </div>

  <div id="appScreen" class="app-screen">
    <div class="header">
      <h1>? World Cup Predictor</h1>
      <div>
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <div class="section">
      <h2>?? Matches</h2>
      <div id="matchesContainer" class="matches-grid"></div>
    </div>

    <div class="section">
      <h2>?? Leaderboard</h2>
      <div id="leaderboardContainer"></div>
    </div>
  </div>
</div>

<div class="debug-panel" id="debugPanel">
  Console: Ready<br>
  <span id="debugStatus"></span>
</div>

<script>
const supabaseUrl = "https://igatvhqatxrhgnshmdld.supabase.co";
const supabaseAnonKey = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

let currentUser = null;

function debugLog(message) {
  console.log(message);
  const debugSpan = document.getElementById('debugStatus');
  if (debugSpan) {
    debugSpan.innerHTML = message + '<br>' + debugSpan.innerHTML;
    setTimeout(() => {
      if (debugSpan.innerHTML === message + '<br>') {
        debugSpan.innerHTML = '';
      }
    }, 5000);
  }
}

function showNotification(message, isError = false) {
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.style.background = isError ? '#fee' : '#e8f5e9';
  notification.style.color = isError ? '#c62828' : '#2e7d32';
  notification.style.borderLeft = `4px solid ${isError ? '#c62828' : '#2e7d32'}`;
  notification.textContent = message;
  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 3000);
  debugLog(message);
}

async function handleSignUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  debugLog(`Attempting signup with: ${email}`);
  
  if (!email || !password) {
    showNotification('Please enter email and password', true);
    return;
  }
  
  if (password.length < 6) {
    showNotification('Password must be at least 6 characters', true);
    return;
  }
  
  try {
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
    });
    
    if (error) {
      debugLog(`Signup error: ${error.message}`);
      throw error;
    }
    
    debugLog(`Signup response: ${JSON.stringify(data)}`);
    
    if (data.user) {
      showNotification('Account created successfully! You can now login.');
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    } else {
      showNotification('Account created but please check email for confirmation', true);
    }
  } catch (error) {
    debugLog(`Error: ${error.message}`);
    showNotification('Sign up error: ' + error.message, true);
  }
}

async function handleSignIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  debugLog(`Attempting login with: ${email}`);
  
  if (!email || !password) {
    showNotification('Please enter email and password', true);
    return;
  }
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });
    
    if (error) {
      debugLog(`Login error: ${error.message}`);
      throw error;
    }
    
    debugLog(`Login success: ${data.user.email}`);
    currentUser = data.user;
    showNotification('Welcome!');
    showApp();
  } catch (error) {
    debugLog(`Error: ${error.message}`);
    showNotification('Login failed: ' + error.message, true);
  }
}

async function handleLogout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  showNotification('Logged out');
}

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  debugLog(`Session check: ${session ? 'Logged in' : 'Not logged in'}`);
  
  if (session) {
    currentUser = session.user;
    showApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
}

async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmail').textContent = currentUser.email;
  
  await loadMatches();
  await loadLeaderboard();
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = '<div>Loading matches...</div>';
  
  try {
    const { data: matches, error } = await supabase
      .from('matches')
      .select('*')
      .order('kickoff_time');
    
    if (error) throw error;
    
    if (!matches || matches.length === 0) {
      container.innerHTML = '<div>No matches available</div>';
      return;
    }
    
    container.innerHTML = '';
    
    for (const match of matches) {
      const matchDiv = document.createElement('div');
      matchDiv.className = 'match-card';
      matchDiv.innerHTML = `
        <div class="match-title">${match.team_a} vs ${match.team_b}</div>
        <div class="prediction-inputs">
          <input type="number" id="score-a-${match.id}" placeholder="${match.team_a}">
          <span>vs</span>
          <input type="number" id="score-b-${match.id}" placeholder="${match.team_b}">
        </div>
        <button class="submit-btn" onclick="submitPrediction('${match.id}')">Submit Prediction</button>
        <div class="deadline">Kickoff: ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
      container.appendChild(matchDiv);
    }
  } catch (error) {
    debugLog(`Error loading matches: ${error.message}`);
    container.innerHTML = '<div class="error">Error loading matches</div>';
  }
}

async function submitPrediction(matchId) {
  const scoreA = document.getElementById(`score-a-${matchId}`).value;
  const scoreB = document.getElementById(`score-b-${matchId}`).value;
  
  if (!scoreA || !scoreB) {
    showNotification('Please enter both scores', true);
    return;
  }
  
  try {
    const { error } = await supabase
      .from('predictions')
      .insert({
        user_id: currentUser.id,
        match_id: matchId,
        pred_score_a: parseInt(scoreA),
        pred_score_b: parseInt(scoreB)
      });
    
    if (error) throw error;
    
    showNotification('Prediction saved!');
  } catch (error) {
    showNotification('Error: ' + error.message, true);
  }
}

async function loadLeaderboard() {
  const container = document.getElementById('leaderboardContainer');
  container.innerHTML = '<div>Loading leaderboard...</div>';
  
  try {
    const { data: profiles, error } = await supabase
      .from('profiles')
      .select('username, total_points')
      .order('total_points', { ascending: false })
      .limit(10);
    
    if (error) throw error;
    
    if (!profiles || profiles.length === 0) {
      container.innerHTML = '<div>No users yet</div>';
      return;
    }
    
    container.innerHTML = '';
    profiles.forEach((user, index) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      item.innerHTML = `
        <span>${index + 1}. ${user.username || 'User'}</span>
        <span>${user.total_points || 0} pts</span>
      `;
      container.appendChild(item);
    });
  } catch (error) {
    debugLog(`Error loading leaderboard: ${error.message}`);
    container.innerHTML = '<div>Error loading leaderboard</div>';
  }
}

// Check auth on load
checkAuth();

// Add manual refresh button to console
window.debug = {
  checkSession: async () => {
    const { data } = await supabase.auth.getSession();
    console.log('Session:', data);
    return data;
  },
  listUsers: async () => {
    const { data } = await supabase.from('profiles').select('*');
    console.log('Users:', data);
    return data;
  }
};
</script>
</body>
</html>
