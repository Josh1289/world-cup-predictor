    // --- Knockout Bracket State ---
    let bracketPredMap = {};
    let bracketMatchesMap = {};

    function getPredictedWinner(match, pred) {
      if (!match || !pred) return null;
      if (!match.team_a || !match.team_b || match.team_a === 'TBD' || match.team_b === 'TBD') return null;
      if (pred.pred_score_a > pred.pred_score_b) return match.team_a;
      if (pred.pred_score_b > pred.pred_score_a) return match.team_b;
      if (pred.pred_advancing_team) return pred.pred_advancing_team;
      return null;
    }

    function generateMatchBoxHtml(m) {
      if (!m) return '<div class="match-box" style="opacity:0.3;"><div class="team-row"><span class="team-name">TBD</span><span class="team-score score-tbd">-</span></div><div class="team-row"><span class="team-name">TBD</span><span class="team-score score-tbd">-</span></div></div>';

      const pred = bracketPredMap[m.id] || null;
      const now = new Date();
      const kickoff = new Date(m.kickoff_time);
      const deadlinePassed = kickoff < now;
      const hasBothTeams = m.team_a && m.team_b && m.team_a !== 'TBD' && m.team_b !== 'TBD';
      const clickable = hasBothTeams;

      // A match is live if kickoff has passed, it's not finished, and we're within 115 minutes of kickoff
      const minutesSinceKickoff = (now - kickoff) / 60000;
      const isLive = !m.finished && deadlinePassed && minutesSinceKickoff < 115;

      // Winner highlighting
      const winnerTeam = m.advancing_team || null;
      const rowAWin = winnerTeam === m.team_a ? ' winner-row' : '';
      const rowBWin = winnerTeam === m.team_b ? ' winner-row' : '';

      // Determine score display + CSS class for each team's score block
      let scoreAText, scoreBText, scoreAClass, scoreBClass;

      if (m.finished) {
        // Official result
        scoreAText = m.score_a !== null ? m.score_a : '-';
        scoreBText = m.score_b !== null ? m.score_b : '-';
        scoreAClass = 'team-score score-final';
        scoreBClass = 'team-score score-final';
      } else if (!hasBothTeams) {
        // TBD teams
        scoreAText = '-';
        scoreBText = '-';
        scoreAClass = 'team-score score-tbd';
        scoreBClass = 'team-score score-tbd';
      } else if (isLive) {
        // Currently playing — show live scores if available, else dashes
        scoreAText = m.score_a !== null ? m.score_a : '-';
        scoreBText = m.score_b !== null ? m.score_b : '-';
        scoreAClass = 'team-score score-final';
        scoreBClass = 'team-score score-final';
      } else if (pred) {
        // User has predicted
        scoreAText = pred.pred_score_a;
        scoreBText = pred.pred_score_b;
        scoreAClass = 'team-score score-predicted';
        scoreBClass = 'team-score score-predicted';
      } else if (!deadlinePassed) {
        // Open for prediction
        scoreAText = '!';
        scoreBText = '!';
        scoreAClass = 'team-score score-unpredicted';
        scoreBClass = 'team-score score-unpredicted';
      } else {
        // Deadline passed, no prediction
        scoreAText = '\uD83D\uDD12';
        scoreBText = '\uD83D\uDD12';
        scoreAClass = 'team-score score-locked';
        scoreBClass = 'team-score score-locked';
      }

      // Team names (auto-advanced get italic styling)
      const teamAName = m.team_a ? getTeamHtml(m.team_a) : 'TBD';
      const teamBName = m.team_b ? getTeamHtml(m.team_b) : 'TBD';
      const teamAClass = 'team-name' + (m._auto_team_a ? ' tbd-predicted' : '');
      const teamBClass = 'team-name' + (m._auto_team_b ? ' tbd-predicted' : '');

      const liveBadge = isLive ? '<div class="live-badge"><span class="live-dot"></span>LIVE</div>' : '';
      const liveClass = isLive ? ' match-box-live' : '';

      return `
        ${liveBadge}
        <div class="match-box${clickable ? ' match-box-clickable' : ''}${liveClass}" data-match-id="${m.id || ''}" ${clickable ? `onclick="openBracketModal('${m.id}')"` : ''}>
          <div class="team-row${rowAWin}">
            <span class="${teamAClass}">${teamAName}</span>
            <span class="${scoreAClass}">${scoreAText}</span>
          </div>
          <div class="team-row${rowBWin}">
            <span class="${teamBClass}">${teamBName}</span>
            <span class="${scoreBClass}">${scoreBText}</span>
          </div>
        </div>
      `;
    }

    function buildRoundColumn(matches, label) {
      let html = `<div class="bracket-round-col"><div class="bracket-round-header">${label}</div>`;
      matches.forEach(m => { html += generateMatchBoxHtml(m); });
      html += '</div>';
      return html;
    }

    function drawBracketLines(container) {
      const wrap = container.querySelector('.bracket-canvas-wrap');
      const grid = container.querySelector('.bracket-grid');
      if (!wrap || !grid) return;

      // Remove old canvas
      const oldCanvas = wrap.querySelector('canvas');
      if (oldCanvas) oldCanvas.remove();

      const canvas = document.createElement('canvas');
      canvas.width = grid.scrollWidth;
      canvas.height = grid.scrollHeight;
      canvas.style.width = grid.scrollWidth + 'px';
      canvas.style.height = grid.scrollHeight + 'px';
      wrap.insertBefore(canvas, grid);

      const ctx = canvas.getContext('2d');
      const lineColor = getComputedStyle(document.body).getPropertyValue('--muted-text').trim() || 'rgba(128,128,128,0.5)';
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';

      // Helper: get element's bounding rect relative to the canvas-wrap (not viewport).
      // This is correct regardless of scroll position.
      function relRect(el) {
        let x = 0, y = 0;
        let node = el;
        while (node && node !== wrap) {
          x += node.offsetLeft;
          y += node.offsetTop;
          node = node.offsetParent;
        }
        return { left: x, top: y, right: x + el.offsetWidth, bottom: y + el.offsetHeight, width: el.offsetWidth, height: el.offsetHeight };
      }

      const cols = grid.querySelectorAll('.bracket-round-col, .bracket-final-col');
      const colArray = Array.from(cols);

      for (let c = 0; c < colArray.length - 1; c++) {
        const leftCol = colArray[c];
        const rightCol = colArray[c + 1];

        const leftBoxes = Array.from(leftCol.querySelectorAll('.match-box'));
        const rightBoxes = Array.from(rightCol.querySelectorAll('.match-box'));

        if (leftBoxes.length === 0 || rightBoxes.length === 0) continue;

        if (leftBoxes.length > rightBoxes.length) {
          // N:1 — pairs of left boxes feed into one right box
          for (let i = 0; i < rightBoxes.length; i++) {
            const topBox    = leftBoxes[i * 2];
            const bottomBox = leftBoxes[i * 2 + 1];
            const targetBox = rightBoxes[i];
            if (!topBox || !targetBox) continue;

            const tR = relRect(topBox);
            const bR = bottomBox ? relRect(bottomBox) : null;
            const xR = relRect(targetBox);

            const topMidY    = tR.top + tR.height / 2;
            const topRight   = tR.right;
            const targetMidY = xR.top + xR.height / 2;
            const targetLeft = xR.left;
            const midX       = (topRight + targetLeft) / 2;

            ctx.beginPath(); ctx.moveTo(topRight, topMidY); ctx.lineTo(midX, topMidY); ctx.stroke();

            if (bR) {
              const bottomMidY = bR.top + bR.height / 2;
              ctx.beginPath(); ctx.moveTo(tR.right, bottomMidY); ctx.lineTo(midX, bottomMidY); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(midX, topMidY);    ctx.lineTo(midX, bottomMidY); ctx.stroke();
            }

            ctx.beginPath(); ctx.moveTo(midX, targetMidY); ctx.lineTo(targetLeft, targetMidY); ctx.stroke();
          }
        } else if (leftBoxes.length === rightBoxes.length) {
          // 1:1 — each left box connects to corresponding right box (SF → Final / 3rd)
          for (let i = 0; i < leftBoxes.length; i++) {
            const sR = relRect(leftBoxes[i]);
            const tR = relRect(rightBoxes[i]);

            const sy   = sR.top + sR.height / 2;
            const sr   = sR.right;
            const ty   = tR.top + tR.height / 2;
            const tl   = tR.left;
            const midX = (sr + tl) / 2;

            ctx.beginPath(); ctx.moveTo(sr,   sy);   ctx.lineTo(midX, sy);   ctx.stroke();
            ctx.beginPath(); ctx.moveTo(midX, sy);   ctx.lineTo(midX, ty);   ctx.stroke();
            ctx.beginPath(); ctx.moveTo(midX, ty);   ctx.lineTo(tl,   ty);   ctx.stroke();
          }
        }
      }
    }

    window.autoAdvanceWinner = async function(matchId, winnerTeam) {
      const { data: koMatches } = await _supabase.from('matches').select('*').eq('is_knockout', true).order('kickoff_time', { ascending: true });
      if (!koMatches) return;
      
      const currentMatchIdx = koMatches.findIndex(m => m.id === matchId);
      if (currentMatchIdx === -1) return;
      const currentMatch = koMatches[currentMatchIdx];
      
      // Only auto-advance R32 matches for now (index 0-15)
      if (currentMatchIdx >= 16) return;
      if (!currentMatch.bracket_order) return;
      
      const targetOrder = Math.ceil(currentMatch.bracket_order / 2);
      const isTeamA = (currentMatch.bracket_order % 2 !== 0);
      
      const r16Matches = koMatches.slice(16, 24);
      let targetMatch = r16Matches.find(m => m.bracket_order === targetOrder);
      if (!targetMatch) {
         targetMatch = r16Matches[targetOrder - 1]; 
      }
      
      if (targetMatch) {
        const updateData = {};
        if (isTeamA) updateData.team_a = winnerTeam;
        else updateData.team_b = winnerTeam;
        await _supabase.from('matches').update(updateData).eq('id', targetMatch.id);
      }
    };

    async function loadKnockoutBracket() {
      const container = document.getElementById('knockoutPanel');
      container.innerHTML = '<div style="text-align:center; padding:50px; font-size:18px; color:var(--text-main);">Loading bracket...</div>';

      const { data: rawData, error } = await _supabase.from('matches')
        .select('*')
        .eq('is_knockout', true)
        .order('kickoff_time', { ascending: true });

      if (error || !rawData || rawData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--muted-text);">No knockout matches found.</div>';
        return;
      }

      bracketPredMap = {};
      bracketMatchesMap = {};
      if (user) {
        const matchIds = rawData.map(m => m.id);
        const { data: preds } = await _supabase.from('predictions')
          .select('*')
          .eq('user_id', user.id)
          .in('match_id', matchIds);
        if (preds) preds.forEach(p => { bracketPredMap[p.match_id] = p; });
      }

      const r32 = rawData.slice(0, 16);
      const r16 = rawData.slice(16, 24);
      const rest = rawData.slice(24);
      
      r32.sort((a, b) => (a.bracket_order || 0) - (b.bracket_order || 0));
      r16.sort((a, b) => (a.bracket_order || 0) - (b.bracket_order || 0));
      
      const sortedData = [...r32, ...r16, ...rest];

      const rounds = { R32: [], R16: [], QF: [], SF: [], '3rd': [], Final: [] };
      sortedData.forEach((m, idx) => {
        const copy = Object.assign({}, m);
        let stage = copy.stage;
        if (!stage) {
          if (idx < 16) stage = 'R32';
          else if (idx < 24) stage = 'R16';
          else if (idx < 28) stage = 'QF';
          else if (idx < 30) stage = 'SF';
          else if (idx === 30) stage = '3rd';
          else if (idx === 31) stage = 'Final';
        }
        copy.stage = stage;
        if (rounds[stage]) rounds[stage].push(copy);
        bracketMatchesMap[copy.id] = copy;
      });

      const feedOrder = ['R32', 'R16', 'QF', 'SF'];
      const nextRound = { 'R32': 'R16', 'R16': 'QF', 'QF': 'SF', 'SF': 'Final' };

      feedOrder.forEach(stage => {
        const matches = rounds[stage];
        const next = rounds[nextRound[stage]];
        if (!matches || !next) return;

        matches.forEach((match, i) => {
          let winner = match.advancing_team || null;
          if (!winner) {
            const pred = bracketPredMap[match.id];
            winner = getPredictedWinner(match, pred);
          }
          if (!winner) return;

          const nextIdx = Math.floor(i / 2);
          const isSlotA = (i % 2 === 0);
          if (!next[nextIdx]) return;

          const slot = isSlotA ? 'team_a' : 'team_b';
          if (!next[nextIdx][slot] || next[nextIdx][slot] === 'TBD') {
            next[nextIdx][slot] = winner;
            next[nextIdx]['_auto_' + slot] = !match.advancing_team;
          }
        });
      });

      if (rounds.SF && rounds.SF.length === 2 && rounds['3rd'] && rounds['3rd'].length > 0) {
        rounds.SF.forEach((match, i) => {
          let winner = match.advancing_team || null;
          let loser = null;
          if (!winner) {
            const pred = bracketPredMap[match.id];
            winner = getPredictedWinner(match, pred);
          }
          if (winner) {
            loser = (winner === match.team_a) ? match.team_b : match.team_a;
          }
          if (loser && loser !== 'TBD') {
            const slot = i === 0 ? 'team_a' : 'team_b';
            if (!rounds['3rd'][0][slot] || rounds['3rd'][0][slot] === 'TBD') {
              rounds['3rd'][0][slot] = loser;
              rounds['3rd'][0]['_auto_' + slot] = !match.advancing_team;
            }
          }
        });
      }

      // --- Strict Left-to-Right Layout ---
      const allR32 = rounds.R32; // all 16 matches
      const allR16 = rounds.R16; // all 8 matches
      const allQF = rounds.QF;   // all 4 matches
      const allSF = rounds.SF;   // both SF matches
      const final_match = rounds.Final[0] || null;
      const thirdPlace = rounds['3rd'][0] || null;

      let html = '<div class="bracket-scroll-container" id="bracketScroller">';
      html += '<div class="bracket-canvas-wrap">';
      html += '<div class="bracket-grid">';

      // Column 1: R32 (16 matches)
      html += buildRoundColumn(allR32, 'Round of 32');
      // Column 2: R16 (8 matches)
      html += buildRoundColumn(allR16, 'Round of 16');
      // Column 3: QF (4 matches)
      html += buildRoundColumn(allQF, 'Quarter-Finals');
      // Column 4: SF (2 matches)
      html += buildRoundColumn(allSF, 'Semi-Finals');
      // Column 5: Final + 3rd Place
      html += '<div class="bracket-final-col">';
      html += '<div>';
      html += '<div class="bracket-final-label final-gold">🏆 FINAL</div>';
      html += generateMatchBoxHtml(final_match);
      html += '</div>';
      html += '<div>';
      html += '<div class="bracket-final-label third-muted">3rd Place</div>';
      html += generateMatchBoxHtml(thirdPlace);
      html += '</div>';
      html += '</div>';

      html += '</div>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          drawBracketLines(container);
        });
      });

      const scroller = document.getElementById('bracketScroller');
      let isDragging = false, startX, startY, scrollLeft, scrollTop;
      scroller.addEventListener('mousedown', e => {
        if (e.target.closest('.match-box-clickable')) return;
        isDragging = true;
        startX = e.pageX - scroller.offsetLeft;
        startY = e.pageY - scroller.offsetTop;
        scrollLeft = scroller.scrollLeft;
        scrollTop = scroller.scrollTop;
      });
      scroller.addEventListener('mouseleave', () => { isDragging = false; });
      scroller.addEventListener('mouseup', () => { isDragging = false; });
      scroller.addEventListener('mousemove', e => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scroller.offsetLeft;
        const y = e.pageY - scroller.offsetTop;
        scroller.scrollLeft = scrollLeft - (x - startX);
        scroller.scrollTop = scrollTop - (y - startY);
      });

      let redrawTimeout;
      const redraw = () => {
        clearTimeout(redrawTimeout);
        redrawTimeout = setTimeout(() => drawBracketLines(container), 50);
      };
      window.addEventListener('resize', redraw);
    }

    // --- Bracket Modal Functions ---

    window.openBracketModal = function (matchId) {
      const match = bracketMatchesMap[matchId];
      if (!match) return;

      const modal = document.getElementById('bracketPredictionModal');
      const pred = bracketPredMap[matchId] || null;
      const deadlinePassed = new Date(match.kickoff_time) < new Date();
      const isAdmin = user && user.email === 'admin@worldcup.com';

      const stageLabels = { R32: 'Round of 32', R16: 'Round of 16', QF: 'Quarter-Final', SF: 'Semi-Final', Final: 'Final', '3rd': '3rd Place' };
      document.getElementById('bModalStage').textContent = stageLabels[match.stage] || match.stage;

      document.getElementById('bModalTeams').innerHTML = `${getTeamHtml(match.team_a)} <span class="vs">VS</span> ${getTeamHtml(match.team_b)}`;

      document.getElementById('bModalKickoff').textContent = 'Kickoff: ' + formatEgyptTime(match.kickoff_time);

      let bodyHtml = '';

      if (match.finished) {
        bodyHtml += `<div class="official-result">Final Score: ${match.score_a} - ${match.score_b}${match.advancing_team ? ' | Advanced: ' + match.advancing_team : ''}</div>`;
      }

      if (match.finished && pred) {
        bodyHtml += `<div class="your-prediction-display">Your prediction: ${pred.pred_score_a} - ${pred.pred_score_b}${pred.pred_advancing_team ? ' | Advancing: ' + pred.pred_advancing_team : ''} ${pred.points !== null ? '| Points: ' + pred.points : ''}</div>`;
      }

      if (!deadlinePassed && !match.finished) {
        bodyHtml += '<div class="section-label">Your Prediction</div>';
        bodyHtml += `
          <div class="prediction-inputs">
            <div class="score-stepper">
              <button onclick="document.getElementById('bScoreA').stepDown(); updateAdvanceVisibility();">-</button>
              <input type="number" id="bScoreA" min="0" max="10" value="${pred && pred.pred_score_a !== null ? pred.pred_score_a : 0}" oninput="this.value = validateGoal(this.value); updateAdvanceVisibility();" onchange="this.value = validateGoal(this.value); updateAdvanceVisibility();">
              <button onclick="document.getElementById('bScoreA').stepUp(); updateAdvanceVisibility();">+</button>
            </div>
            <span style="font-weight:bold; display:flex; align-items:center;">-</span>
            <div class="score-stepper">
              <button onclick="document.getElementById('bScoreB').stepDown(); updateAdvanceVisibility();">-</button>
              <input type="number" id="bScoreB" min="0" max="10" value="${pred && pred.pred_score_b !== null ? pred.pred_score_b : 0}" oninput="this.value = validateGoal(this.value); updateAdvanceVisibility();" onchange="this.value = validateGoal(this.value); updateAdvanceVisibility();">
              <button onclick="document.getElementById('bScoreB').stepUp(); updateAdvanceVisibility();">+</button>
            </div>
          </div>
          <select id="bAdvanceSelect" style="display: ${(!pred || pred.pred_score_a === pred.pred_score_b) ? 'block' : 'none'};">
            <option value="">Who advances? (if penalties)</option>
            <option value="${match.team_a}" ${pred && pred.pred_advancing_team === match.team_a ? 'selected' : ''}>${match.team_a}</option>
            <option value="${match.team_b}" ${pred && pred.pred_advancing_team === match.team_b ? 'selected' : ''}>${match.team_b}</option>
          </select>
          <button class="submit-btn ${pred ? 'update-mode' : ''}" id="bSubmitBtn" onclick="saveBracketPrediction('${matchId}')">
            ${pred ? 'UPDATE PREDICTION' : 'SUBMIT PREDICTION'}
          </button>
        `;
      } else if (deadlinePassed && !match.finished && pred) {
        bodyHtml += `<div class="your-prediction-display">Your prediction: ${pred.pred_score_a} - ${pred.pred_score_b}${pred.pred_advancing_team ? ' | Advancing: ' + pred.pred_advancing_team : ''}</div>`;
        bodyHtml += '<div style="text-align:center; color:var(--muted-text); font-size:13px;">Deadline has passed — predictions are locked.</div>';
      } else if (deadlinePassed && !match.finished && !pred) {
        bodyHtml += '<div style="text-align:center; color:var(--muted-text); font-size:13px; padding:15px 0;">You did not predict this match. Deadline has passed.</div>';
      }

      if (isAdmin) {
        bodyHtml += `
          <div class="admin-override-section">
            <div class="admin-section-title">🛠️ Admin Overrides</div>
            <div class="section-label">Set Official Final Score</div>
            <div class="admin-result-inputs">
              <input type="number" id="bAdminScoreA" min="0" max="10" placeholder="${match.team_a}" value="${match.score_a !== null ? match.score_a : ''}">
              <span style="display:flex;align-items:center;">-</span>
              <input type="number" id="bAdminScoreB" min="0" max="10" placeholder="${match.team_b}" value="${match.score_b !== null ? match.score_b : ''}">
            </div>
            <select id="bAdminAdvance">
              <option value="">Who advanced officially?</option>
              <option value="${match.team_a}" ${match.advancing_team === match.team_a ? 'selected' : ''}>${match.team_a}</option>
              <option value="${match.team_b}" ${match.advancing_team === match.team_b ? 'selected' : ''}>${match.team_b}</option>
            </select>
            <button class="submit-btn admin-btn" onclick="setBracketOfficialResult('${matchId}')" style="background:#FFD700; color:black;">
              SET OFFICIAL RESULT & ADVANCE
            </button>
            ${match.finished ? `<button class="submit-btn reset-btn" style="margin-top:8px;" onclick="resetBracketMatch('${matchId}')">RESET RESULT</button>` : ''}
          </div>
        `;
      }

      document.getElementById('bModalBody').innerHTML = bodyHtml;
      modal.classList.add('active');
    };

    window.updateAdvanceVisibility = function() {
      const a = parseInt(document.getElementById('bScoreA').value) || 0;
      const b = parseInt(document.getElementById('bScoreB').value) || 0;
      const select = document.getElementById('bAdvanceSelect');
      if (select) {
        select.style.display = (a === b) ? 'block' : 'none';
      }
    };

    window.closeBracketModal = function () {
      document.getElementById('bracketPredictionModal').classList.remove('active');
    };

    document.getElementById('bracketPredictionModal').addEventListener('click', function (e) {
      if (e.target === this) closeBracketModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeBracketModal();
    });

    window.saveBracketPrediction = async function (matchId) {
      const match = bracketMatchesMap[matchId];
      if (!match) return;

      const btn = document.getElementById('bSubmitBtn');
      const originalText = btn ? btn.innerText : 'SUBMIT PREDICTION';
      if (btn) { btn.innerText = 'SAVING...'; btn.style.pointerEvents = 'none'; }

      let scoreA = parseInt(document.getElementById('bScoreA').value);
      let scoreB = parseInt(document.getElementById('bScoreB').value);
      if (isNaN(scoreA)) scoreA = 0;
      if (isNaN(scoreB)) scoreB = 0;
      scoreA = Math.max(0, Math.min(10, scoreA));
      scoreB = Math.max(0, Math.min(10, scoreB));

      let advancingTeam = null;
      if (scoreA > scoreB) advancingTeam = match.team_a;
      else if (scoreB > scoreA) advancingTeam = match.team_b;
      else {
        const advSelect = document.getElementById('bAdvanceSelect');
        advancingTeam = advSelect ? advSelect.value : null;
        if (!advancingTeam) {
          if (btn) { btn.innerText = originalText; btn.style.pointerEvents = 'auto'; }
          return showToast('Please select who advances on penalties!');
        }
      }

      const predData = {
        user_id: user.id,
        match_id: matchId,
        pred_score_a: scoreA,
        pred_score_b: scoreB,
        pred_advancing_team: advancingTeam
      };

      const { data: existing } = await _supabase.from('predictions')
        .select('id').eq('user_id', user.id).eq('match_id', matchId).maybeSingle();

      let saveError = null;
      if (existing) {
        const { error } = await _supabase.from('predictions').update(predData).eq('id', existing.id);
        saveError = error;
      } else {
        const { error } = await _supabase.from('predictions').insert(predData);
        saveError = error;
      }

      if (saveError) {
        if (btn) { btn.innerText = originalText; btn.style.pointerEvents = 'auto'; }
        return showToast('Error: ' + saveError.message);
      }

      if (btn) {
        btn.innerText = 'SAVED! 🎉';
        btn.style.background = '#4CAF50';
        btn.style.color = 'white';
        btn.style.borderColor = '#4CAF50';
      }

      showToast('Prediction saved!');
      try { if (typeof window.confetti === 'function') window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, zIndex: 99999 }); } catch (e) { }

      setTimeout(async () => {
        closeBracketModal();
        await loadKnockoutBracket();
      }, 800);
    };

    window.setBracketOfficialResult = async function (matchId) {
      let a = parseInt(document.getElementById('bAdminScoreA').value);
      let b = parseInt(document.getElementById('bAdminScoreB').value);
      if (isNaN(a)) a = 0;
      if (isNaN(b)) b = 0;
      a = Math.max(0, Math.min(10, a));
      b = Math.max(0, Math.min(10, b));

      const advSelect = document.getElementById('bAdminAdvance');
      const advance = advSelect ? advSelect.value : null;
      if (!advance) return alert('Please select which team advanced');

      const updateData = { score_a: a, score_b: b, finished: true, advancing_team: advance };

      const { error } = await _supabase.from('matches').update(updateData).eq('id', matchId);
      if (error) return alert('Error: ' + error.message);

      if (advance) {
        await autoAdvanceWinner(matchId, advance);
      }

      showToast('Official result set!');
      closeBracketModal();
      await loadKnockoutBracket();
      if (typeof loadAdminMatches === 'function') await loadAdminMatches();
      if (typeof loadLeaderboard === 'function') await loadLeaderboard();
    };

    window.resetBracketMatch = async function (matchId) {
      await rollbackMatchPoints(matchId);
      const { error } = await _supabase.from('matches')
        .update({ score_a: null, score_b: null, finished: false, advancing_team: null })
        .eq('id', matchId);
      if (error) return alert('Error: ' + error.message);

      showToast('Match result reset!');
      closeBracketModal();
      await loadKnockoutBracket();
      if (typeof loadAdminMatches === 'function') await loadAdminMatches();
      if (typeof loadLeaderboard === 'function') await loadLeaderboard();
    };

    function scrollToNextMatch() {
      const cards = document.querySelectorAll('.match-card');
      for (let card of cards) {
        if (!card.innerHTML.includes('FINISHED') && !card.innerHTML.includes('DEADLINE PASSED')) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          break;
        }
      }
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollToLiveBtn');
      if (btn && document.getElementById('predictionsPanel').style.display !== 'none') {
        if (window.scrollY > 300) btn.style.display = 'flex';
        else btn.style.display = 'none';
      } else if (btn) {
        btn.style.display = 'none';
      }
    });

    // --- Keepy-Uppy Game Logic ---
    let kuCanvas, kuCtx;
    let kuAnimId;
    let kuBall = { x: 150, y: 50, radius: 25, velocity: 0, gravity: 0.5 };
    let kuScore = 0;
    let kuSpeedMultiplier = 1;
    let kuGameState = 'ready'; // ready, playing, gameover
    let kuLastTime = 0;
    let kuShowAllLB = false;
    let ballImg = new Image();
    ballImg.src = 'ball2026.png';

    function openKeepyUppy() {
      if (!user) return showToast('Please login to play Keepy-Uppy!');
      document.getElementById('keepyUppyModal').style.display = 'flex';
      kuCanvas = document.getElementById('keepyUppyCanvas');
      kuCtx = kuCanvas.getContext('2d');
      resetKuGame();
      drawKuGame();
      loadJugglingLeaderboard();

      kuCanvas.addEventListener('mousedown', kuInteract);
      kuCanvas.addEventListener('touchstart', kuInteract, { passive: false });
    }

    function closeKeepyUppy() {
      document.getElementById('keepyUppyModal').style.display = 'none';
      cancelAnimationFrame(kuAnimId);
      kuCanvas.removeEventListener('mousedown', kuInteract);
      kuCanvas.removeEventListener('touchstart', kuInteract);
    }

    function toggleKuLeaderboard() {
      const lb = document.getElementById('kuLeaderboard');
      lb.style.display = lb.style.display === 'block' ? 'none' : 'block';
      if (lb.style.display === 'block') {
        loadJugglingLeaderboard();
      }
    }

    function resetKuGame() {
      kuBall.x = kuCanvas.width / 2;
      kuBall.y = kuBall.radius * 2;
      kuBall.velocity = 0;
      kuBall.vx = 0;
      kuBall.gravity = 0.08;
      kuBall.rotation = 0;
      kuScore = 0;
      kuSpeedMultiplier = 1;
      kuGameState = 'ready';
      kuLastTime = 0;
      document.getElementById('kuScoreDisplay').innerText = kuScore;
    }

    function kuInteract(e) {
      e.preventDefault();
      if (kuGameState === 'gameover') {
        resetKuGame();
        kuGameState = 'playing';
        kuLastTime = performance.now();
        kuGameLoop(performance.now());
        return;
      }
      if (kuGameState === 'ready') {
        kuGameState = 'playing';
        kuLastTime = performance.now();
        kuGameLoop(performance.now());
      }

      const rect = kuCanvas.getBoundingClientRect();
      const scaleX = kuCanvas.width / rect.width;
      const scaleY = kuCanvas.height / rect.height;
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      const dist = Math.hypot(kuBall.x - x, kuBall.y - y);
      if (dist < kuBall.radius + 15) {
        kuBall.velocity = -5.5 * kuSpeedMultiplier;
        kuScore++;
        document.getElementById('kuScoreDisplay').innerText = kuScore;
        kuSpeedMultiplier += 0.01;
        kuBall.gravity = 0.08 * kuSpeedMultiplier;
        kuBall.vx = (Math.random() - 0.5) * 6;
      }
    }

    function kuGameLoop(timestamp) {
      if (kuGameState !== 'playing') return;
      kuAnimId = requestAnimationFrame(kuGameLoop);

      if (!kuLastTime) kuLastTime = timestamp;
      let dt = timestamp - kuLastTime;
      kuLastTime = timestamp;

      // Cap delta time to 50ms so switching tabs doesn't glitch the ball
      if (dt > 50) dt = 16.6;

      // Normalize speed based on a high refresh rate (e.g. 144Hz = ~7ms per frame)
      // This ensures 60Hz mobile screens don't run in slow motion!
      let timeScale = dt / 7.0;

      kuBall.velocity += kuBall.gravity * timeScale;
      kuBall.y += kuBall.velocity * timeScale;
      if (kuBall.vx) {
        kuBall.x += kuBall.vx * timeScale;
        if (kuBall.x < kuBall.radius || kuBall.x > kuCanvas.width - kuBall.radius) {
          kuBall.vx *= -1;
          kuBall.x = Math.max(kuBall.radius, Math.min(kuCanvas.width - kuBall.radius, kuBall.x));
        }
      }

      if (kuBall.y > kuCanvas.height + kuBall.radius) {
        kuGameState = 'gameover';
        saveJugglingScore(kuScore);
      }

      // Update rotation
      kuBall.rotation = (kuBall.rotation || 0) + (kuBall.vx * 0.05 * timeScale) + (0.05 * timeScale);

      drawKuGame();
    }

    function drawKuGame() {
      kuCtx.clearRect(0, 0, kuCanvas.width, kuCanvas.height);

      // Draw Ball
      if (ballImg.complete && ballImg.naturalWidth > 0) {
        kuCtx.save();
        kuCtx.translate(kuBall.x, kuBall.y);
        kuCtx.rotate(kuBall.rotation || 0);

        let minSide = Math.min(ballImg.naturalWidth, ballImg.naturalHeight);
        let sx = (ballImg.naturalWidth - minSide) / 2;
        let sy = (ballImg.naturalHeight - minSide) / 2;

        kuCtx.drawImage(
          ballImg,
          sx, sy, minSide, minSide,
          -kuBall.radius, -kuBall.radius, kuBall.radius * 2, kuBall.radius * 2
        );
        kuCtx.restore();
      } else {
        kuCtx.beginPath();
        kuCtx.arc(kuBall.x, kuBall.y, kuBall.radius, 0, Math.PI * 2);
        kuCtx.fillStyle = '#ffffff';
        kuCtx.fill();
        kuCtx.lineWidth = 2;
        kuCtx.strokeStyle = '#000000';
        kuCtx.stroke();

        kuCtx.beginPath();
        kuCtx.arc(kuBall.x, kuBall.y, kuBall.radius * 0.4, 0, Math.PI * 2);
        kuCtx.fillStyle = '#000000';
        kuCtx.fill();
      }

      if (kuGameState === 'ready') {
        kuCtx.fillStyle = 'rgba(0,0,0,0.5)';
        kuCtx.fillRect(0, 0, kuCanvas.width, kuCanvas.height);
        kuCtx.fillStyle = 'white';
        kuCtx.font = '20px sans-serif';
        kuCtx.textAlign = 'center';
        kuCtx.fillText('Tap ball to start!', kuCanvas.width / 2, kuCanvas.height / 2);
      } else if (kuGameState === 'gameover') {
        kuCtx.fillStyle = 'rgba(0,0,0,0.7)';
        kuCtx.fillRect(0, 0, kuCanvas.width, kuCanvas.height);
        kuCtx.fillStyle = 'white';
        kuCtx.font = '30px sans-serif';
        kuCtx.textAlign = 'center';
        kuCtx.fillText('GAME OVER', kuCanvas.width / 2, kuCanvas.height / 2 - 20);
        kuCtx.font = '20px sans-serif';
        kuCtx.fillText('Score: ' + kuScore, kuCanvas.width / 2, kuCanvas.height / 2 + 20);
        kuCtx.fillText('Tap to restart', kuCanvas.width / 2, kuCanvas.height / 2 + 60);
      }
    }

    async function saveJugglingScore(score) {
      if (score <= 0) return;

      try {
        const { data: existing, error: fetchErr } = await _supabase
          .from('juggling_scores')
          .select('id, score')
          .eq('user_id', user.id)
          .order('score', { ascending: false })
          .limit(1);

        if (fetchErr) {
          console.error("Fetch error:", fetchErr);
          return;
        }

        if (existing && existing.length > 0) {
          const topScore = existing[0];
          if (score > topScore.score) {
            const { data: updated, error: updateErr } = await _supabase
              .from('juggling_scores')
              .update({ score: score })
              .eq('id', topScore.id)
              .select();

            if (updateErr || !updated || updated.length === 0) {
              console.error("Update blocked or failed:", updateErr);
              alert("Error: Supabase blocked the score update! Please make sure you have an UPDATE policy on the juggling_scores table.");
            } else {
              showToast(`New High Score: ${score}!`);
              if (typeof window.confetti === 'function') {
                window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 999999 });
              }
            }
          }
        } else {
          const { error: insertErr } = await _supabase
            .from('juggling_scores')
            .insert({ user_id: user.id, score: score });

          if (insertErr) {
            console.error("Insert error:", insertErr);
          } else {
            showToast(`Score saved: ${score}!`);
            if (typeof window.confetti === 'function') {
              window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 999999 });
            }
          }
        }
      } catch (err) {
        console.error("Critical save error:", err);
      }
      loadJugglingLeaderboard();
    }

    async function loadJugglingLeaderboard() {
      const container = document.getElementById('kuLeaderboardList');
      container.innerHTML = 'Loading...';
      const { data: scores, error } = await _supabase
        .from('juggling_scores')
        .select('score, profiles!inner(username)')
        .order('score', { ascending: false })
        .limit(100);

      if (error || !scores || scores.length === 0) {
        container.innerHTML = '<div style="text-align:center; opacity:0.7;">No scores yet. Be the first!</div>';
        return;
      }

      let html = '';
      const medals = ['🥇', '🥈', '🥉'];

      const displayCount = kuShowAllLB ? scores.length : Math.min(3, scores.length);

      for (let idx = 0; idx < displayCount; idx++) {
        const s = scores[idx];
        const rankDisplay = idx < 3 ? (medals[idx] || '') : `<span style="font-size:12px;opacity:0.7;display:inline-block;width:20px;text-align:center;">${idx + 1}.</span>`;
        html += `
          <div class="ku-lb-item">
            <span>${rankDisplay} ${s.profiles.username}</span>
            <span style="font-weight:bold; color:#FFD700;">${s.score}</span>
          </div>
        `;
      }

      if (scores.length > 3) {
        if (!kuShowAllLB) {
          html += `<button onclick="kuShowAllLB=true; loadJugglingLeaderboard()" style="width:100%; padding:8px; margin-top:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.2); color:white; cursor:pointer; font-weight:bold; transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">Show All ⬇️</button>`;
        } else {
          html += `<button onclick="kuShowAllLB=false; loadJugglingLeaderboard()" style="width:100%; padding:8px; margin-top:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.2); color:white; cursor:pointer; font-weight:bold; transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">Show Less ⬆️</button>`;
        }
      }
      container.innerHTML = html;
    }
  </script>
