<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
      min-height: 100vh;
      padding: 20px;
    }

    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    #loginBox h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
      color: #FF6B35;
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }

    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .admin-badge {
      background: #FF6B35;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 10px;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 30px;
      background: white;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
    }

    .tab.active {
      background: #FF6B35;
      color: white;
    }

    .filter-group {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      align-items: center;
    }

    .filter-group select, .filter-group input {
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }

    .sort-btn {
      padding: 8px 18px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
    }

    .sort-btn.active {
      background: #FF6B35;
      color: white;
    }

    .stats {
      color: #FF6B35;
      font-weight: bold;
      margin-left: auto;
    }

    .match-day-group {
      margin-bottom: 30px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .match-day-header {
      background: #FF6B35;
      padding: 15px 25px;
      color: white;
    }

    .match-day-date {
      font-size: 22px;
      font-weight: bold;
    }

    .match-day-count {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1px;
      background: #f0f0f0;
    }

    .match-card {
      background: white;
      padding: 20px;
      transition: all 0.3s;
    }

    .match-card:hover {
      background: #fff9f5;
    }

    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 2px solid #FF6B35;
    }

    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      background: #FFF3E0;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
      color: #FF6B35;
    }

    .finished-badge {
      background: #4CAF50;
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
    }

    .result-display {
      text-align: center;
      background: #FFF3E0;
      color: #FF6B35;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }

    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      color: #999;
    }

    .leaderboard-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      background: #FF6B35;
      padding: 15px 25px;
      font-weight: bold;
      color: white;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 14px 25px;
      border-bottom: 1px solid #f0f0f0;
    }

    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    .admin-result-inputs input, .admin-result-inputs select {
      padding: 8px;
      border-radius: 6px;
      border: 2px solid #e0e0e0;
    }

    .reset-btn {
      background: #dc3545;
      color: white;
    }

    .msg {
      margin-top: 20px;
      text-align: center;
      color: #FF6B35;
    }
  </style>
</head>
<body>

<div id="loginBox">
  <h2>WORLD CUP 2026</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<div id="mainPage">
  <div class="header">
    <h2>WORLD CUP 2026 PREDICTOR</h2>
    <div>
      <span id="userEmail"></span>
      <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="showPredictions">MATCH PREDICTIONS</button>
    <button class="tab" id="showLeaderboard">LEADERBOARD</button>
    <button class="tab" id="showAdmin" style="display:none;">ADMIN CONTROL</button>
  </div>

  <div id="predictionsPanel">
    <div class="filter-group">
      <select id="matchFilter">
        <option value="all">All Matches</option>
        <option value="group">Group Stage</option>
        <option value="knockout">Knockout Stage</option>
      </select>
      <input type="text" id="teamSearch" placeholder="Search teams...">
      <div>
        <button class="sort-btn active" data-sort="date">Sort by Date</button>
        <button class="sort-btn" data-sort="team">Sort by Team</button>
      </div>
      <span class="stats" id="matchCount"></span>
    </div>
    <div id="matchesList"></div>
  </div>

  <div id="leaderboardPanel" style="display:none;">
    <div id="leaderboardList"></div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="filter-group">
      <select id="adminFilter">
        <option value="all">All Matches</option>
        <option value="pending">Pending Results</option>
        <option value="finished">Finished</option>
      </select>
      <input type="text" id="adminSearch" placeholder="Search teams...">
    </div>
    <div id="adminMatchesList"></div>
  </div>
</div>

<script>
const SUPABASE = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let currentUser = null;
let allMatches = [];
let currentSort = 'date';

function showMsg(text, isError) {
  var msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#dc3545' : '#FF6B35';
  setTimeout(function() { msgDiv.innerHTML = ''; }, 3000);
}

async function login() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  if (!email || !password) {
    showMsg('Enter email and password', true);
    return;
  }
  
  var result = await SUPABASE.auth.signInWithPassword({ email: email, password: password });
  
  if (result.error) {
    showMsg(result.error.message, true);
    return;
  }
  
  currentUser = result.data.user;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmail').innerHTML = currentUser.email;
  
  if (currentUser.email === 'admin@worldcup.com') {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('showAdmin').style.display = 'inline-block';
  }
  
  loadMatches();
  loadLeaderboard();
}

async function signup() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  if (!email || !password) {
    showMsg('Enter email and password', true);
    return;
  }
  if (password.length < 6) {
    showMsg('Password min 6 characters', true);
    return;
  }
  
  var result = await SUPABASE.auth.signUp({ email: email, password: password });
  if (result.error) {
    showMsg(result.error.message, true);
  } else {
    showMsg('Account created! You can now login.', false);
  }
}

async function logout() {
  await SUPABASE.auth.signOut();
  currentUser = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
}

async function loadMatches() {
  var result = await SUPABASE.from('matches').select('*').order('kickoff_time', { ascending: true });
  
  if (result.error) {
    showMsg('Error loading matches', true);
    return;
  }
  
  if (!result.data || result.data.length === 0) {
    document.getElementById('matchesList').innerHTML = '<div style="text-align:center; padding:40px;">No matches found</div>';
    return;
  }
  
  allMatches = result.data;
  document.getElementById('matchCount').textContent = result.data.length + ' matches';
  filterAndShowMatches();
}

function filterAndShowMatches() {
  var filtered = allMatches.slice();
  var stage = document.getElementById('matchFilter').value;
  var search = document.getElementById('teamSearch').value.toLowerCase();
  
  if (stage === 'group') {
    filtered = filtered.filter(function(m) { return !m.is_knockout; });
  }
  if (stage === 'knockout') {
    filtered = filtered.filter(function(m) { return m.is_knockout; });
  }
  if (search) {
    filtered = filtered.filter(function(m) { 
      return m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search);
    });
  }
  
  if (currentSort === 'date') {
    filtered.sort(function(a,b) { return new Date(a.kickoff_time) - new Date(b.kickoff_time); });
  } else {
    filtered.sort(function(a,b) { return a.team_a.localeCompare(b.team_a); });
  }
  
  renderMatchesGroupedByDay(filtered);
}

async function renderMatchesGroupedByDay(matches) {
  var container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  var predResult = await SUPABASE.from('predictions').select('*').eq('user_id', currentUser.id);
  var predMap = {};
  if (predResult.data) {
    predResult.data.forEach(function(p) { predMap[p.match_id] = p; });
  }
  
  var grouped = {};
  matches.forEach(function(m) {
    var date = new Date(m.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });
  
  for (var date in grouped) {
    var dayMatches = grouped[date];
    var dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = '<div class="match-day-header"><div class="match-day-date">' + date + '</div><div class="match-day-count">' + dayMatches.length + ' matches</div></div><div class="matches-grid"></div>';
    container.appendChild(dayGroup);
    
    var grid = dayGroup.querySelector('.matches-grid');
    
    for (var i = 0; i < dayMatches.length; i++) {
      var match = dayMatches[i];
      var deadlinePassed = new Date(match.kickoff_time) < new Date();
      var userPred = predMap[match.id];
      
      var card = document.createElement('div');
      card.className = 'match-card';
      
      var predictionHtml = '';
      if (!deadlinePassed && !match.finished) {
        predictionHtml = '<div class="prediction-inputs">' +
          '<input type="number" id="scoreA_' + match.id + '" min="0" max="10" placeholder="' + match.team_a + '" value="' + (userPred ? userPred.pred_score_a : '') + '">' +
          '<span>-</span>' +
          '<input type="number" id="scoreB_' + match.id + '" min="0" max="10" placeholder="' + match.team_b + '" value="' + (userPred ? userPred.pred_score_b : '') + '">' +
          '</div>' +
          '<button class="submit-btn" onclick="savePrediction(\'' + match.id + '\')">' + (userPred ? 'UPDATE PREDICTION' : 'SUBMIT PREDICTION') + '</button>';
      } else if (match.finished && userPred) {
        predictionHtml = '<div style="text-align:center; margin-top:10px; padding:10px; background:#f5f5f5; border-radius:10px;">' +
          'Your prediction: ' + userPred.pred_score_a + ' - ' + userPred.pred_score_b + (userPred.points ? ' | POINTS: ' + userPred.points : '') +
          '</div>';
      } else if (deadlinePassed && !match.finished) {
        predictionHtml = '<div style="text-align:center;">DEADLINE PASSED</div>';
      }
      
      card.innerHTML = '<div class="match-title">' +
        match.team_a + ' vs ' + match.team_b +
        '<span class="match-stage">' + (match.is_knockout ? 'KNOCKOUT' : 'GROUP') + '</span>' +
        (match.finished ? '<span class="finished-badge">FINISHED</span>' : '') +
        '</div>' +
        (match.finished ? '<div class="result-display">FINAL: ' + match.score_a + ' - ' + match.score_b + '</div>' : '') +
        predictionHtml +
        '<div class="deadline">Kickoff: ' + new Date(match.kickoff_time).toLocaleString() + '</div>';
      
      grid.appendChild(card);
    }
  }
}

window.savePrediction = async function(matchId) {
  var scoreA = parseInt(document.getElementById('scoreA_' + matchId).value);
  var scoreB = parseInt(document.getElementById('scoreB_' + matchId).value);
  if (isNaN(scoreA)) scoreA = 0;
  if (isNaN(scoreB)) scoreB = 0;
  scoreA = Math.max(0, Math.min(10, scoreA));
  scoreB = Math.max(0, Math.min(10, scoreB));
  
  var existingResult = await SUPABASE.from('predictions').select('id').eq('user_id', currentUser.id).eq('match_id', matchId).maybeSingle();
  
  if (existingResult.data) {
    await SUPABASE.from('predictions').update({ pred_score_a: scoreA, pred_score_b: scoreB }).eq('id', existingResult.data.id);
  } else {
    await SUPABASE.from('predictions').insert({ user_id: currentUser.id, match_id: matchId, pred_score_a: scoreA, pred_score_b: scoreB });
  }
  
  showMsg('Prediction saved!', false);
  loadMatches();
  loadLeaderboard();
};

async function loadLeaderboard() {
  var result = await SUPABASE.from('leaderboard').select('*').limit(50);
  if (result.error) return;
  
  var container = document.getElementById('leaderboardList');
  if (!result.data || result.data.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">No users yet</div>';
    return;
  }
  
  container.innerHTML = '<div class="leaderboard-container"><div class="leaderboard-header"><div>RANK</div><div>PLAYER</div><div>POINTS</div></div><div id="leaderboardItems"></div></div>';
  
  var itemsDiv = container.querySelector('#leaderboardItems');
  for (var i = 0; i < result.data.length; i++) {
    var u = result.data[i];
    var item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = '<div>' + (i+1) + '</div><div>' + (u.username || 'User') + '</div><div style="font-weight:bold;">' + (u.total_points || 0) + '</div>';
    itemsDiv.appendChild(item);
  }
}

async function loadAdminMatches() {
  var result = await SUPABASE.from('matches').select('*').order('kickoff_time');
  if (result.error) return;
  renderAdminMatches(result.data);
}

function renderAdminMatches(matches) {
  var container = document.getElementById('adminMatchesList');
  var filter = document.getElementById('adminFilter').value;
  var search = document.getElementById('adminSearch').value.toLowerCase();
  
  var filtered = matches.slice();
  if (filter === 'pending') filtered = filtered.filter(function(m) { return !m.finished; });
  if (filter === 'finished') filtered = filtered.filter(function(m) { return m.finished; });
  if (search) filtered = filtered.filter(function(m) { return m.team_a.toLowerCase().includes(search) || m.team_b.toLowerCase().includes(search); });
  
  container.innerHTML = '';
  
  for (var i = 0; i < filtered.length; i++) {
    var match = filtered[i];
    var card = document.createElement('div');
    card.className = 'match-card';
    card.style.marginBottom = '20px';
    
    if (match.finished) {
      card.innerHTML = '<div class="match-title">' + match.team_a + ' vs ' + match.team_b + '</div>' +
        '<div class="result-display">RESULT: ' + match.score_a + ' - ' + match.score_b + '</div>' +
        '<button class="submit-btn reset-btn" onclick="resetMatch(\'' + match.id + '\')">RESET RESULT</button>';
    } else {
      card.innerHTML = '<div class="match-title">' + match.team_a + ' vs ' + match.team_b + '</div>' +
        '<div class="admin-result-inputs">' +
        '<input type="number" id="adminA_' + match.id + '" min="0" max="10" placeholder="' + match.team_a + ' score">' +
        '<span>-</span>' +
        '<input type="number" id="adminB_' + match.id + '" min="0" max="10" placeholder="' + match.team_b + ' score">' +
        '</div>' +
        (match.is_knockout ? '<select id="advance_' + match.id + '" style="width:100%; margin:10px 0; padding:10px;"><option value="">Who advanced?</option><option value="' + match.team_a + '">' + match.team_a + '</option><option value="' + match.team_b + '">' + match.team_b + '</option></select>' : '') +
        '<button class="submit-btn admin-btn" onclick="setResult(\'' + match.id + '\', ' + match.is_knockout + ')">SET RESULT AND CALCULATE</button>';
    }
    container.appendChild(card);
  }
}

window.setResult = async function(matchId, isKnockout) {
  var a = parseInt(document.getElementById('adminA_' + matchId).value);
  var b = parseInt(document.getElementById('adminB_' + matchId).value);
  if (isNaN(a)) a = 0;
  if (isNaN(b)) b = 0;
  a = Math.max(0, Math.min(10, a));
  b = Math.max(0, Math.min(10, b));
  
  var advance = null;
  if (isKnockout) {
    advance = document.getElementById('advance_' + matchId).value;
    if (!advance) {
      showMsg('Select advancing team', true);
      return;
    }
  }
  
  var update = { score_a: a, score_b: b, finished: true };
  if (advance) update.advancing_team = advance;
  
  await SUPABASE.from('matches').update(update).eq('id', matchId);
  showMsg('Result set! Points calculated!', false);
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};

window.resetMatch = async function(matchId) {
  await SUPABASE.from('matches').update({ score_a: null, score_b: null, finished: false, advancing_team: null }).eq('id', matchId);
  showMsg('Result reset!', false);
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};

document.getElementById('loginBtn').onclick = login;
document.getElementById('signupBtn').onclick = signup;
document.getElementById('logoutBtn').onclick = logout;

document.getElementById('showPredictions').onclick = function() {
  document.getElementById('predictionsPanel').style.display = 'block';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'none';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById('showPredictions').classList.add('active');
  loadMatches();
};

document.getElementById('showLeaderboard').onclick = function() {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'block';
  document.getElementById('adminPanel').style.display = 'none';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById('showLeaderboard').classList.add('active');
  loadLeaderboard();
};

document.getElementById('showAdmin').onclick = function() {
  document.getElementById('predictionsPanel').style.display = 'none';
  document.getElementById('leaderboardPanel').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById('showAdmin').classList.add('active');
  loadAdminMatches();
};

document.getElementById('matchFilter').onchange = filterAndShowMatches;
document.getElementById('teamSearch').onkeyup = filterAndShowMatches;

var sortBtns = document.querySelectorAll('.sort-btn');
for (var i = 0; i < sortBtns.length; i++) {
  sortBtns[i].onclick = function() {
    currentSort = this.getAttribute('data-sort');
    var btns = document.querySelectorAll('.sort-btn');
    for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
    this.classList.add('active');
    filterAndShowMatches();
  };
}

document.getElementById('adminFilter').onchange = loadAdminMatches;
document.getElementById('adminSearch').onkeyup = loadAdminMatches;

(async function() {
  var sessionResult = await SUPABASE.auth.getSession();
  if (sessionResult.data.session) {
    currentUser = sessionResult.data.session.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    if (currentUser.email === 'admin@worldcup.com') {
      document.getElementById('adminBadge').style.display = 'inline-block';
      document.getElementById('showAdmin').style.display = 'inline-block';
    }
    loadMatches();
    loadLeaderboard();
  }
})();
</script>
</body>
</html>
