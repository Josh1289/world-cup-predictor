<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
      min-height: 100vh;
      padding: 20px;
    }

    /* Login Box */
    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    #loginBox h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
      color: #FF6B35;
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }

    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
    }

    #loginBox button:hover {
      transform: translateY(-2px);
    }

    /* Main Page */
    #mainPage {
      max-width: 1200px;
      margin: 0 auto;
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .admin-badge {
      background: #FF6B35;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 10px;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 30px;
      background: white;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .tab.active {
      background: #FF6B35;
      color: white;
    }

    /* Match Card */
    .match-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .match-title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 15px;
      margin-bottom: 15px;
      border-bottom: 2px solid #FF6B35;
    }

    .match-stage {
      display: inline-block;
      padding: 5px 15px;
      background: #FFF3E0;
      border-radius: 20px;
      font-size: 12px;
      margin-left: 10px;
      color: #FF6B35;
    }

    .result-display {
      text-align: center;
      background: #4CAF50;
      color: white;
      margin-bottom: 20px;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 10px;
    }

    .prediction-inputs {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 20px 0;
    }

    .prediction-inputs input {
      width: 100px;
      padding: 12px;
      text-align: center;
      font-size: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .deadline {
      text-align: center;
      margin-top: 15px;
      color: #999;
      font-size: 14px;
    }

    /* Leaderboard Styles */
    .leaderboard-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 1fr auto auto;
      background: #FF6B35;
      padding: 15px 25px;
      font-weight: bold;
      color: white;
    }

    .leaderboard-rankings {
      padding: 0;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 12px 25px;
      border-bottom: 1px solid #f0f0f0;
    }

    .join-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .leave-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .joined-badge {
      background: #4CAF50;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .code-input {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .code-input input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }

    .code-input button {
      padding: 12px 24px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Admin Styles */
    .admin-result-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }

    .admin-result-inputs input {
      width: 100px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
    }

    .admin-result-inputs select {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
    }

    .admin-btn {
      background: #FF6B35;
    }

    .reset-btn {
      background: #dc3545;
    }

    .create-form {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .create-form h3 {
      margin-bottom: 15px;
      color: #FF6B35;
    }

    .create-form input {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }

    .msg {
      margin-top: 20px;
      text-align: center;
      color: #FF6B35;
    }
  </style>
</head>
<body>

<!-- LOGIN BOX -->
<div id="loginBox">
  <h2>WORLD CUP 2026</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<!-- MAIN PAGE -->
<div id="mainPage">
  <div class="header">
    <h2>WORLD CUP 2026 PREDICTOR</h2>
    <div>
      <span id="userEmail"></span>
      <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="showPredictions">MATCH PREDICTIONS</button>
    <button class="tab" id="showLeaderboards">LEADERBOARDS</button>
    <button class="tab" id="showMyLeaderboards">MY LEADERBOARDS</button>
    <button class="tab" id="showAdmin" style="display:none;">ADMIN CONTROL</button>
  </div>

  <!-- PREDICTIONS PANEL -->
  <div id="predictionsPanel">
    <div id="matchesList"></div>
  </div>

  <!-- LEADERBOARDS PANEL -->
  <div id="leaderboardsPanel" style="display:none;">
    <div class="code-input">
      <input type="text" id="joinCode" placeholder="Enter leaderboard code (L1, L2, or L3)">
      <button id="joinLeaderboardBtn">JOIN LEADERBOARD</button>
    </div>
    <div id="availableLeaderboards"></div>
  </div>

  <!-- MY LEADERBOARDS PANEL -->
  <div id="myLeaderboardsPanel" style="display:none;">
    <div id="myLeaderboardsList"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;">
    <div class="create-form">
      <h3>CREATE NEW LEADERBOARD</h3>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="newLeaderboardName" placeholder="Leaderboard Name" style="flex:2;">
        <input type="text" id="newLeaderboardCode" placeholder="Code (e.g., L4)" style="flex:1;">
        <input type="text" id="newLeaderboardDesc" placeholder="Description" style="flex:2;">
        <button id="createLeaderboardBtn" style="background:#FF6B35; color:white; border:none; padding:12px 24px; border-radius:8px; cursor:pointer;">CREATE</button>
      </div>
    </div>
    
    <h3 style="margin-bottom: 15px;">SET MATCH RESULT</h3>
    <div id="adminMatchesList"></div>
  </div>
</div>

<script>
// Supabase
const _supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

let user = null;
let currentMatch = null;

function showMsg(text, isError = false) {
  const msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#dc3545' : '#FF6B35';
  setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
}

// AUTH FUNCTIONS
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  
  const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
  if (error) return showMsg(error.message, true);
  
  user = data.user;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmail').innerHTML = user.email;
  
  if (user.email === 'admin@worldcup.com') {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('showAdmin').style.display = 'inline-block';
  }
  
  loadMatch();
  loadAvailableLeaderboards();
  loadMyLeaderboards();
}

async function signup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  if (password.length < 6) return showMsg('Password min 6 characters', true);
  
  const { error } = await _supabase.auth.signUp({ email, password });
  if (error) return showMsg(error.message, true);
  showMsg('Account created! You can now login.');
}

async function logout() {
  await _supabase.auth.signOut();
  user = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
}

// MATCH FUNCTIONS
async function loadMatch() {
  const { data, error } = await _supabase.from('matches').select('*').single();
  if (error) return;
  currentMatch = data;
  renderMatch();
}

async function renderMatch() {
  const container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  const { data: prediction } = await _supabase
    .from('predictions')
    .select('*')
    .eq('user_id', user.id)
    .eq('match_id', currentMatch.id)
    .maybeSingle();
  
  const deadlinePassed = new Date(currentMatch.kickoff_time) < new Date();
  
  const card = document.createElement('div');
  card.className = 'match-card';
  
  card.innerHTML = `
    <div class="match-title">
      ${currentMatch.team_a} vs ${currentMatch.team_b}
      <span class="match-stage">${currentMatch.is_knockout ? 'KNOCKOUT' : 'GROUP STAGE'}</span>
      ${currentMatch.finished ? '<span class="match-stage" style="background:#4CAF50; color:white;">FINISHED</span>' : ''}
    </div>
    ${currentMatch.finished ? `<div class="result-display">FINAL SCORE: ${currentMatch.score_a} - ${currentMatch.score_b}</div>` : ''}
    ${!deadlinePassed && !currentMatch.finished ? `
      <div class="prediction-inputs">
        <input type="number" id="scoreA" min="0" max="10" placeholder="${currentMatch.team_a}" value="${prediction ? prediction.pred_score_a : ''}">
        <span style="font-size:24px;">-</span>
        <input type="number" id="scoreB" min="0" max="10" placeholder="${currentMatch.team_b}" value="${prediction ? prediction.pred_score_b : ''}">
      </div>
      <button class="submit-btn" onclick="savePrediction()">${prediction ? 'UPDATE PREDICTION' : 'SUBMIT PREDICTION'}</button>
    ` : currentMatch.finished && prediction ? `
      <div style="text-align:center; margin-top:15px; padding:15px; background:#f5f5f5; border-radius:10px;">
        Your prediction: ${prediction.pred_score_a} - ${prediction.pred_score_b}<br>
        ${prediction.points ? `Points earned: ${prediction.points}` : ''}
      </div>
    ` : deadlinePassed && !currentMatch.finished ? `<div style="text-align:center; color:#dc3545;">DEADLINE PASSED - Cannot submit predictions</div>` : ''}
    <div class="deadline">Kickoff: ${new Date(currentMatch.kickoff_time).toLocaleString()}</div>
  `;
  
  container.appendChild(card);
}

window.savePrediction = async function() {
  let scoreA = parseInt(document.getElementById('scoreA').value);
  let scoreB = parseInt(document.getElementById('scoreB').value);
  if (isNaN(scoreA)) scoreA = 0;
  if (isNaN(scoreB)) scoreB = 0;
  scoreA = Math.max(0, Math.min(10, scoreA));
  scoreB = Math.max(0, Math.min(10, scoreB));
  
  const { data: existing } = await _supabase
    .from('predictions')
    .select('id')
    .eq('user_id', user.id)
    .eq('match_id', currentMatch.id)
    .maybeSingle();
  
  if (existing) {
    await _supabase.from('predictions').update({ pred_score_a: scoreA, pred_score_b: scoreB }).eq('id', existing.id);
  } else {
    await _supabase.from('predictions').insert({ 
      user_id: user.id, 
      match_id: currentMatch.id, 
      pred_score_a: scoreA, 
      pred_score_b: scoreB 
    });
  }
  
  showMsg('Prediction saved!');
  loadMatch();
};

// LEADERBOARD FUNCTIONS
async function loadAvailableLeaderboards() {
  const { data, error } = await _supabase.from('leaderboards').select('*');
  if (error) return;
  
  const { data: myMemberships } = await _supabase
    .from('leaderboard_members')
    .select('leaderboard_id')
    .eq('user_id', user.id);
  
  const myLeaderboardIds = new Set(myMemberships?.map(m => m.leaderboard_id) || []);
  
  const container = document.getElementById('availableLeaderboards');
  container.innerHTML = '';
  
  for (const lb of data) {
    const { count } = await _supabase
      .from('leaderboard_members')
      .select('*', { count: 'exact', head: true })
      .eq('leaderboard_id', lb.id);
    
    const isMember = myLeaderboardIds.has(lb.id);
    const card = document.createElement('div');
    card.className = 'leaderboard-container';
    card.innerHTML = `
      <div class="leaderboard-header">
        <div>${lb.name}</div>
        <div>${count || 0} members</div>
        <div>${!isMember ? `<button class="join-btn" onclick="joinLeaderboard('${lb.id}', '${lb.code}')">JOIN</button>` : '<span class="joined-badge">? JOINED</span>'}</div>
      </div>
      <div style="padding: 15px 25px; color: #666;">
        <strong>Code:</strong> ${lb.code}<br>
        <strong>Description:</strong> ${lb.description || 'No description'}
      </div>
    `;
    container.appendChild(card);
  }
}

window.joinLeaderboard = async function(leaderboardId, code) {
  const { data: lb } = await _supabase.from('leaderboards').select('code').eq('id', leaderboardId).single();
  if (lb.code !== code) {
    showMsg('Invalid leaderboard code', true);
    return;
  }
  
  const { error } = await _supabase.from('leaderboard_members').insert({
    leaderboard_id: leaderboardId,
    user_id: user.id
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Joined leaderboard!');
    loadAvailableLeaderboards();
    loadMyLeaderboards();
  }
};

window.joinWithCode = async function() {
  const code = document.getElementById('joinCode').value;
  if (!code) {
    showMsg('Enter a leaderboard code', true);
    return;
  }
  
  const { data: lb, error } = await _supabase.from('leaderboards').select('id, code').eq('code', code).single();
  if (error || !lb) {
    showMsg('Invalid leaderboard code', true);
    return;
  }
  
  joinLeaderboard(lb.id, lb.code);
  document.getElementById('joinCode').value = '';
};

async function loadMyLeaderboards() {
  const { data, error } = await _supabase
    .from('leaderboard_members')
    .select('leaderboard_id, leaderboards(*)')
    .eq('user_id', user.id);
  
  if (error) return;
  
  const container = document.getElementById('myLeaderboardsList');
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="leaderboard-container" style="padding:40px; text-align:center;">You haven\'t joined any leaderboards yet. Go to LEADERBOARDS tab to join!</div>';
    return;
  }
  
  container.innerHTML = '';
  
  for (const item of data) {
    const lb = item.leaderboards;
    
    // Get all members and their points
    const { data: members } = await _supabase
      .from('leaderboard_members')
      .select('user_id')
      .eq('leaderboard_id', lb.id);
    
    const rankings = [];
    for (const member of members || []) {
      const { data: predPoints } = await _supabase
        .from('predictions')
        .select('points')
        .eq('user_id', member.user_id);
      
      const { data: profile } = await _supabase
        .from('profiles')
        .select('username')
        .eq('id', member.user_id)
        .single();
      
      const totalPoints = predPoints?.reduce((sum, p) => sum + (p.points || 0), 0) || 0;
      rankings.push({
        username: profile?.username || 'User',
        points: totalPoints,
        isCurrentUser: member.user_id === user.id
      });
    }
    rankings.sort((a, b) => b.points - a.points);
    
    const userRank = rankings.findIndex(r => r.isCurrentUser) + 1;
    const userPoints = rankings.find(r => r.isCurrentUser)?.points || 0;
    
    const card = document.createElement('div');
    card.className = 'leaderboard-container';
    card.innerHTML = `
      <div class="leaderboard-header">
        <div>${lb.name}</div>
        <div>${rankings.length} members</div>
        <div><button class="leave-btn" onclick="leaveLeaderboard('${lb.id}')">LEAVE</button></div>
      </div>
      <div style="padding: 15px 25px; background: #FFF3E0;">
        <strong>Your Rank:</strong> #${userRank} &nbsp;&nbsp;|&nbsp;&nbsp;
        <strong>Your Points:</strong> ${userPoints}
      </div>
      <div class="leaderboard-rankings"></div>
    `;
    
    const rankingsDiv = card.querySelector('.leaderboard-rankings');
    rankings.slice(0, 10).forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'ranking-row';
      row.innerHTML = `
        <div><strong>${i+1}</strong></div>
        <div>${r.username} ${r.isCurrentUser ? '(YOU)' : ''}</div>
        <div style="font-weight:bold;">${r.points}</div>
      `;
      rankingsDiv.appendChild(row);
    });
    
    container.appendChild(card);
  }
}

window.leaveLeaderboard = async function(leaderboardId) {
  const { error } = await _supabase
    .from('leaderboard_members')
    .delete()
    .eq('leaderboard_id', leaderboardId)
    .eq('user_id', user.id);
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Left leaderboard');
    loadAvailableLeaderboards();
    loadMyLeaderboards();
  }
};

// ADMIN FUNCTIONS
async function createLeaderboard() {
  const name = document.getElementById('newLeaderboardName').value;
  const code = document.getElementById('newLeaderboardCode').value;
  const desc = document.getElementById('newLeaderboardDesc').value;
  
  if (!name || !code) {
    showMsg('Enter name and code', true);
    return;
  }
  
  const { error } = await _supabase.from('leaderboards').insert({
    name: name,
    code: code.toUpperCase(),
    description: desc,
    created_by: user.id
  });
  
  if (error) {
    showMsg(error.message, true);
  } else {
    showMsg('Leaderboard created!');
    document.getElementById('newLeaderboardName').value = '';
    document.getElementById('newLeaderboardCode').value = '';
    document.getElementById('newLeaderboardDesc').value = '';
    loadAvailableLeaderboards();
  }
}

async function loadAdminMatches() {
  const { data, error } = await _supabase.from('matches').select('*').single();
  if (error) return;
  
  const container = document.getElementById('adminMatchesList');
  const match = data;
  
  const card = document.createElement('div');
  card.className = 'match-card';
  
  if (match.finished) {
    card.innerHTML = `
      <div class="match-title">${match.team_a} vs ${match.team_b}</div>
      <div class="result-display">RESULT: ${match.score_a} - ${match.score_b}</div>
      <button class="submit-btn reset-btn" onclick="resetMatchResult()">RESET RESULT</button>
    `;
  } else {
    card.innerHTML = `
      <div class="match-title">${match.team_a} vs ${match.team_b}</div>
      <div class="admin-result-inputs">
        <input type="number" id="adminScoreA" min="0" max="10" placeholder="${match.team_a} score">
        <span style="font-size:20px;">-</span>
        <input type="number" id="adminScoreB" min="0" max="10" placeholder="${match.team_b} score">
      </div>
      <button class="submit-btn admin-btn" onclick="setMatchResult()">SET RESULT & CALCULATE POINTS</button>
    `;
  }
  container.innerHTML = '';
  container.appendChild(card);
}

window.setMatchResult = async function() {
  let a = parseInt(document.getElementById('adminScoreA').value);
  let b = parseInt(document.getElementById('adminScoreB').value);
  if (isNaN(a)) a = 0;
  if (isNaN(b)) b = 0;
  a = Math.max(0, Math.min(10, a));
  b = Math.max(0, Math.min(10, b));
  
  // Update match
  const { error } = await _supabase
    .from('matches')
    .update({ score_a: a, score_b: b, finished: true })
    .eq('id', currentMatch.id);
  
  if (error) {
    showMsg(error.message, true);
    return;
  }
  
  // Calculate points for all users who predicted this match
  const { data: predictions } = await _supabase
    .from('predictions')
    .select('*')
    .eq('match_id', currentMatch.id);
  
  for (const pred of predictions || []) {
    let points = 0;
    
    // Exact score
    if (pred.pred_score_a === a && pred.pred_score_b === b) {
      points = 5;
    }
    // Correct winner/draw
    else if ((a > b && pred.pred_score_a > pred.pred_score_b) ||
             (a < b && pred.pred_score_a < pred.pred_score_b) ||
             (a === b && pred.pred_score_a === pred.pred_score_b)) {
      points = 3;
    }
    // Draw when actual win/loss OR win/loss when actual draw
    else if ((a !== b && pred.pred_score_a === pred.pred_score_b) ||
             (a === b && pred.pred_score_a !== pred.pred_score_b)) {
      points = 1;
    }
    
    await _supabase.from('predictions').update({ points: points }).eq('id', pred.id);
  }
  
  // Update total points for all users
  const { data: allUsers } = await _supabase.from('profiles').select('id');
  for (const profile of allUsers || []) {
    const { data: userPoints } = await _supabase
      .from('predictions')
      .select('points')
      .eq('user_id', profile.id);
    
    const total = userPoints?.reduce((sum, p) => sum + (p.points || 0), 0) || 0;
    await _supabase.from('profiles').update({ total_points: total }).eq('id', profile.id);
  }
  
  showMsg('Result set! Points calculated for all users!');
  loadMatch();
  loadAdminMatches();
  loadMyLeaderboards();
};

window.resetMatchResult = async function() {
  await _supabase
    .from('matches')
    .update({ score_a: null, score_b: null, finished: false })
    .eq('id', currentMatch.id);
  
  // Reset points for this match
  await _supabase.from('predictions').update({ points: 0 }).eq('match_id', currentMatch.id);
  
  // Recalculate all user totals
  const { data: allUsers } = await _supabase.from('profiles').select('id');
  for (const profile of allUsers || []) {
    const { data: userPoints } = await _supabase
      .from('predictions')
      .select('points')
      .eq('user_id', profile.id);
    
    const total = userPoints?.reduce((sum, p) => sum + (p.points || 0), 0) || 0;
    await _supabase.from('profiles').update({ total_points: total }).eq('id', profile.id);
  }
  
  showMsg('Result reset!');
  loadMatch();
  loadAdminMatches();
  loadMyLeaderboards();
};
