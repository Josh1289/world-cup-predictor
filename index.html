<!DOCTYPE html>
<html>
<head>
  <title>Debug - World Cup Matches</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px;">
  <h1>World Cup Matches Debug</h1>
  <div id="result">Checking database...</div>
  <div id="matches"></div>

<script>
// Direct connection - no login required for testing
const SUPABASE_URL = "https://igatvhqatxrhgnshmdld.supabase.co";
const SUPABASE_KEY = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkMatches() {
  const resultDiv = document.getElementById('result');
  const matchesDiv = document.getElementById('matches');
  
  resultDiv.innerHTML = 'Connecting to Supabase...';
  
  try {
    // Try to get matches
    const { data, error, count } = await supabase
      .from('matches')
      .select('*', { count: 'exact' });
    
    if (error) {
      resultDiv.innerHTML = 'ERROR: ' + error.message;
      return;
    }
    
    if (!data || data.length === 0) {
      resultDiv.innerHTML = 'No matches found in database!';
      return;
    }
    
    resultDiv.innerHTML = `SUCCESS! Found ${data.length} matches in database.`;
    
    // Display first 10 matches
    matchesDiv.innerHTML = '<h2>First 10 Matches:</h2>';
    for (let i = 0; i < Math.min(10, data.length); i++) {
      const match = data[i];
      matchesDiv.innerHTML += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px 0; border-radius:5px;">
          <strong>${match.team_a} vs ${match.team_b}</strong><br>
          Date: ${new Date(match.kickoff_time).toLocaleString()}<br>
          Stage: ${match.is_knockout ? 'Knockout' : 'Group'}<br>
          Finished: ${match.finished ? 'Yes' : 'No'}
        </div>
      `;
    }
    
  } catch (err) {
    resultDiv.innerHTML = 'ERROR: ' + err.message;
  }
}

checkMatches();
</script>
</body>
</html>
