<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
      min-height: 100vh;
      padding: 20px;
    }
    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    #loginBox h2 { text-align: center; font-size: 32px; margin-bottom: 30px; color: #FF6B35; }
    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }
    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
      display: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
    }
    .logout-btn {
      background: #dc3545;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .match-day-group {
      margin-bottom: 30px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .match-day-header {
      background: #FF6B35;
      padding: 15px 25px;
      color: white;
    }
    .match-day-date { font-size: 22px; font-weight: bold; }
    .match-day-count { font-size: 13px; opacity: 0.9; margin-top: 5px; }
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1px;
      background: #f0f0f0;
    }
    .match-card {
      background: white;
      padding: 20px;
      transition: all 0.3s;
    }
    .match-card:hover { background: #fff9f5; }
    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 2px solid #FF6B35;
    }
    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      background: #FFF3E0;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 10px;
      color: #FF6B35;
    }
    .result-display {
      text-align: center;
      background: #FFF3E0;
      color: #FF6B35;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }
    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }
    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
      color: #999;
    }
    .msg { margin-top: 20px; text-align: center; color: #FF6B35; }
  </style>
</head>
<body>

<div id="loginBox">
  <h2>WORLD CUP 2026</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<div id="mainPage">
  <div class="header">
    <h2>WORLD CUP 2026 PREDICTOR</h2>
    <div>
      <span id="userEmail"></span>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
  </div>
  <div id="matchesList"></div>
</div>

<script>
// Supabase with service role approach - using anon key but we'll try direct
const supabaseUrl = "https://igatvhqatxrhgnshmdld.supabase.co";
const supabaseKey = "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) {
    document.getElementById('msg').innerHTML = 'Enter email and password';
    return;
  }
  
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('msg').innerHTML = error.message;
    return;
  }
  
  currentUser = data.user;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmail').innerHTML = currentUser.email;
  
  // Load matches immediately
  await loadAllMatches();
}

async function signup() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) {
    document.getElementById('msg').innerHTML = 'Enter email and password';
    return;
  }
  if (password.length < 6) {
    document.getElementById('msg').innerHTML = 'Password must be at least 6 characters';
    return;
  }
  
  const { error } = await supabase.auth.signUp({ email, password });
  if (error) {
    document.getElementById('msg').innerHTML = error.message;
  } else {
    document.getElementById('msg').innerHTML = 'Account created! You can now login.';
  }
}

async function logout() {
  await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
}

async function loadAllMatches() {
  const container = document.getElementById('matchesList');
  container.innerHTML = '<div style="text-align:center; padding:40px;">Loading matches...</div>';
  
  // DIRECT QUERY - no filters, no joins
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*');
  
  console.log('=== DEBUG INFO ===');
  console.log('Matches data:', matches);
  console.log('Error:', error);
  console.log('Number of matches:', matches?.length);
  
  if (error) {
    container.innerHTML = `<div style="text-align:center; padding:40px; color:red;">ERROR: ${error.message}</div>`;
    return;
  }
  
  if (!matches || matches.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">No matches found in database. Please add matches.</div>';
    return;
  }
  
  // Group matches by date
  const grouped = {};
  matches.forEach(match => {
    const date = new Date(match.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(match);
  });
  
  // Render
  container.innerHTML = '';
  for (const [date, dayMatches] of Object.entries(grouped)) {
    const dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = `
      <div class="match-day-header">
        <div class="match-day-date">${date}</div>
        <div class="match-day-count">${dayMatches.length} matches</div>
      </div>
      <div class="matches-grid"></div>
    `;
    container.appendChild(dayGroup);
    
    const grid = dayGroup.querySelector('.matches-grid');
    
    for (const match of dayMatches) {
      const card = document.createElement('div');
      card.className = 'match-card';
      
      card.innerHTML = `
        <div class="match-title">
          ${match.team_a} vs ${match.team_b}
          <span class="match-stage">${match.is_knockout ? 'KNOCKOUT' : 'GROUP'}</span>
          ${match.finished ? '<span class="match-stage" style="background:#4CAF50; color:white;">FINISHED</span>' : ''}
        </div>
        ${match.finished ? `<div class="result-display">FINAL: ${match.score_a} - ${match.score_b}</div>` : ''}
        ${!match.finished ? `
          <div class="prediction-inputs">
            <input type="number" id="scoreA_${match.id}" min="0" max="10" placeholder="${match.team_a}">
            <span>-</span>
            <input type="number" id="scoreB_${match.id}" min="0" max="10" placeholder="${match.team_b}">
          </div>
          <button class="submit-btn" onclick="savePrediction('${match.id}')">SUBMIT PREDICTION</button>
        ` : ''}
        <div class="deadline">Kickoff: ${new Date(match.kickoff_time).toLocaleString()}</div>
      `;
      grid.appendChild(card);
    }
  }
}

window.savePrediction = async function(matchId) {
  const scoreA = parseInt(document.getElementById(`scoreA_${matchId}`).value);
  const scoreB = parseInt(document.getElementById(`scoreB_${matchId}`).value);
  if (isNaN(scoreA) || isNaN(scoreB)) {
    document.getElementById('msg').innerHTML = 'Enter both scores';
    return;
  }
  
  const { error } = await supabase.from('predictions').insert({
    user_id: currentUser.id,
    match_id: matchId,
    pred_score_a: Math.max(0, Math.min(10, scoreA)),
    pred_score_b: Math.max(0, Math.min(10, scoreB))
  });
  
  if (error) {
    document.getElementById('msg').innerHTML = 'Error: ' + error.message;
  } else {
    document.getElementById('msg').innerHTML = 'Prediction saved!';
  }
};

document.getElementById('loginBtn').onclick = login;
document.getElementById('signupBtn').onclick = signup;
document.getElementById('logoutBtn').onclick = logout;

// Auto-check session
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userEmail').innerHTML = currentUser.email;
    await loadAllMatches();
  }
})();
</script>
</body>
</html>
