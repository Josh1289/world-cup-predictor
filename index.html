<!DOCTYPE html>
<html>
<head>
  <title>World Cup Predictor 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
      transition: all 0.3s ease;
      min-height: 100vh;
      padding: 20px;
    }

    body.theme-orange {
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFD700 100%);
    }
    body.theme-orange .header, body.theme-orange .match-day-group, 
    body.theme-orange .leaderboard-container, body.theme-orange .filter-group,
    body.theme-orange #loginBox, body.theme-orange .match-card {
      background: white;
      color: black;
    }
    body.theme-orange .tab.active, body.theme-orange .leaderboard-header {
      background: #FF6B35;
      color: white;
    }
    body.theme-orange .submit-btn, body.theme-orange .admin-btn {
      background: #FF6B35;
      color: white;
    }

    body.theme-green {
      background: linear-gradient(135deg, #0a5c2e 0%, #0a3d1f 50%, #062a15 100%);
    }
    body.theme-green .header, body.theme-green .match-day-group,
    body.theme-green .leaderboard-container, body.theme-green .filter-group,
    body.theme-green #loginBox, body.theme-green .match-card {
      background: white;
      color: black;
    }
    body.theme-green .tab.active, body.theme-green .leaderboard-header {
      background: #2E7D32;
      color: white;
    }
    body.theme-green .submit-btn, body.theme-green .admin-btn {
      background: #2E7D32;
      color: white;
    }

    body.theme-night {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }
    body.theme-night .header, body.theme-night .match-day-group,
    body.theme-night .leaderboard-container, body.theme-night .filter-group,
    body.theme-night #loginBox, body.theme-night .match-card {
      background: rgba(30,30,50,0.95);
      color: white;
    }
    body.theme-night .tab.active, body.theme-night .leaderboard-header {
      background: #FFD700;
      color: #1a1a2e;
    }
    body.theme-night .submit-btn, body.theme-night .admin-btn {
      background: #FFD700;
      color: #1a1a2e;
    }

    body.theme-classic {
      background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
    }
    body.theme-classic .header, body.theme-classic .match-day-group,
    body.theme-classic .leaderboard-container, body.theme-classic .filter-group,
    body.theme-classic #loginBox, body.theme-classic .match-card {
      background: #f5f5dc;
      color: black;
    }
    body.theme-classic .tab.active, body.theme-classic .leaderboard-header {
      background: #8B4513;
      color: white;
    }
    body.theme-classic .submit-btn, body.theme-classic .admin-btn {
      background: #8B4513;
      color: white;
    }

    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    #loginBox h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
    }
    #loginBox input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
    }
    #loginBox button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s;
      color: white;
    }
    #loginBox button:hover {
      transform: translateY(-2px);
    }

    #mainPage {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .theme-selector {
      display: flex;
      gap: 8px;
    }
    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      transition: all 0.3s;
    }
    .theme-btn:hover {
      transform: scale(1.1);
    }
    .theme-orange-btn { background: #FF6B35; }
    .theme-green-btn { background: #2E7D32; }
    .theme-night-btn { background: #302b63; }
    .theme-classic-btn { background: #8B4513; }

    .admin-badge {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }
    .logout-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .tab {
      padding: 12px 30px;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tab.active {
      background: #FF6B35;
      color: white;
    }

    .match-day-group {
      margin-bottom: 30px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .match-day-header {
      padding: 15px 25px;
      color: white;
    }
    .match-day-date {
      font-size: 22px;
      font-weight: bold;
    }
    .match-day-count {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 5px;
    }
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1px;
      background: #e0e0e0;
    }
    .match-card {
      padding: 20px;
      transition: all 0.3s;
    }
    .match-card:hover {
      transform: translateX(5px);
    }
    .match-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .team-with-flag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .flag-img {
      width: 24px;
      height: 18px;
      border-radius: 2px;
    }
    .vs {
      font-weight: bold;
      font-size: 16px;
    }
    .match-stage {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 10px;
    }
    .group-letter {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 5px;
      background: #FF6B35;
      color: white;
    }
    .finished-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 10px;
      background: #4CAF50;
      color: white;
    }
    .result-display {
      text-align: center;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }
    .prediction-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
    }
    .prediction-inputs input {
      width: 80px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-weight: bold;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: all 0.3s;
      color: white;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
    }
    .deadline {
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
    }

    .leaderboard-container {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 15px 25px;
      font-weight: bold;
      color: white;
    }
    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      padding: 14px 25px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-group {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .filter-group select, .filter-group input {
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }
    .sort-btn {
      padding: 8px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      background: white;
    }
    .sort-btn.active {
      background: #FF6B35;
      color: white;
    }
    .stats {
      font-weight: bold;
      margin-left: auto;
    }
    .msg {
      margin-top: 20px;
      text-align: center;
    }

    .admin-result-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }
    .admin-result-inputs input, .admin-result-inputs select {
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }
    .reset-btn {
      background: #dc3545;
      color: white;
    }
  </style>
</head>
<body class="theme-orange">

<div id="loginBox">
  <h2>WORLD CUP 2026</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">SIGN IN</button>
  <button id="signupBtn">CREATE ACCOUNT</button>
  <div id="msg" class="msg"></div>
</div>

<div id="mainPage" style="display:none;">
  <div class="header">
    <div class="header-left">
      <h2>WORLD CUP 2026 PREDICTOR</h2>
      <div class="theme-selector">
        <div class="theme-btn theme-orange-btn" onclick="setTheme('orange')" title="World Cup Orange"></div>
        <div class="theme-btn theme-green-btn" onclick="setTheme('green')" title="Stadium Green"></div>
        <div class="theme-btn theme-night-btn" onclick="setTheme('night')" title="Night Match"></div>
        <div class="theme-btn theme-classic-btn" onclick="setTheme('classic')" title="Classic Football"></div>
      </div>
    </div>
    <div>
      <span id="userEmail"></span>
      <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>

  <div class="tabs">
    <button class="tab active" id="showPredictions">MATCH PREDICTIONS</button>
    <button class="tab" id="showLeaderboard">LEADERBOARD</button>

  </div>

  <div id="predictionsPanel">
    <div class="filter-group">
      <select id="matchFilter">
        <option value="all">All Matches</option>

      </select>
      <input type="text" id="teamSearch" placeholder="Search teams...">

        <button class="sort-btn active" data-sort="date">Sort by Date</button>
        <button class="sort-btn" data-sort="team">Sort by Team</button>

    </div>

    <div id="leaderboardList"></div>
  </div>

    <div class="filter-group">
      <select id="adminFilter">
        <option value="all">All Matches</option>
        <option value="pending">Pending Results</option>
        <option value="finished">Finished</option>
      </select>
      <input type="text" id="adminSearch" placeholder="Search teams...">
    </div>
    <div id="adminMatchesList"></div>
  </div>
</div>

<script>
function validateGoal(value) {
  var num = parseInt(value);
  if (isNaN(num)) return 0;
  if (num < 0) return 0;
  if (num > 10) return 10;
  return num;
}

function setTheme(theme) {
  document.body.className = 'theme-' + theme;
  localStorage.setItem('worldcup-theme', theme);
}

function loadTheme() {
  var savedTheme = localStorage.getItem('worldcup-theme');
  if (savedTheme) {
    document.body.className = 'theme-' + savedTheme;
  }
}

function getGroupLetter(teamA, teamB) {
  var groupTeams = {
    'A': ['Mexico', 'South Africa', 'South Korea', 'Czech Republic'],
    'B': ['Canada', 'Bosnia and Herzegovina', 'Qatar', 'Switzerland'],
    'C': ['Brazil', 'Morocco', 'Haiti', 'Scotland'],
    'D': ['USA', 'Paraguay', 'Australia', 'Turkey'],
    'E': ['Germany', 'Curacao', 'Ivory Coast', 'Ecuador'],
    'F': ['Netherlands', 'Japan', 'Sweden', 'Tunisia'],
    'G': ['Belgium', 'Egypt', 'Iran', 'New Zealand'],
    'H': ['Spain', 'Cape Verde', 'Saudi Arabia', 'Uruguay'],
    'I': ['France', 'Senegal', 'Iraq', 'Norway'],
    'J': ['Austria', 'Jordan', 'Argentina', 'Algeria'],
    'K': ['Portugal', 'DR Congo', 'Uzbekistan', 'Colombia'],
    'L': ['England', 'Croatia', 'Ghana', 'Panama']
  };
  
  for (var letter in groupTeams) {
    var teams = groupTeams[letter];
    if (teams.indexOf(teamA) !== -1 && teams.indexOf(teamB) !== -1) {
      return letter;
    }
  }
  return '';
}

var countryFlags = {
  'Mexico': 'MX', 'South Africa': 'ZA', 'South Korea': 'KR', 'Czech Republic': 'CZ',
  'Canada': 'CA', 'Bosnia and Herzegovina': 'BA', 'Qatar': 'QA', 'Switzerland': 'CH',
  'Brazil': 'BR', 'Morocco': 'MA', 'Haiti': 'HT', 'Scotland': 'GB-SCT',
  'USA': 'US', 'Paraguay': 'PY', 'Australia': 'AU', 'Turkey': 'TR',
  'Germany': 'DE', 'Curacao': 'CW', 'Ivory Coast': 'CI', 'Ecuador': 'EC',
  'Netherlands': 'NL', 'Japan': 'JP', 'Sweden': 'SE', 'Tunisia': 'TN',
  'Belgium': 'BE', 'Egypt': 'EG', 'Iran': 'IR', 'New Zealand': 'NZ',
  'Spain': 'ES', 'Cape Verde': 'CV', 'Saudi Arabia': 'SA', 'Uruguay': 'UY',
  'France': 'FR', 'Senegal': 'SN', 'Iraq': 'IQ', 'Norway': 'NO',
  'Austria': 'AT', 'Jordan': 'JO', 'Argentina': 'AR', 'Algeria': 'DZ',
  'Portugal': 'PT', 'DR Congo': 'CD', 'Uzbekistan': 'UZ', 'Colombia': 'CO',
  'England': 'GB-ENG', 'Croatia': 'HR', 'Ghana': 'GH', 'Panama': 'PA'
};

function getFlagUrl(country) {
  var code = countryFlags[country];
  if (!code) return '';
  return 'https://flagcdn.com/w40/' + code.toLowerCase() + '.png';
}

function getTeamHtml(teamName) {
  var flagUrl = getFlagUrl(teamName);
  return '<span class="team-with-flag"><img class="flag-img" src="' + flagUrl + '" alt="flag"> ' + teamName + '</span>';
}

var _supabase = window.supabase.createClient(
  "https://igatvhqatxrhgnshmdld.supabase.co",
  "sb_publishable_kZYMgSK-0VcalUaTuo7gfQ_7cMMse21"
);

var user = null;
var allMatches = [];
var currentSort = 'date';

function showMsg(text, isError) {
  var msgDiv = document.getElementById('msg');
  msgDiv.innerHTML = text;
  msgDiv.style.color = isError ? '#dc3545' : '#FF6B35';
  setTimeout(function() { msgDiv.innerHTML = ''; }, 3000);
}

async function login() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  
  var result = await _supabase.auth.signInWithPassword({ email: email, password: password });
  if (result.error) return showMsg(result.error.message, true);
  
  user = result.data.user;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('userEmail').innerHTML = user.email;
  
  if (user.email === 'admin@worldcup.com') {
    document.getElementById('adminBadge').style.display = 'inline-block';
    document.getElementById('showAdmin').style.display = 'inline-block';
  }
  
  loadMatches();
  loadLeaderboard();
}

async function signup() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  if (!email || !password) return showMsg('Enter email and password', true);
  if (password.length < 6) return showMsg('Password min 6 characters', true);
  
  var result = await _supabase.auth.signUp({ email: email, password: password });
  if (result.error) return showMsg(result.error.message, true);
  showMsg('Account created! You can now login.', false);
}

async function logout() {
  await _supabase.auth.signOut();
  user = null;
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainPage').style.display = 'none';
}

async function loadMatches() {
  var result = await _supabase.from('matches').select('*').order('kickoff_time');
  if (result.error) return;
  allMatches = result.data;
  document.getElementById('matchCount').textContent = result.data.length + ' matches';
  filterAndShowMatches();
}

function filterAndShowMatches() {
  var filtered = allMatches.slice();
  var stage = document.getElementById('matchFilter').value;
  var search = document.getElementById('teamSearch').value.toLowerCase();
  
  if (stage === 'group') filtered = filtered.filter(function(m) { return !m.is_knockout; });
  if (stage === 'knockout') filtered = filtered.filter(function(m) { return m.is_knockout; });
  if (search) filtered = filtered.filter(function(m) { 
    return m.team_a.toLowerCase().indexOf(search) !== -1 || m.team_b.toLowerCase().indexOf(search) !== -1;
  });
  
  if (currentSort === 'date') {
    filtered.sort(function(a,b) { return new Date(a.kickoff_time) - new Date(b.kickoff_time); });
  } else {
    filtered.sort(function(a,b) { return a.team_a.localeCompare(b.team_a); });
  }
  
  renderMatchesGroupedByDay(filtered);
}

async function renderMatchesGroupedByDay(matches) {
  var container = document.getElementById('matchesList');
  container.innerHTML = '';
  
  var predResult = await _supabase.from('predictions').select('*').eq('user_id', user.id);
  var predMap = {};
  if (predResult.data) {
    for (var i = 0; i < predResult.data.length; i++) {
      predMap[predResult.data[i].match_id] = predResult.data[i];
    }
  }
  
  var grouped = {};
  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    var date = new Date(m.kickoff_time).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  }
  
  for (var date in grouped) {
    var dayMatches = grouped[date];
    var dayGroup = document.createElement('div');
    dayGroup.className = 'match-day-group';
    dayGroup.innerHTML = '<div class="match-day-header"><div class="match-day-date">' + date + '</div><div class="match-day-count">' + dayMatches.length + ' matches</div></div><div class="matches-grid"></div>';
    container.appendChild(dayGroup);
    
    var grid = dayGroup.querySelector('.matches-grid');
    
    for (var i = 0; i < dayMatches.length; i++) {
      var match = dayMatches[i];
      var deadlinePassed = new Date(match.kickoff_time) < new Date();
      var userPred = predMap[match.id];
      var groupLetter = getGroupLetter(match.team_a, match.team_b);
      var groupHtml = groupLetter ? '<span class="group-letter">Group ' + groupLetter + '</span>' : '';
      
      var card = document.createElement('div');
      card.className = 'match-card';
      
      var predictionHtml = '';
      if (!deadlinePassed && !match.finished) {
        predictionHtml = '<div class="prediction-inputs">' +
          '<input type="number" id="scoreA_' + match.id + '" min="0" max="10" placeholder="' + match.team_a + '" value="' + (userPred ? userPred.pred_score_a : '') + '">' +
          '<span style="font-weight:bold;">-</span>' +
          '<input type="number" id="scoreB_' + match.id + '" min="0" max="10" placeholder="' + match.team_b + '" value="' + (userPred ? userPred.pred_score_b : '') + '">' +
          '</div>' +
          '<button class="submit-btn" onclick="savePrediction(\'' + match.id + '\')">' + (userPred ? 'UPDATE PREDICTION' : 'SUBMIT PREDICTION') + '</button>';
      } else if (match.finished && userPred) {
        predictionHtml = '<div style="text-align:center; margin-top:10px; padding:10px; border-radius:10px; background:#f5f5f5;">' +
          'Your prediction: ' + userPred.pred_score_a + ' - ' + userPred.pred_score_b + (userPred.points ? ' | POINTS: ' + userPred.points : '') +
          '</div>';
      } else if (deadlinePassed && !match.finished) {
        predictionHtml = '<div style="text-align:center;">DEADLINE PASSED</div>';
      }
      
      card.innerHTML = '<div class="match-title">' +
        getTeamHtml(match.team_a) + ' <span class="vs">VS</span> ' + getTeamHtml(match.team_b) +
        '<span class="match-stage">' + (match.is_knockout ? 'KNOCKOUT' : 'GROUP') + '</span>' +
        groupHtml +
        (match.finished ? '<span class="finished-badge">FINISHED</span>' : '') +
        '</div>' +
        (match.finished ? '<div class="result-display">FINAL SCORE: ' + match.score_a + ' - ' + match.score_b + '</div>' : '') +
        predictionHtml +
        '<div class="deadline">Kickoff: ' + new Date(match.kickoff_time).toLocaleString() + '</div>';
      
      grid.appendChild(card);
    }
  }
}

window.savePrediction = async function(matchId) {
  var scoreA = parseInt(document.getElementById('scoreA_' + matchId).value);
  var scoreB = parseInt(document.getElementById('scoreB_' + matchId).value);
  if (isNaN(scoreA)) scoreA = 0;
  if (isNaN(scoreB)) scoreB = 0;
  scoreA = Math.max(0, Math.min(10, scoreA));
  scoreB = Math.max(0, Math.min(10, scoreB));
  
  try {
    // First check if prediction exists
    var existingResult = await _supabase
      .from('predictions')
      .select('id')
      .eq('user_id', user.id)
      .eq('match_id', matchId)
      .maybeSingle();
    
    if (existingResult.error) {
      showMsg('Error checking prediction: ' + existingResult.error.message, true);
      return;
    }
    
    var result;
    if (existingResult.data) {
      // Update existing prediction
      result = await _supabase
        .from('predictions')
        .update({ 
          pred_score_a: scoreA, 
          pred_score_b: scoreB,
          updated_at: new Date()
        })
        .eq('id', existingResult.data.id);
    } else {
      // Insert new prediction
      result = await _supabase
        .from('predictions')
        .insert({ 
          user_id: user.id, 
          match_id: matchId, 
          pred_score_a: scoreA, 
          pred_score_b: scoreB 
        });
    }
    
    if (result.error) {
      if (result.error.code === '409') {
        showMsg('You already have a prediction for this match. Use UPDATE instead.', true);
      } else {
        showMsg('Error: ' + result.error.message, true);
      }
    } else {
      showMsg('Prediction saved!', false);
      loadMatches();
      loadLeaderboard();
    }
  } catch(err) {
    showMsg('Error: ' + err.message, true);
  }
};

async function loadLeaderboard() {
  var result = await _supabase.from('leaderboard').select('*').limit(50);
  if (result.error) {
    console.log('Leaderboard error:', result.error);
    return;
  }
  
  var container = document.getElementById('leaderboardList');
  if (!result.data || result.data.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px;">No users yet</div>';
    return;
  }
  
  container.innerHTML = '<div class="leaderboard-container"><div class="leaderboard-header"><div>RANK</div><div>PLAYER</div><div>POINTS</div></div><div id="leaderboardItems"></div></div>';
  
  var itemsDiv = container.querySelector('#leaderboardItems');
  for (var i = 0; i < result.data.length; i++) {
    var u = result.data[i];
    var item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = '<div>' + (i+1) + '</div><div>' + (u.username || 'User') + '</div><div style="font-weight:bold;">' + (u.total_points || 0) + '</div>';
    itemsDiv.appendChild(item);
  }
}

async function loadAdminMatches() {
  var result = await _supabase.from('matches').select('*').order('kickoff_time');
  if (result.error) return;
  renderAdminMatches(result.data);
}

function renderAdminMatches(matches) {
  var container = document.getElementById('adminMatchesList');
  var filter = document.getElementById('adminFilter').value;
  var search = document.getElementById('adminSearch').value.toLowerCase();
  
  var filtered = matches.slice();
  if (filter === 'pending') filtered = filtered.filter(function(m) { return !m.finished; });
  if (filter === 'finished') filtered = filtered.filter(function(m) { return m.finished; });
  if (search) filtered = filtered.filter(function(m) { return m.team_a.toLowerCase().indexOf(search) !== -1 || m.team_b.toLowerCase().indexOf(search) !== -1; });
  
  container.innerHTML = '';
  for (var i = 0; i < filtered.length; i++) {
    var match = filtered[i];
    var groupLetter = getGroupLetter(match.team_a, match.team_b);
    var groupHtml = groupLetter ? '<span class="group-letter">Group ' + groupLetter + '</span>' : '';
    
    var card = document.createElement('div');
    card.className = 'match-card';
    card.style.marginBottom = '20px';
    
    if (match.finished) {
      card.innerHTML = '<div class="match-title">' + getTeamHtml(match.team_a) + ' VS ' + getTeamHtml(match.team_b) + ' ' + groupHtml + '</div>' +
        '<div class="result-display">RESULT: ' + match.score_a + ' - ' + match.score_b + '</div>' +
        '<button class="submit-btn reset-btn" onclick="resetMatch(\'' + match.id + '\')">RESET RESULT</button>';
    } else {
      card.innerHTML = '<div class="match-title">' + getTeamHtml(match.team_a) + ' VS ' + getTeamHtml(match.team_b) + ' ' + groupHtml + '</div>' +
        '<div class="admin-result-inputs">' +
        '<input type="number" id="adminA_' + match.id + '" min="0" max="10" placeholder="' + match.team_a + ' score">' +
        '<span>-</span>' +
        '<input type="number" id="adminB_' + match.id + '" min="0" max="10" placeholder="' + match.team_b + ' score">' +
        '</div>' +
        (match.is_knockout ? '<select id="advance_' + match.id + '" style="width:100%; margin:10px 0; padding:10px; border:2px solid #e0e0e0; border-radius:8px;"><option value="">Who advanced?</option><option value="' + match.team_a + '">' + match.team_a + '</option><option value="' + match.team_b + '">' + match.team_b + '</option></select>' : '') +
        '<button class="submit-btn admin-btn" onclick="setResult(\'' + match.id + '\', ' + match.is_knockout + ')">SET RESULT AND CALCULATE</button>';
    }
    container.appendChild(card);
  }
}

window.setResult = async function(matchId, isKnockout) {
  var a = parseInt(document.getElementById('adminA_' + matchId).value);
  var b = parseInt(document.getElementById('adminB_' + matchId).value);
  if (isNaN(a)) a = 0;
  if (isNaN(b)) b = 0;
  a = Math.max(0, Math.min(10, a));
  b = Math.max(0, Math.min(10, b));
  
  var advance = null;
  if (isKnockout) {
    advance = document.getElementById('advance_' + matchId).value;
    if (!advance) return showMsg('Select advancing team', true);
  }
  
  var update = { score_a: a, score_b: b, finished: true };
  if (advance) update.advancing_team = advance;
  
  await _supabase.from('matches').update(update).eq('id', matchId);
  showMsg('Result set! Points calculated!', false);
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};

window.resetMatch = async function(matchId) {
  await _supabase.from('matches').update({ score_a: null, score_b: null, finished: false, advancing_team: null }).eq('id', matchId);
  showMsg('Result reset!', false);
  loadMatches();
  loadAdminMatches();
  loadLeaderboard();
};
